# Dev/End CI.
#
# The 2000-odd tests in this repo guard a lot that is invisible when broken: an
# unwinnable map, a path preview that lies, an economy that silently caps a
# skilled run. Until now they ran only when someone remembered to run them,
# which makes them a habit rather than a safety net.
#
# Runs on every push and every pull request, on both branches that matter:
# `dev` is where work lands and `main` is what deploys to Heroku, so a red
# `main` is a red release.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push to the same branch makes the previous run irrelevant. Cancelling
# it keeps the queue short without ever cancelling a `main` run, which is the
# one whose result gates a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      # Plain `tsc --noEmit` is a NO-OP in this repo: the root tsconfig has
      # `files: []` plus project references, and outside build mode tsc does not
      # traverse references, so it checks zero files and always passes. The
      # project flag is what actually checks src (see CLAUDE.md).
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      # Pinned at the current baseline rather than zero. Zero would mean either
      # a red board from day one or a rush of drive-by suppressions; pinning
      # means the count can only come down, and a new warning fails the build.
      # A ratchet, not a budget: it only ever moves DOWN. Lowered 26 -> 25
      # after two of them were fixed rather than tolerated. `npm run lint`
      # exits 0 on warnings, so this gate is the only thing that catches a new
      # one - check against THIS command, not the script, before pushing.
      - name: Lint
        run: npx eslint . --max-warnings 25

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # The device check (DEVICE_LAB.md) on emulated 2022 phones: their screens,
  # touch and user agents, with the CPU slowed to their class. It judges what a
  # slow phone can break without a slow frame rate showing it: the boot, the
  # menu and boards actually showing (pixels read back), the fences being
  # taken, and no error. Frame rate is reported, not judged: Chromium here draws
  # WebGL on a software GPU. Real phones and their rates are Firebase Test Lab's
  # (device-lab.yml).
  device-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tier: [flagship-2022, mid-2022, budget-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      # Its own limit: the system libraries come through apt, and a stalled
      # Ubuntu mirror once held this step until the whole job timed out.
      - name: Chromium
        timeout-minutes: 6
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Device check (${{ matrix.tier }})
        run: node scripts/device-check-emulated.mjs ${{ matrix.tier }} --out device-check-results

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-check-${{ matrix.tier }}
          path: device-check-results/
          if-no-files-found: ignore
