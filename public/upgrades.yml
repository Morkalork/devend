  # TOTAL COMPENSATION (Pickup payout enhancer)
  # Gated behind a fully upgraded Benefits Package. Each level improves EVERY
  # token payout: +1h on overtime and cap tokens, +1s on freeze charges, and
  # the Fork's split balls fly 5% slower per level (never below their type's
  # minimum speed). At level 3 the Fork splits a ball into THREE.
  # ===============================

  - id: total_compensation_junior
    name: Total Compensation
    tier: Junior
    description: Every power-up pays out better, and split balls come out slower.
    unlockLevel: 15
    prerequisites:
      - benefits_package_principal
    icon: crown
    tags: [risk]
    modifiers:
      pickupPayoutLevel: 1

  - id: total_compensation_senior
    name: Total Compensation
    tier: Senior
    description: Power-up payouts rise again, and split balls slow down further.
    unlockLevel: 17
    prerequisites:
      - total_compensation_junior
    tags: [risk]
    modifiers:
      pickupPayoutLevel: 1

  # Third tier is a CHOICE: the best perks, or the most perks.
  - id: total_compensation_principal
    name: Total Compensation
    tier: Principal
    description: "Peak perks. The ball splitter now splits a ball into three, and every token payout climbs another level once you own five other risk upgrades."
    unlockLevel: 19
    prerequisites:
      - total_compensation_senior
    choiceGroup: total_compensation_principal
    tags: [risk]
    modifiers:
      pickupPayoutLevel: 1
    # pickupPayoutLevel is a hybrid: a THRESHOLD at 3 (where the Fork splits a
    # ball into three) and a straight addend on overtime and cap-raise tokens.
    # The trunk already reaches 3, so this step only buys the addend, which is
    # why it can be granted without disturbing the fork behaviour.
    scaling: { tag: risk, key: pickupPayoutLevel, per: 1, every: 5, max: 5 }

  - id: total_compensation_principal_b
    name: Total Compensation
    tier: Principal
    description: "Profit Sharing: perks stay at the previous level, but tokens turn up far more often."
    unlockLevel: 19
    prerequisites:
      - total_compensation_senior
    choiceGroup: total_compensation_principal
    tags: [risk]
    modifiers:
      pickupChanceBonus: 0.06


