# Upgrade pricing (overtime economy rebalance).
# Base-game costs are computed at load time from the unlock level's base
# points x a tier factor (see src/lib/upgradePricing.ts):
#   cost = max(minCost, round(basePoints(unlockLevel) * tierFactor[tier]))
# Prices therefore scale automatically as new maps/upgrades are added.
# An explicit `cost:` on an upgrade overrides the formula (used for the
# ascension trio, whose post-L30 economy is tuned separately).
#
# Build archetypes (`tags`): every upgrade carries one or two tags — lock,
# freeze, bank, tempo, risk, safety. The shop weights its random offers toward
# tags the player already owns (draft coherence), and the card shows the tags
# as chips. See UpgradeTag in src/types/upgrade.ts.
pricing:
  minCost: 8
  # Market rates: effective prices multiply by this per completed 5-level
  # assignment block (levels 1-5 at face value, 6-10 x1.35, 11-15 x1.82...).
  # Keeps the flat per-map income scarce late-run. 1 disables inflation.
  blockInflation: 1.35
  # Factors are tuned against the lock-centric economy: base points is 20, so
  # a formula-priced Junior costs 40h. A no-lock clear (20h) can never afford
  # one. EXCEPTION: the three level-1 "first hire" Juniors carry an explicit
  # cost: 30 so a single normal lock on map 1 (20 + 12 = 32h) can buy one -
  # the opening store shouldn't require a superior lock. The sloppy-vs-superior
  # gap still gates the pricier (formula-40h+) hires on later maps.
  tierFactor:
    Junior: 2.0
    Senior: 2.7
    Principal: 3.7
    Architect: 4.8
    Wizard: 6.0

# Set bonuses: auto-granted for free while the player owns `threshold`
# upgrades of a tag. One per archetype, giving every build direction a goal.
# Modifiers use the same GameModifiers keys as upgrades.
tagSets:
  threshold: 3
  bonuses:
    - tag: lock
      name: Chain Reaction
      description: Every lock counts as one ball bigger for the simultaneous-trap multiplier.
      modifiers:
        simultaneousLockBonus: 1
    - tag: freeze
      name: Absolute Zero
      description: Frozen balls can be re-frozen immediately, no cooldown.
      modifiers:
        freezeNoCooldown: 1
    - tag: bank
      name: Framework Agreement
      description: All shop prices drop by 10%.
      modifiers:
        shopDiscountMultiplier: 0.9
    - tag: tempo
      name: Ship It
      description: Draw one additional fence at the same time.
      modifiers:
        additionalConcurrentFences: 1
    - tag: risk
      name: Double Or Nothing
      description: Push-your-luck payouts are doubled.
      modifiers:
        pushBonusMultiplier: 2
    - tag: safety
      name: Insurance Policy
      description: Gain 1 extra Continue.
      modifiers:
        extraContinues: 1

upgrades:

  # ===============================
  # RUNTIME OPTIMISATION (Ball Speed)
  # ===============================

  - id: runtime_optimisation_junior
    name: Runtime Optimisation
    tier: Junior
    description: Reduce ball speed by 5%.
    # First-hire discount: the level-1 Juniors are priced so a single normal
    # lock on map 1 (32h) can afford one, instead of needing a superior lock.
    cost: 30
    unlockLevel: 1
    icon: clock
    tags: [safety]
    modifiers:
      ballSpeedMultiplier: 0.95

  - id: runtime_optimisation_senior
    name: Runtime Optimisation
    tier: Senior
    description: Reduce ball speed by 10%.
    unlockLevel: 3
    prerequisites:
      - runtime_optimisation_junior
    tags: [safety]
    modifiers:
      ballSpeedMultiplier: 0.90

  # Principal is a CHOICE (choiceGroup, +50% cost): a flat 15% slow, or a milder
  # 5% slow plus one random ball crippled each map. The choiceGroup is named for
  # the old id so the runtime-augmentation certificate (which sources it) unlocks
  # from EITHER option (see useGameSession: cert credit uses choiceGroup).
  - id: runtime_optimisation_principal_a
    name: Runtime Optimisation
    tier: Principal
    description: Reduce all ball speed by 15%, and a further 2% for every other safety upgrade you own (up to 4).
    unlockLevel: 5
    prerequisites:
      - runtime_optimisation_senior
    choiceGroup: runtime_optimisation_principal
    tags: [safety]
    modifiers:
      ballSpeedMultiplier: 0.85
    # Slower still the more of the safety line you run.
    scaling: { tag: safety, key: ballSpeedMultiplier, per: -0.02, max: 4 }

  - id: runtime_optimisation_principal_b
    name: Runtime Optimisation
    tier: Principal
    description: "Reduce ball speed by 5%, and one random ball runs 50% slower each map."
    unlockLevel: 5
    prerequisites:
      - runtime_optimisation_senior
    choiceGroup: runtime_optimisation_principal
    tags: [safety, risk]
    modifiers:
      ballSpeedMultiplier: 0.95
      slowOneBallFactor: 0.5


  # ===============================
  # MEMORY FOOTPRINT (Ball Size)
  # ===============================

  - id: memory_footprint_junior
    name: Memory Footprint
    tier: Junior
    description: Reduce ball size by 5%.
    # First-hire discount (see runtime_optimisation_junior): affordable with a
    # single normal lock on map 1.
    cost: 30
    unlockLevel: 1
    icon: memory
    tags: [safety]
    modifiers:
      ballSizeMultiplier: 0.95

  - id: memory_footprint_senior
    name: Memory Footprint
    tier: Senior
    description: Reduce ball size by 10%.
    unlockLevel: 5
    prerequisites:
      - memory_footprint_junior
    tags: [safety]
    modifiers:
      ballSizeMultiplier: 0.90

  # Third tier is a CHOICE: shrink the BALL, or widen the POCKET. Superior locks
  # are graded against the BASE threshold, so Paging never makes a tight seal
  # cheaper - it only makes an ordinary lock easier to close.
  - id: memory_footprint_principal
    name: Memory Footprint
    tier: Principal
    description: Reduce ball size by 15%.
    unlockLevel: 10
    prerequisites:
      - memory_footprint_senior
    choiceGroup: memory_footprint_principal
    tags: [safety]
    modifiers:
      ballSizeMultiplier: 0.85

  - id: memory_footprint_principal_b
    name: Memory Footprint
    tier: Principal
    description: "Paging: balls shrink only 5%, but a ball locks in a noticeably roomier pocket."
    unlockLevel: 10
    prerequisites:
      - memory_footprint_senior
    choiceGroup: memory_footprint_principal
    tags: [safety]
    modifiers:
      ballSizeMultiplier: 0.95
      lockThresholdBonus: 4

  # Benchmarking (the map-highscore HUD bar, #45) used to live here, hanging off
  # Memory Footprint. It is now the `benchmarking` CERTIFICATE - see
  # certificates.yml. It buys information rather than power, and re-buying it
  # every run out of the same budget as an actual upgrade was a bad trade.

  # ===============================
  # FAST COMPILE (Fence Speed)
  # ===============================

  - id: fast_compile_junior
    name: Fast Compile
    tier: Junior
    description: Increase fence generation speed by 10%.
    # First-hire discount (see runtime_optimisation_junior): affordable with a
    # single normal lock on map 1.
    cost: 30
    unlockLevel: 1
    icon: fast-forward
    tags: [tempo]
    modifiers:
      fenceGenerationSpeedMultiplier: 1.10

  - id: fast_compile_senior
    name: Fast Compile
    tier: Senior
    description: Increase fence generation speed by 20%.
    unlockLevel: 5
    prerequisites:
      - fast_compile_junior
    tags: [tempo]
    modifiers:
      fenceGenerationSpeedMultiplier: 1.20

  # Third tier is a CHOICE: a flat fence speed, or one that ramps as the map goes
  # on. Incremental Build is slower on a map you finish in three cuts and much
  # faster on a long one.
  - id: fast_compile_principal
    name: Fast Compile
    tier: Principal
    description: Increase fence generation speed by 30%.
    unlockLevel: 10
    prerequisites:
      - fast_compile_senior
    choiceGroup: fast_compile_principal
    tags: [tempo]
    modifiers:
      fenceGenerationSpeedMultiplier: 1.30

  - id: fast_compile_principal_b
    name: Fast Compile
    tier: Principal
    description: "Incremental Build: fences start 10% faster, and speed up a further 5% with every fence you complete this map."
    unlockLevel: 10
    prerequisites:
      - fast_compile_senior
    choiceGroup: fast_compile_principal
    tags: [tempo, risk]
    modifiers:
      fenceGenerationSpeedMultiplier: 1.1
      fenceSpeedPerFence: 0.05


  # ===============================
  # HOT START (Instant Fences)
  # ===============================

  - id: hot_start_junior
    name: Hot Start
    tier: Senior
    description: First fence in each map generates instantly.
    unlockLevel: 5
    prerequisites:
      - fast_compile_senior
    icon: flame
    tags: [tempo]
    modifiers:
      instantFencesPerMap: 1

  - id: hot_start_principal
    name: Hot Start
    tier: Principal
    description: First two fences in each map generate instantly.
    unlockLevel: 10
    prerequisites:
      - hot_start_junior
    tags: [tempo]
    modifiers:
      instantFencesPerMap: 2

  # Last tier is a CHOICE: front-load the map with instant fences, or draw one
  # more fence at a time for the whole map.
  - id: hot_start_architect
    name: Hot Start
    tier: Architect
    description: First three fences in each map generate instantly.
    unlockLevel: 20
    prerequisites:
      - hot_start_principal
    choiceGroup: hot_start_architect
    tags: [tempo]
    modifiers:
      instantFencesPerMap: 3

  - id: hot_start_architect_b
    name: Hot Start
    tier: Architect
    description: "Warm Pool: only one instant fence per map, but you can draw an additional fence at the same time."
    unlockLevel: 20
    prerequisites:
      - hot_start_principal
    choiceGroup: hot_start_architect
    tags: [tempo]
    modifiers:
      instantFencesPerMap: 1
      additionalConcurrentFences: 1


  # ===============================
  # MULTITHREADING (Parallel Fence)
  # ===============================

  - id: multithreading_principal
    name: Multithreading
    tier: Principal
    description: Allow one additional fence to be in progress simultaneously.
    unlockLevel: 10
    prerequisites:
      - fast_compile_senior
    icon: split
    tags: [tempo]
    modifiers:
      additionalConcurrentFences: 1

  - id: ultrathreading_principal
    name: Ultrathreading
    tier: Principal
    description: "Draw one more fence at the same time, and another once you own five other tempo upgrades."
    unlockLevel: 30
    prerequisites:
      - multithreading_principal
    icon: layers
    tags: [tempo]
    modifiers:
      additionalConcurrentFences: 1

  # ===============================
  # PADDED ESTIMATE (Par Relief)
  # ===============================
  # Replaces the Garbage Collector line, whose bonusRemovalChance/Amount keys
  # were never read by any game logic: four upgrades across three families,
  # purchasable with real overtime, doing nothing while the Specs panel
  # cheerfully reported them as active.
  #
  # Par relief sells CONSISTENCY rather than multiplier, which is the one kind
  # of payoff a per-map overtime cap leaves room for. The under-par bonus caps
  # at 4h and is close to noise; the value is slack before the over-par cliff,
  # where one fence over costs 40% of the map base and three disable the space
  # bonus outright.
    # Ultrathreading scales, Multithreading does not. They grant the same key,
    # and scaling both would compound one structural resource from two places
    # (the Moonshot / Risk Appetite problem). This is the deeper of the two at
    # L30, so it carries the reward.
    scaling: { tag: tempo, key: additionalConcurrentFences, per: 1, every: 5, max: 5 }
  - id: padded_estimate_junior
    name: Padded Estimate
    tier: Junior
    description: Every map is scored against one extra fence of par.
    unlockLevel: 6
    icon: ruler
    tags: [tempo]
    modifiers:
      parBonus: 1

  - id: padded_estimate_senior
    name: Padded Estimate
    tier: Senior
    description: Every map is scored against two extra fences of par.
    unlockLevel: 14
    prerequisites:
      - padded_estimate_junior
    tags: [tempo]
    modifiers:
      parBonus: 1

  # The fork is a real opposition: Sandbagging buys SLACK, Overdelivery buys
  # REWARD. Sandbagging wins on a map that got away from you; Overdelivery
  # wins on one you clear well under par.
  #
  # The first design gave the second option "forgive one fence over par", which
  # was degenerate: forgiveness is arithmetically identical to raising par
  # (used - (par + n) equals (used - par) - n), so the two options scored the
  # same on every overrun and Sandbagging was strictly better for also lifting
  # the under-par bonus. A test caught it.
  - id: padded_estimate_principal
    name: Padded Estimate
    tier: Principal
    description: "Sandbagging: every map is scored against three extra fences of par, and a fourth once you own four other tempo upgrades."
    unlockLevel: 20
    prerequisites:
      - padded_estimate_senior
    choiceGroup: padded_estimate_principal
    tags: [tempo]
    modifiers:
      parBonus: 1
    # Caps at one extra fence of par, taking the Sandbagging line to four.
    # Par ranges from 3 to 9 across the map list, so on a par-3 map even this
    # is a large relative swing; a second step would defang the over-par
    # cliff the family is built around.
    scaling: { tag: tempo, key: parBonus, per: 1, every: 4, max: 4 }

  - id: padded_estimate_principal_b
    name: Padded Estimate
    tier: Principal
    description: "Overdelivery: par stays at two extra fences, but beating par pays double."
    unlockLevel: 20
    prerequisites:
      - padded_estimate_senior
    choiceGroup: padded_estimate_principal
    tags: [tempo, safety]
    modifiers:
      underParBonusMultiplier: 2

  - id: fault_tolerance_junior
    name: Fault Tolerance
    tier: Junior
    description: Gain 1 extra life.
    unlockLevel: 5
    icon: heart
    tags: [safety]
    modifiers:
      extraLives: 1

  - id: fault_tolerance_senior
    name: Fault Tolerance
    tier: Senior
    description: Gain 1 more extra life.
    unlockLevel: 10
    prerequisites:
      - fault_tolerance_junior
    tags: [safety]
    modifiers:
      extraLives: 1

  # Last tier is a CHOICE: one more whole-map retry, or per-hit protection that
  # never needs the retry. Soak the loss, or stop it happening.
  - id: fault_tolerance_architect
    name: Fault Tolerance
    tier: Architect
    description: Gain 1 more extra life.
    unlockLevel: 15
    prerequisites:
      - fault_tolerance_senior
    choiceGroup: fault_tolerance_architect
    tags: [safety]
    modifiers:
      extraLives: 1

  - id: fault_tolerance_architect_b
    name: Fault Tolerance
    tier: Architect
    description: "Redundancy: no extra life, but every map starts with two shields that each absorb a ball hit."
    unlockLevel: 15
    prerequisites:
      - fault_tolerance_senior
    choiceGroup: fault_tolerance_architect
    tags: [safety]
    modifiers:
      wallShieldsPerMap: 2


  # ===============================
  # GOLDEN PARACHUTE (Continue)
  # Runs no longer start with a free Continue - this is the buyable one.
  # Deliberately the single most expensive upgrade in the game (explicit cost
  # override; the runner-up is MicroManager at 200). A free Continue is also
  # granted on completing level 20 (see useGameSession FREE_CONTINUE_LEVEL);
  # the Insurance Policy set bonus and certificates remain the other sources.
  # ===============================

  - id: golden_parachute
    name: Golden Parachute
    tier: Wizard
    description: "Start each run with an extra Continue, and one more again once you own six other safety upgrades."
    unlockLevel: 5
    icon: life-buoy
    cost: 250
    tags: [safety]
    modifiers:
      extraContinues: 1


  # ===============================
  # PERFORMANCE BONUS (Score %)
  # ===============================
    # A Continue is a whole extra run at the level you died on, so this is the
    # stingiest step on the board: one more, and only for a safety build that
    # has bought six other cards in the archetype.
    scaling: { tag: safety, key: extraContinues, per: 1, every: 6, max: 6 }

  - id: performance_bonus_junior
    name: Performance Bonus
    tier: Junior
    description: Gain 5% more overtime per map.
    unlockLevel: 2
    icon: trending-up
    tags: [bank]
    modifiers:
      scoreMultiplier: 1.05

  - id: performance_bonus_senior
    name: Performance Bonus
    tier: Senior
    description: Gain 10% more overtime per map.
    unlockLevel: 5
    prerequisites:
      - performance_bonus_junior
    tags: [bank]
    modifiers:
      scoreMultiplier: 1.10

  # Third tier is a CHOICE: a flat rate on everything, or a smaller rate with a
  # much bigger reward for clearing well past the requirement.
  - id: performance_bonus_principal
    name: Performance Bonus
    tier: Principal
    description: Gain 15% more overtime per map, and a further 4% for every other bank upgrade you own (up to 5).
    unlockLevel: 8
    prerequisites:
      - performance_bonus_senior
    choiceGroup: performance_bonus_principal
    tags: [bank]
    modifiers:
      scoreMultiplier: 1.15
    # Pays for a committed bank build, not a stray pick.
    scaling: { tag: bank, key: scoreMultiplier, per: 0.04, max: 5 }

  - id: performance_bonus_principal_b
    name: Performance Bonus
    tier: Principal
    description: "Stock Options: only 5% more overtime per map, but the Space Optimization bonus pays double."
    unlockLevel: 8
    prerequisites:
      - performance_bonus_senior
    choiceGroup: performance_bonus_principal
    tags: [bank, risk]
    modifiers:
      scoreMultiplier: 1.05
      spaceBonusMultiplier: 2


  # ===============================
  # RUNWAY (reworked Venture Capital; ids kept for save-compat)
  # Hoard-side treasury perks: while the bank sits at/above the threshold when
  # a map starts, the perk applies (see src/lib/treasury.ts). Paid in
  # consistency, never score, so the flat economy stays intact. The tension
  # against Budget Cycle (spend-side) is the bank archetype's identity.
  # ===============================

  - id: venture_capital_senior
    name: Runway
    tier: Senior
    description: While you have 100h or more banked, one fence completes instantly at each map start.
    unlockLevel: 6
    prerequisites:
      - performance_bonus_senior
    icon: piggy-bank
    tags: [bank]
    modifiers:
      runwayInstantFenceAt: 100

  - id: venture_capital_principal
    name: Runway
    tier: Principal
    description: While you have 200h or more banked, you can grow one extra fence at a time.
    unlockLevel: 7
    prerequisites:
      - venture_capital_senior
    tags: [bank]
    modifiers:
      runwayConcurrentFenceAt: 200

  # Last tier is a CHOICE: a perk for HOARDING, or a perk for SPENDING. The rest
  # of the family rewards a fat balance, so this is where you can invert it.
  - id: venture_capital_architect
    name: Runway
    tier: Architect
    description: While you have 300h or more banked, tap a ball to freeze it for 2 seconds.
    unlockLevel: 11
    prerequisites:
      - venture_capital_principal
    choiceGroup: venture_capital_architect
    tags: [bank]
    modifiers:
      runwayFreezeAt: 300

  - id: venture_capital_architect_b
    name: Runway
    tier: Architect
    description: "Burn Rate: no banked-balance freeze, but every chunk you spend in the store grants an instant fence next map."
    unlockLevel: 11
    prerequisites:
      - venture_capital_principal
    choiceGroup: venture_capital_architect
    tags: [bank, risk]
    modifiers:
      spendInstantFencePerChunk: 1


  # ===============================
  # MICRO MANAGER (Per-Lock Speed)
  # ===============================

  # A single, deliberately pricey tier. The per-lock reduction is hard-capped
  # at 1% (see MAX_MICRO_MANAGER_PER_LOCK in useActiveModifiers.ts), so this
  # can't stack with the certificate/loadout past 1% or with the ball-speed
  # upgrades into a game-breaking slow. `cost` overrides the flat pricing.
  - id: micro_manager_principal
    name: MicroManager
    tier: Principal
    description: Each locked ball reduces all ball speeds by 1%, down to a 50% floor. One powerful, costly tier.
    unlockLevel: 8
    prerequisites:
      - runtime_optimisation_senior
    icon: sliders
    tags: [lock]
    cost: 200
    modifiers:
      microManagerPerLock: 0.01


  # ===============================
  # CODE REVIEW (Lock threshold)
  # The lock archetype's early opener: pockets slightly larger than the lock
  # limit still count, so early lock attempts land instead of missing by a
  # hair. Folded into lockWinThresholdPercent (base 10, see game-config.yml).
  # ===============================

  - id: code_review
    name: Code Review
    tier: Junior
    description: Sloppy pockets still count, a pocket up to 3% larger than the lock limit still locks its ball.
    unlockLevel: 2
    icon: clipboard-check
    tags: [lock]
    modifiers:
      lockThresholdBonus: 3


  # ===============================
  # SEVERANCE PACKAGE (Lock payoff)
  # Head of the lock archetype: turns every locked ball into flat overtime.
  # The bonus folds under the per-map cap with the rest of the lock bonus.
  # Principal is a CHOICE (choiceGroup, +50% cost) between a reliable flat
  # payout and a skill line that rewards Superior Locks (tight pockets).
  # ===============================

  - id: severance_package_junior
    name: Severance Package
    tier: Junior
    description: Each ball you lock away pays 5 bonus overtime hours (counted under the map cap).
    unlockLevel: 6
    icon: banknote
    tags: [lock]
    modifiers:
      overtimePerLock: 5

  - id: severance_package_senior
    name: Severance Package
    tier: Senior
    description: Locked balls now pay 10 bonus overtime hours each.
    unlockLevel: 12
    prerequisites:
      - severance_package_junior
    tags: [lock]
    modifiers:
      overtimePerLock: 5

  # Principal is a CHOICE: buy ONE. Option A is a reliable flat raise; option B
  # keeps the flat pay lower but pays a large bonus on Superior Locks (a ball
  # sealed into a tight pocket, see scoring-config.yml). Owning one locks out
  # the other. The choiceGroup id matches the tier so any future certificate
  # that sources it credits from EITHER option.
  - id: severance_package_principal_a
    name: Severance Package
    tier: Principal
    description: "Golden Handshake: every ball you lock away pays 15 bonus overtime hours."
    unlockLevel: 18
    prerequisites:
      - severance_package_senior
    choiceGroup: severance_package_principal
    tags: [lock]
    modifiers:
      overtimePerLock: 5

  - id: severance_package_principal_b
    name: Severance Package
    tier: Principal
    description: "Equity Package: locks still pay 10h, and each Superior Lock (a tight pocket) pays 20 more."
    unlockLevel: 18
    prerequisites:
      - severance_package_senior
    choiceGroup: severance_package_principal
    tags: [lock, risk]
    modifiers:
      overtimePerSuperiorLock: 20


  # ===============================
  # KNOWLEDGE TRANSFER (Lock -> Tempo)
  # Cross-archetype payoff: locks convert into fence speed for the map.
  # ===============================

  - id: knowledge_transfer_senior
    name: Knowledge Transfer
    tier: Senior
    description: Each ball locked away speeds up fence generation by 4% for the rest of the map.
    unlockLevel: 7
    prerequisites:
      - severance_package_junior
    icon: book-open
    tags: [lock, tempo]
    modifiers:
      fenceSpeedPerLock: 0.04


  # ===============================
  # FROZEN ASSETS (Freeze -> Lock)
  # The freeze archetype's payoff: freezing is no longer just a panic button,
  # a ball locked while frozen pays a multiplied lock bonus.
  # ===============================

  - id: frozen_assets_senior
    name: Frozen Assets
    tier: Senior
    description: Locking a ball while it is frozen pays double the lock bonus.
    unlockLevel: 8
    prerequisites:
      - feature_freeze_junior
    icon: gem
    tags: [freeze, lock]
    modifiers:
      frozenLockBonus: 1

  # Third tier is a CHOICE: freeze pays more, or freeze lasts longer. Cold Storage
  # keeps the doubled payout and buys time to actually close the pocket.
  - id: frozen_assets_principal
    name: Frozen Assets
    tier: Principal
    description: Locking a ball while it is frozen now pays triple the lock bonus, plus a further quarter-share for every other lock upgrade you own (up to 4).
    unlockLevel: 16
    prerequisites:
      - frozen_assets_senior
    choiceGroup: frozen_assets_principal
    tags: [freeze, lock]
    modifiers:
      frozenLockBonus: 1
    # Scales on LOCK, not freeze: this family is already freeze-flavoured, and
    # lock is the archetype with the fewest ways to express itself. 8 lock
    # upgrades exist outside this family, so the cap demands real commitment.
    scaling: { tag: lock, key: frozenLockBonus, per: 0.25, max: 4 }

  - id: frozen_assets_principal_b
    name: Frozen Assets
    tier: Principal
    description: "Cold Storage: frozen locks still pay double, but every freeze lasts a second longer."
    unlockLevel: 16
    prerequisites:
      - frozen_assets_senior
    choiceGroup: frozen_assets_principal
    tags: [freeze, lock]
    modifiers:
      ballFreezeDuration: 1


  # ===============================
  # EXPENSE ACCOUNT & WAR CHEST (Bank payoffs)
  # Bank stops being "number goes up": cheaper shopping keeps the bank fat,
  # and War Chest converts a fat bank into a calmer board.
  # ===============================

  - id: expense_account
    name: Expense Account
    tier: Senior
    description: All shop prices are 10% lower for the rest of the run, and 3% lower still for every other bank upgrade you own (up to 4).
    unlockLevel: 9
    prerequisites:
      - performance_bonus_junior
    icon: receipt
    tags: [bank]
    modifiers:
      shopDiscountMultiplier: 0.9
    # Buying power compounds with the rest of the bank line.
