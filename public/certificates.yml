certificates:

  # ═══════════════════════════════════════════════════
  # ON THE SHELF FROM THE START
  # Certificate Hours accrue from the very first run, and until these existed
  # there was nothing at all to spend them on: every other cert is gated behind
  # an upgrade chain, an achievement or lifetime spending. A currency you earn
  # for hours before you can spend any of it is a currency players forget they
  # have, so the store always has something to sell.
  # ═══════════════════════════════════════════════════

  - id: signing-bonus
    name: Signing Bonus
    description: Start every run with overtime hours already banked.
    unlockType: always
    # Three levels of +10. The first is the one that matters: 10h is most of a
    # first upgrade, so the opening shop is a real decision instead of a shelf
    # you cannot afford. Counted in the run score like the Head Start certs.
    levels:
      - cost: 4
        effect: { type: startingOvertime, value: 10 }
      - cost: 9
        effect: { type: startingOvertime, value: 10 }
      - cost: 15
        effect: { type: startingOvertime, value: 10 }

  - id: corporate-card
    name: Corporate Card
    description: The store sells to you however few balls you have locked.
    unlockType: always
    # The shop is normally earned: one lock, or two on a map with three or more
    # balls. Level 1 caps that at a single lock however busy the map; level 2
    # waives it, and the store is simply always open. See the requirement in
    # useGameSession (storeLockRelief).
    levels:
      - cost: 6
        effect: { type: storeLockRelief, value: 1 }
      - cost: 14
        effect: { type: storeLockRelief, value: 1 }

  # ═══════════════════════════════════════════════════
  # UPGRADE-CHAIN CERTIFICATES
  # Unlocked by buying the max-tier upgrade in a family
  # across 3 separate runs.
  # ═══════════════════════════════════════════════════

  - id: runtime-augmentation
    name: Runtime Augmentation
    description: Perpetually reduced ball speeds.
    unlockType: upgrade-chain
    sourceUpgradeId: runtime_optimisation_principal
    requiredRuns: 3
    levels:
      - cost: 3
        effect: { type: ballSpeedMultiplier, value: 0.95 }
      - cost: 5
        effect: { type: ballSpeedMultiplier, value: 0.95 }
      - cost: 8
        effect: { type: ballSpeedMultiplier, value: 0.95 }

  - id: memory-compression
    name: Memory Compression
    description: Perpetually smaller balls.
    unlockType: upgrade-chain
    sourceUpgradeId: memory_footprint_principal
    requiredRuns: 3
    levels:
      - cost: 3
        effect: { type: ballSizeMultiplier, value: 0.95 }
      - cost: 5
        effect: { type: ballSizeMultiplier, value: 0.95 }
      - cost: 8
        effect: { type: ballSizeMultiplier, value: 0.95 }

  - id: compile-cache
    name: Compile Cache
    description: Perpetually faster fence generation.
    unlockType: upgrade-chain
    sourceUpgradeId: fast_compile_principal
    requiredRuns: 3
    levels:
      - cost: 3
        effect: { type: fenceGenerationSpeedMultiplier, value: 1.05 }
      - cost: 5
        effect: { type: fenceGenerationSpeedMultiplier, value: 1.05 }
      - cost: 8
        effect: { type: fenceGenerationSpeedMultiplier, value: 1.05 }

  - id: warm-deploy
    name: Warm Deploy
    description: One instant fence at every map start.
    unlockType: upgrade-chain
    sourceUpgradeId: hot_start_architect
    requiredRuns: 3
    levels:
      - cost: 5
        effect: { type: instantFencesPerMap, value: 1 }
      - cost: 9
        effect: { type: instantFencesPerMap, value: 1 }

  - id: parallel-processing
    name: Parallel Processing
    description: One extra fence you can grow at a time.
    unlockType: upgrade-chain
    sourceUpgradeId: multithreading_principal
    requiredRuns: 3
    levels:
      - cost: 8
        effect: { type: additionalConcurrentFences, value: 1 }
      - cost: 15
        effect: { type: additionalConcurrentFences, value: 1 }

  - id: resilience-protocol
    name: Resilience Protocol
    description: Start every run with an extra life.
    unlockType: upgrade-chain
    sourceUpgradeId: fault_tolerance_architect
    requiredRuns: 3
    levels:
      - cost: 4
        effect: { type: extraLives, value: 1 }
      - cost: 7
        effect: { type: extraLives, value: 1 }
      - cost: 11
        effect: { type: extraLives, value: 1 }

  - id: performance-suite
    name: Performance Suite
    description: A permanently higher score multiplier.
    unlockType: upgrade-chain
    sourceUpgradeId: performance_bonus_principal
    requiredRuns: 3
    levels:
      - cost: 3
        effect: { type: scoreMultiplier, value: 1.05 }
      - cost: 5
        effect: { type: scoreMultiplier, value: 1.05 }
      - cost: 8
        effect: { type: scoreMultiplier, value: 1.05 }

  - id: investment-strategy
    name: Investment Strategy
    description: Balls spawn 1% slower per 50h banked.
    unlockType: upgrade-chain
    sourceUpgradeId: venture_capital_architect
    requiredRuns: 3
    levels:
      - cost: 4
        effect: { type: bankedSlowPer50h, value: 0.01 }
      - cost: 7
        effect: { type: bankedSlowPer50h, value: 0.01 }

  - id: process-optimiser
    name: Process Optimiser
    description: Ball speed drops 1% per locked ball, even without the upgrade.
    unlockType: upgrade-chain
    sourceUpgradeId: micro_manager_principal
    requiredRuns: 3
    # Single level: the per-lock reduction is capped at 1% total, so extra
    # levels would do nothing (see MAX_MICRO_MANAGER_PER_LOCK).
    levels:
      - cost: 6
        effect: { type: microManagerPerLock, value: 0.01 }

  - id: sprint-protocol
    name: Sprint Protocol
    description: One extra bounce in the path preview.
    unlockType: upgrade-chain
    sourceUpgradeId: scrum_master_6
    requiredRuns: 3
    levels:
      - cost: 5
        effect: { type: ballPathPredictionBounces, value: 1 }
      - cost: 9
        effect: { type: ballPathPredictionBounces, value: 1 }

  # ═══════════════════════════════════════════════════
  # ACHIEVEMENT-LOCKED CERTIFICATES
  # Unlocked by completing a specific achievement.
  # ═══════════════════════════════════════════════════

  - id: head-start-i
    name: Head Start I
    description: Begin every run at level 5.
    unlockType: achievement
    # NOTE: must match an existing id in achievements.yml ("reach level 25")
    sourceAchievementId: principal-engineer
    levels:
      - cost: 15
        effect: { type: startingLevelBonus, value: 5 }

  - id: head-start-ii
    name: Head Start II
    description: Begin every run at level 10.
    unlockType: achievement
    # NOTE: must match an existing id in achievements.yml ("50 flawless levels")
    sourceAchievementId: ci-cd-pipeline
    levels:
      - cost: 30
        effect: { type: startingLevelBonus, value: 10 }

  # ═══════════════════════════════════════════════════
  # HOURS-SPENT CERTIFICATES
  # Unlocked by spending Certificate Hours in this store.
  # ═══════════════════════════════════════════════════

  - id: equity-grant
    name: Equity Grant
    description: Start every map with part of the board already captured.
    unlockType: hours-spent
    requiredHoursSpent: 25
    levels:
      - cost: 12
        effect: { type: startingCapturePercent, value: 5 }
      - cost: 18
        effect: { type: startingCapturePercent, value: 3 }
      - cost: 25
        effect: { type: startingCapturePercent, value: 4 }

  # ═══════════════════════════════════════════════════
  # MORE ACHIEVEMENT-LOCKED CERTIFICATES
  # ═══════════════════════════════════════════════════

  - id: night-school-diploma
    name: Night School Diploma
    description: Bank extra Certificate Hours every run.
    unlockType: achievement
    # "Beyond The Backlog" — ascend past the final level
    sourceAchievementId: beyond-the-backlog
    levels:
      - cost: 10
        effect: { type: extraCertificateHours, value: 1 }
      - cost: 18
        effect: { type: extraCertificateHours, value: 1 }

  - id: bulk-licensing
    name: Bulk Licensing
    description: A permanent discount on all upgrade-shop prices.
    unlockType: achievement
    # "Staff Engineer" — reach level 30
    sourceAchievementId: staff-engineer
    levels:
      - cost: 10
        effect: { type: shopDiscountMultiplier, value: 0.93 }
      - cost: 16
        effect: { type: shopDiscountMultiplier, value: 0.95 }
      - cost: 22
        effect: { type: shopDiscountMultiplier, value: 0.95 }

  - id: risk-assessment-certified
    name: Risk Assessment Certified
    description: Push Your Luck bonuses pay out more.
    unlockType: achievement
    # "Calculated Risk" — bank 5 push bonuses
    sourceAchievementId: calculated-risk
    levels:
      - cost: 8
        effect: { type: pushBonusMultiplier, value: 1.5 }
      - cost: 14
        effect: { type: pushBonusMultiplier, value: 1.3 }
