  # vocabulary the other acts taught gets combined and then turned around. What
  # IS new is that these maps state their own win conditions rather than leaning
  # on the implicit clear, and PRICE them: a map that asks for something harder
  # than emptying the board pays for it.
  # ===========================================================================

  # 31 "Oncall" - FIGHT: terminals crossed with the one-way membrane.
