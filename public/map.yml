    level: 11
    sizeThreshold: 10
    expectedCuts: 5
    points: 20
    variety: 18
    maxBalls: 4
    entities:
      - id: wall-1
        kind: wall
        shape: rect
        x: 82
        'y': 350
        width: 748
        height: 200
      - id: mirror-1771832841446
        kind: wall
        mirror: true
        shape: rect
        x: 425
        'y': 75
        width: 20
        height: 233
      - id: mirror-1771837796058
        kind: wall
        mirror: true
        shape: rect
        x: 450
        'y': 575
        width: 20
        height: 233
  - id: level-12
    level: 12
    sizeThreshold: 10
    expectedCuts: 6
    points: 20
    variety: 20
    maxBalls: 3
    # THE TURN (C3), "Reorg": at 55% remaining one ball visibly divides in two,
    # the same cell division the level-10 boss does. Home of the mechanic now
    # that it is gated to level 11+ (DUPLICATION_MIN_LEVEL): level 11 already
    # introduces the rainbow ball, which multiplies balls on a timer, so a
    # second ball-multiplying idea there would muddle both. Three pillars and
    # three balls leaves room for a fourth to be worth reacting to.
    beats:
      - id: reorg
        atSpaceRemaining: 55
        spawnAdds: 1
        announce: game.beatReorg
    # Procedural (issue #53): three pillars, each a circle or a square block,
    # jittered within its own region so the classic tri-pillar board differs
    # every run (and is shared per Daily seed).
    slots:
      - id: pillar-tl
        candidates:
          - shape: circle
            weight: 2
            cx: [200, 320]
            cy: [200, 320]
            radius: [62, 92]
          - shape: rect
            weight: 1
            x: [170, 250]
            'y': [170, 250]
            width: [130, 180]
            height: [130, 180]
      - id: pillar-tr
        candidates:
          - shape: circle
            weight: 2
            cx: [580, 700]
            cy: [200, 320]
            radius: [62, 92]
          - shape: rect
            weight: 1
            x: [560, 640]
            'y': [170, 250]
            width: [130, 180]
            height: [130, 180]
      - id: pillar-b
        candidates:
          - shape: circle
            weight: 2
            cx: [380, 520]
            cy: [560, 700]
            radius: [62, 92]
          - shape: rect
            weight: 1
            x: [360, 440]
            'y': [560, 640]
            width: [130, 180]
            height: [130, 180]
  - id: level-13
    level: 13
    sizeThreshold: 8
    expectedCuts: 7
    points: 20
    variety: 25
    maxBalls: 4
    entities:
      # FORCE CACHE (design pattern 2): a hardened objective with a high
      # integrity budget. How cheaply it cracks depends on the map's ball
      # roster - a fast or heavy hit does far more damage than a slow, light
      # one, so committing balls to smashing it is a genuine risk/reward gamble.
      # (You can't fence-anchor on it either, so it shapes your cuts too.)
      - id: cache
        kind: wall
        shape: rect
        x: 400
        'y': 400
        width: 100
        height: 100
        breakable: true
        objective: true
        hitsToBreak: 7
      - id: wall-2
        kind: wall
        shape: rect
        x: 50
        'y': 400
        width: 100
        height: 100
      - id: wall-3
        kind: wall
        shape: rect
        x: 750
        'y': 400
        width: 100
        height: 100
      # Treasure chest (destruct-up): the heavier-balls reward here synergises
      # with this map's force cache (heavier balls crack the cache faster).
      - id: chest-13
        kind: wall
        shape: rect
        x: 620
        'y': 560
        width: 56
        height: 56
        chest: true
        breakable: true
        hitsToBreak: 2
  - id: level-14
    level: 14
    sizeThreshold: 8
    expectedCuts: 7
    points: 20
    variety: 25
    maxBalls: 4
    # Procedural (issue #53): top/bottom pillars and side blocks jitter each run,
    # with occasional extra debris in the mid band (chance + count showcase).
    slots:
      - id: pillar-top
        candidates:
          - shape: circle
            cx: [380, 520]
            cy: [170, 240]
            radius: [85, 108]
      - id: pillar-bottom
        candidates:
