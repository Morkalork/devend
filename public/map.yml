  # 33 "Code Freeze" - FIGHT: the 6x stacked hook crossed with a mover, and the
  # second ball you still have to answer for.
  #
  # Relocated from level 22 intact, and its geometry stays exactly as it was:
  # the alcove and nook margins are pinned against the lock-grade denominator
  # swing (codeFreezeMap.test.ts), so a stray obstacle or a moved lip would cost
  # the superior grade the whole map is built around. randomShapes stays 0.
  #
  # The win NAMES the compass. Only one ball can take the nook that is this
  # map's prize, so naming the other one means the map is not finished when the
  # greedy line pays out: the compass still has to be put away on the safe,
  # roomy lower line, and the map pays 30% for closing that out. The const box
  # stays a BONUS, not a gate: making it mandatory would delete the choice the
  # whole map exists to pose.
  #
  # The roster is pinned because the win names a ball. Left to the usual roll
  # the compass might not spawn at all, and a map whose win condition depends on
  # a ball that is not there is unwinnable through no fault of the player.
  - id: level-33
    level: 33
    sizeThreshold: 6
    expectedCuts: 9
    points: 20
    variety: 0
    # A stray mini-obstacle inside the nook would change its cell count and cost
    # the superior grade, so this map has to stay deterministic.
    randomShapes: 0
    # TWO balls, not three. The nook's superior grade is pinned against the
    # lock-grade denominator, which is max(active cells, initial / ACTIVE
    # BALLS): a third ball lowers that floor enough that the nook stops grading,
    # and the 6x hook this map exists for quietly becomes a 3x one. Raising it
    # was the first thing I tried and codeFreezeMap.test.ts caught it.
    maxBalls: 2
    # Yellow FIRST. The named ball is the one left over once the hook is taken,
    # so it must not be the ball a player instinctively herds into the nook, and
    # the map's own payout test seals the first ball into that nook to check the
    # 6x stack.
    ballTypeIds: [yellow, compass]
    win:
      require:
        - kind: space
          threshold: 6
        - kind: lockType
          ballType: compass
          count: 1
          bonusPercent: 30
      alsoWinIf:
        - kind: allLocked
    coloredAreas:
      - kind: const
        x: 630
        'y': 45
        width: 225
        height: 205
        required: false
    entities:
      # The alcove: a vertical lip hanging off the top edge and a horizontal lip
      # running to the right edge, overlapping in neither axis, so the way in is
      # a 60x60 corner gap that ONE short axis-aligned fence closes (the L1
      # vault pattern, mirrored into the top-right).
      - id: alcove-lip-v
        kind: wall
        shape: rect
        x: 604
        'y': -20
        width: 26
        height: 205
      - id: alcove-lip-h
        kind: wall
        shape: rect
        x: 690
        'y': 245
        width: 190
        height: 26
      # The shelf that makes the greedy line exist: it carves a 120x85 nook off
      # the back of the alcove, sealed by an 85-long fence at x=735.
      - id: nook-shelf
        kind: wall
        shape: rect
        x: 735
        'y': 130
        width: 140
        height: 24
      # The safe line has to be real or the hook is not a choice: the lower half
      # is an ordinary chamber behind a 100-wide neck, playable start to finish
      # without ever going near the const box. It is where the named ball gets
      # put away.
      - id: divider-left
        kind: wall
        shape: rect
        x: -20
        'y': 600
        width: 400
        height: 26
      - id: divider-right
        kind: wall
        shape: rect
        x: 480
        'y': 600
        width: 400
        height: 26
      # MEET the ball gate. The 100-wide neck into the safe lower line now
      # admits the compass and nothing else - which is the map's own thesis made
      # literal, because the compass is the ball the win names and the lower
      # line is where it has to be put away. Yellow is locked out of the safe
      # half, so the two balls can no longer be solved in the same place.
      #
      # Met inside a cross rather than on a map of its own: act IV is
      # combination-land and the gate is simple enough to read in one, and the
      # black ball it would most obviously pair with does not arrive until 25 -
      # which leaves no clean MEET slot that does not cost the seam or phasing
      # its only introduction.
      - id: compass-gate
        kind: wall
        shape: rect
        x: 380
        'y': 600
        width: 100
        height: 26
        passTypes: [compass]
      - id: sweeper
        kind: mover
        shape: circle
        cx: 430
        cy: 520
        radius: 42
        axis: horizontal
        range: 380
        speed: 140
        phase: 0.5

  # 34 "Crunch" - BREAK: the act's inversion, and the last playable map.
  #
  # Gravity is act III's signature and the player has spent ten maps learning to
  # read a pull and seal against it. Here the pull is pinned on for the whole
  # map and the win is not only the clear: TWO balls have to end up inside one
  # const box. Every instinct the ladder trained - split the board, seal each
  # ball where it happens to be, take the tightest pocket - is wrong. You have
  # to herd, on a board that is pulling, and the box pays 30% for it.
  #
  # The clear is still required alongside it, so herding is not a way to skip
  # the map: it is a second thing to do while doing the first.
  - id: level-34
    level: 34
    sizeThreshold: 5
    expectedCuts: 10
    points: 20
    variety: 16
    randomShapes: 10
    maxBalls: 4
    # Pinned because the map now names a ball type. Same rule as a win that
    # names a ball: a gate whose type never spawns is not a gate, it is a wall,
    # and nothing anywhere would say so. Grey is the one the gate admits.
    ballTypeIds: [grey, blue, yellow, purple]
    # No threadLockRequired. The win is the ZONE, and a lock count sitting
    # beside it is a second objective the win does not read: with an authored
    # `win:` block resolveWinSpec ignores this field entirely, so it only ever
    # reached the HUD, where it drew a Thread Locks card for a requirement that
    # could not affect the outcome.
    # Pinned, not hoped for. The whole map is authored around a live pull; a
    # gravity map that only sometimes pulls is a different map most of the time.
    mutator: gravity_well
    coloredAreas:
      - kind: const
        x: 350
        'y': 330
        width: 220
        height: 210
        required: true
    # Two balls in the box. That is the whole win.
    #
    # It used to ALSO require clearing to 5% remaining, and the two together
    # asked for something quite different from what either says. Getting to 5%
    # on a four-ball map means sealing every ball into a sliver, so the real
    # demand was "lock all four, and make two of them land in the zone" - and
    # since an authored spec carries no all-locked alternative, locking the last
    # ball with only one in the box did not merely fail to win, it tripped the
    # area fail check and lost the map outright.
    #
    # The zone is 220x210, a little over 7% of the arena, so the space clause
    # also asked the player to capture ground the win wanted them to be aiming
    # balls into. Under a live pull, with no aiming, that is not a hard map, it
    # is an incoherent one.
    win:
      require:
        - kind: area
          count: 2
          bonusPercent: 30
    entities:
      # A funnel either side of the box: under a live pull you cannot aim, so
      # the only way to steer a second ball in is to use the walls.
      - id: funnel-l
        kind: wall
        shape: rect
        x: 190
        'y': 300
        width: 26
        height: 200
      - id: funnel-r
        kind: wall
        shape: rect
        x: 690
        'y': 300
        width: 26
        height: 200
      - id: cap-l
        kind: wall
        shape: rect
        x: 45
        'y': 274
        width: 170
        height: 26
      - id: cap-r
        kind: wall
        shape: rect
        x: 690
        'y': 274
        width: 165
        height: 26
      - id: floor-post
        kind: wall
        shape: circle
        cx: 460
        cy: 700
        radius: 58
      # The gate, inverted - the act's BREAK applied to the newest mechanic.
      # On 33 the gate let the ball you needed through. Here it stands between
      # the box's right side and the right funnel, and it admits the GREY ball
      # only: the slow one, the one you least want taking up a place in a box
      # that needs two. The lane is open to exactly the wrong ball, and closed
      # to the three you would rather steer through it.
      - id: wrong-lane
        kind: wall
        shape: rect
        x: 600
        'y': 330
        width: 24
        height: 210
        passTypes: [grey]

  # 35 "End of Life" - BOSS: the finale, unchanged in what it asks and raised to
  # the act it now sits in. It was the one act IV map already pulling its
  # weight; it was still scored against the old, softer band.
  - id: level-35
    level: 35
    sizeThreshold: 14
    expectedCuts: 8
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 1
    # Four traps under a wipe and live minions: the longest fight in the
    # game, and the only one that has to survive two wipes on purpose.
    timeLimit: 115
    coloredAreas:
      - kind: var
        x: 500
        'y': 45
        width: 355
        height: 335
    # Boss (issue #64): all three gimmicks at once. A chained pair (fence-shredding
    # chain + phasing arena) that also wipes every fence on a timer and spits
    # OVERSIZED hotfixes. The capstone boss.
    boss:
      name: Production Outage
      intro: >-
        Everything at once, and everything you have learned. A chained pair that
        takes two traps each like the Merge Conflict, wipes the board every 25
        seconds like the Force Push, and spits oversized hotfixes like the Release
        Candidate. Wear both halves down, then fence them into the pink var area.
        Snag them on a pillar, save a freeze for the wipe, and ship it.
      creepFromStart: true
      objective:
        id: defeat-outage
        name: Resolve the Outage
        description: Wear both chained halves down, then fence them into the var area.
        clarify: >-
          Each half takes TWO traps. The first can be anywhere and costs nothing but
          the fence it reverts; the second must be inside the pink var area, and both
          halves must end up there. Their chain breaks fences and snags on the
          phasing pillars; every 25 seconds the boss wipes every fence (telegraphed
          by a stop and a vibrate), and it spits oversized minions throughout.
          Running out of time fails.
        kind: defeatBoss
        reward: 24
      bossBall:
        # The finale is the only fight carrying all three ideas at once: the
        # attrition of level 20 (hp on a pair), the wipe of level 30, and the
        # minions of level 10. Act IV's brief is combination rather than new
        # primitives, so nothing here is unfamiliar - there is just no longer a
        # moment when only one of them is happening.
        hp: 2
        count: 2
        chained: true
        radiusScale: 1.7
        speedScale: 1.15
        color: "#ff3b30"
        fenceWipeSeconds: 25
        spitIntervalSeconds: 9
        maxMinions: 3
        spawnEnlargedMinions: true
    entities:
      - id: phase-pillar-a
        kind: wall
        shape: circle
        cx: 300
        cy: 430
        radius: 52
        isPhasing: true
        phaseCycleSeconds: 10
      - id: phase-pillar-b
        kind: wall
        shape: circle
        cx: 600
        cy: 620
        radius: 52
        isPhasing: true
        phaseCycleSeconds: 13
