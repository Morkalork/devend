levels:
  # ===========================================================================
  # ACT I - ONBOARDING (1-10): the basics of sealing.
  #
  # This act used to spend TEN concepts in ten maps: chests at 4, a fence budget
  # at 5, reveals at 7, terminals at 8. Everything the game owns was on the
  # board before the player was fluent at sealing anything, and nothing was ever
  # revisited. It now owns SIX ideas and spends four of its maps developing them
  # (see MAP_DESIGN_GUIDELINES.md: Meet / Use / Fight / Break).
  #
  # Given up to act II: chests, reveals, terminals, the WIP limit, 4 balls.
  # ===========================================================================

  # -------------------------------------------------------------------------
  # Maps 1-5 are authored at variety 0 and randomShapes 0, deliberately.
  #
  # `variety` jitters every rect's width and height by up to +/-variety% about
  # its centre, so an authored 60-unit neck is not a 60-unit neck at runtime:
  # two 300-tall stubs at variety 10 move their facing edges 15 each, and the
  # gap arrives anywhere in [30, 90]. Half of that range is the band the gap
  # rule forbids. Seven shipping maps already land in it (see
  # runtimeGapRule.test.ts), and the authored-coordinate guard cannot see it.
  #
  # An onboarding map is the worst place to spend that: these five exist to
  # make one idea legible each, and a doorway whose width is a dice roll is the
  # opposite. They go back to jittering when the guard measures what ships.
  # -------------------------------------------------------------------------

  # 1 "First Commit" - MEET the doorway, and the choice to end early.
  #
  # Two rooms, one doorway, one ball. The only decision on the board is the one
  # the whole game is made of: locking every ball WINS the map outright (the
  # standing allLocked alternative in winSpec), and with one ball that means the
  # nook in the top-right corner is a button marked "finish now". Take it and
  # you get a superior lock and the Ship Early bonus on a board you barely
  # touched. Leave it and you clear to 60% for the space money with the ball
  # still loose.
  #
  # No mechanic, no Turn. A Turn needs a plan to disrupt and the player does not
  # have one yet; see MAP_DESIGN_GUIDELINES.md section 6.3.
  #
  # The nook is 155x150 = 3.5% of the board, comfortably under the 4% superior
  # bar at this map's denominator (one ball, so it never drops below the initial
  # cell count). Nothing points at it. Some players will seal there by accident
  # and get paid, which teaches pocket size better than any explanation.
  - id: level-1
    level: 1
    sizeThreshold: 40
    expectedCuts: 3
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 1
    win:
      require:
        - kind: space
          threshold: 40
        - kind: locks
          count: 1
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: nook-lip
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
    balls: []

  # 2 "Pair Programming" - MEET the second ball.
  #
  # The same doorway, narrowed from 210 to 150, and now two balls cross it on
  # their own schedules. Nothing else is new, which is the point.
  #
  # The second ball is what turns a lock into a decision rather than an ending.
  # On map 1 sealing the ball finished the map; here you can spend one ball on a
  # nook and keep playing, and the price is that the survivor has the whole
  # board to wreck your fences in and you have half the herding power left.
  #
  # A nook per chamber, both 155x150 and both superior-sized, so the choice is
  # which one to spend a ball on and not whether a pocket qualifies.
  - id: level-2
    level: 2
    sizeThreshold: 37
    expectedCuts: 4
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    # Both balls still have to be sealed, but now one has to go in each half.
    # `locks: 2` is not kept alongside it: on a two-ball map "one on each side"
    # already means both, and a second clause saying so would just be the same
    # requirement twice in the goal list. The jamb column at x=437 sits on the
    # midline this splits at, and the two nook lips are one per side, so the map
    # already had the shape - it was only ever asking for the easier thing.
    win:
      require:
        - kind: space
          threshold: 37
        - kind: splitLocks
          count: 1
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 330
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 525
        width: 26
        height: 330
      - id: nook-lip-right
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
      - id: nook-lip-left
        kind: wall
        shape: rect
        x: 45
        'y': 681
        width: 155
        height: 24
    balls: []

  # 3 "Standup" - MEET the marked zone.
  #
  # The game's first Colored Area, and it is the WIN: clear the board and lock
  # a ball inside the pink box. It used to be the bonus form (required: false),
  # on the theory that the first map to show a symbol must not punish misreading
  # it. Played, it read the other way round: a bright box on an otherwise bare
  # board that the win never mentions is a signal with nothing behind it, and
  # the map felt like map 2 with a decoration. A thing the map puts in front of
  # you is a promise, so the box is now the second line of the win. The lock
  # still pays 1.5x, so getting it right is paid as well as required. It
  # replaces `locks: 2`: two locks anywhere is the ask map 1 already made, and
  # one in the box is the thing this map is for.
  #
  # Drawn at 225x225 = 7.7% of the board, well ABOVE the 4% superior bar and on
  # purpose: this map teaches WHERE you locked, not how tightly. A box small
  # enough to look like the hardest kind would grade superior by itself and
  # collapse the two multipliers into one, which is the sizing trap in
  # MAP_DESIGN_GUIDELINES.md section 6.2. Superior stays maps 1 and 2's lesson.
  #
  # THE TURN, and the first one on the ladder: at 50% remaining the balls speed
  # up 20% for the rest of the map, telegraphed. Every fence timing the player
  # has just learned is now wrong, which is the cheapest legible complication
  # available this early - no mechanic on the board yet can open or close a
  # passage, and adding a ball is the axis of last resort.
  - id: level-3
    level: 3
    sizeThreshold: 34
    expectedCuts: 4
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 34
        - kind: area
          count: 1
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 330
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 525
        width: 26
        height: 330
      - id: nook-lip
        kind: wall
        shape: rect
        x: 630
        'y': 270
        width: 225
        height: 24
    coloredAreas:
      - kind: var
        x: 630
        'y': 45
        width: 225
        height: 225
    beats:
      - id: crunch
        atSpaceRemaining: 50
        speedSpike: 0.2
        announce: game.beatCrunchTime
    balls: []

  # 4 "Blocker" - MEET the mover, USE the marked zone.
  #
  # The guard walks across the box's open side, so closing the box is a
  # question of WHEN: a fence grown into the guard costs a life, and the only
  # fence that closes the box runs straight down the guard's beat. The lesson is
  # still "not can I draw this fence, but can I draw it NOW", and it is now
  # asked about the thing the win needs rather than about a doorway the win
  # never mentions.
  #
  # Reported from play: the first version put the guard on the doorway between
  # the halves and asked for one ball on each side, and the mover read as
  # scenery - nothing the map asked for involved it. A mover the win routes
  # around is an obstacle; a mover standing on the win is a decision.
  #
  # The box is map 3's box, in the same corner, on purpose: this is its USE
  # beat. Map 3 taught what the box wants; this map puts someone in front of it.
  # The guard is short (60) and slow (70/s) because this is a Meet: it stands
  # on the door's line under a third of the time, so a player who watches it
  # pass once can always find the window. An 80-wide guard at 80/s measured
  # 3 of 8 on the bot sweep; this one 10 of 16.
  #
  # First map that ROTATES (level >= 4). The guard, the box and its door turn
  # together, so every deal asks the same question. The Turn is a spawn rather
  # than a topple for the same reason - gravity does not rotate with the board.
  #
  # THE TURN, and it is map 3's turned inside out. Map 3's fires on SPACE, so it
  # answers what the player did; this one fires on the CLOCK at 50 seconds and
  # arrives whether or not they got anywhere. Same effect, opposite lesson: the
  # board reacts to you, and then it does not. A duplication beat would have
  # been the obvious choice and is a no-op below level 11 (DUPLICATION_MIN_LEVEL)
  # - it was in the first draft of this map and mapBeats.test.ts caught it.
  - id: level-4
    level: 4
    sizeThreshold: 31
    expectedCuts: 5
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    # The box, in place of `splitLocks`. One ball in it is the whole ask
    # beyond the clear, and it is the ask the guard stands on.
    win:
      require:
        - kind: space
          threshold: 31
        - kind: area
          count: 1
    coloredAreas:
      - kind: var
        x: 630
        'y': 45
        width: 225
        height: 225
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: nook-lip
        kind: wall
        shape: rect
        x: 630
        'y': 270
        width: 225
        height: 24
      # Home centre x 640, sweeping 540-740: across the box's door at x 630
      # and back out into the right-hand room, never reaching the jamb.
      - id: guard
        kind: mover
        shape: rect
        x: 610
        'y': 144
        width: 60
        height: 26
        axis: horizontal
        range: 200
        speed: 70
    beats:
      - id: crunch
        atSeconds: 50
        speedSpike: 0.15
        announce: game.beatCrunchTime
        leadMs: 2000
    balls: []

  # 5 "Technical Debt" - MEET the breakable, USE the mover.
  #
  # The divider has a soft section in it. Smash it and you own a SECOND doorway
  # into the right-hand chamber, at y 207-345, which the patrol never reaches -
  # it sweeps the lower doorway only. So the map quotes you two prices for the
  # same trip: walk the guarded doorway on the guard's schedule, or spend six
  # hits and go where it cannot follow. That is the whole lesson: a breakable is
  # not an obstacle, it is a price quoted in tempo.
  #
  # The slab does NOT enclose anything, and that is deliberate rather than
  # incidental. The first draft bricked up the pink pocket instead, and the
  # audit killed it: a fully sealed region is written off by
  # captureUnreachableCells as unreachable-hence-captured, so the vault started
  # the map already claimed, and a ball driven in after the break would land in
  # ground the player already owned and lock itself for free (the stranded-lock
  # rule). A breakable that seals a pocket is a free lock with extra steps.
  #
  # THE TURN: at 45% remaining the slab goes whether you were ready or not, with
  # a banner. It reads like a gift and is the opposite. Until it breaks, that
  # stretch of divider is WALL, and wall is what a fence anchors on: a player
  # part-way through sealing the top-right chamber has been leaning on it. The
  # deadline puts a hole in their anchor and a new mouth in the pocket they were
  # about to close. It is a real reason not to break it yourself.
  #
  # The two seams either side of the slab are 12 units, passages to nothing. The
  # doorway below it is 210. Those numbers only survive because this map is at
  # variety 0; see the note at the top of act I.
  - id: level-5
    level: 5
    sizeThreshold: 28
    expectedCuts: 5
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 28
        - kind: smashed
          count: 2
          of: shards
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 150
      - id: slab-1
        kind: wall
        shape: rect
        x: 437
        'y': 207
        width: 26
        height: 28
        brittle: true
      - id: slab-2
        kind: wall
        shape: rect
        x: 437
        'y': 243
        width: 26
        height: 28
        brittle: true
      - id: slab-3
        kind: wall
        shape: rect
        x: 437
        'y': 279
        width: 26
        height: 28
        brittle: true
      - id: slab-4
        kind: wall
        shape: rect
        x: 437
        'y': 315
        width: 26
        height: 28
        brittle: true
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: guard
        kind: mover
        shape: rect
        x: 300
        'y': 438
        width: 300
        height: 26
        axis: horizontal
        range: 280
        speed: 130
    # No colored areas. There were two bonus boxes here, one in each far
    # corner, and neither was in the win: two bright promises on the map that
    # introduces the shard, with nothing behind them. Reported from play as a
    # weird signal, and it contradicted this map's own premise - the verb,
    # with nothing else attached.
    beats:
      - id: deadline
        atSpaceRemaining: 45
        breakId: slab-2
        announce: game.beatDeadline
    balls: []

  # 6 "Merge Conflict" - FIGHT the breakable, USE the mover.
  #
  # Four of the twelve shards, down from six. The divider used to be a hidden
  # stack: break its bottom shard and the eleven above it toppled, on two
  # deals of four. That was a bug (shards never stack now), and it had been
  # doing most of the smashing: without it six of twelve measured 6 of 16 on
  # the sweep against 11 before, and four of twelve measures 12.
  #
  # No new mechanic. Map 5 taught that a breakable is a price you pay in tempo;
  # this one charges the opposite way round, because the fourth thing breaking a
  # wall does is the one nobody thinks about: it MERGES two regions into one.
  #
  # The divider is soft, and the balls chip it just by living. Nothing the
  # player does protects it - they can steer away from it, and that is the
  # skill - so the two-chamber board they are reading is on a clock they do not
  # control. Seal the far room while it is still a room, or clear the near one
  # safely and find the far one has become the same room.
  #
  # Two 66-unit necks, one at each end of the divider, are the honest way
  # through while it stands. Both are legal passages rather than the seams on
  # map 5: this map is about the wall in the middle, not about getting past it.
  #
  # No patrol, deliberately. Maps 4 and 5 are both about a mover and 7 and 9
  # both use one, and mechanicSpread flagged the act at seven movers in ten maps
  # when this map had one too - which is the "same gimmick every map" line in the
  # guidelines' own anti-pattern list. The pressure here is the wall's decay, and
  # a patrol on top of it would have been decoration charged as difficulty.
  #
  # THE TURN: at 55 seconds the divider goes whether the balls got there or not.
  # A clock rather than a threshold, because the whole map is a race against
  # something the player cannot stop, and a space trigger would have made it
  # something they caused.
  - id: level-6
    level: 6
    sizeThreshold: 25
    expectedCuts: 5
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 25
        - kind: smashed
          count: 4
          of: shards
    entities:
      - id: anchor-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 84
      - id: gate-1
        kind: wall
        shape: rect
        x: 437
        'y': 195
        width: 26
        height: 35
        brittle: true
      - id: gate-2
        kind: wall
        shape: rect
        x: 437
        'y': 238
        width: 26
        height: 35
        brittle: true
      - id: gate-3
        kind: wall
        shape: rect
        x: 437
        'y': 281
        width: 26
        height: 35
        brittle: true
      - id: gate-4
        kind: wall
        shape: rect
        x: 437
        'y': 324
        width: 26
        height: 35
        brittle: true
      - id: gate-5
        kind: wall
        shape: rect
        x: 437
        'y': 367
        width: 26
        height: 35
        brittle: true
      - id: gate-6
        kind: wall
        shape: rect
        x: 437
        'y': 410
        width: 26
