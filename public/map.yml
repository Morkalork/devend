  # 30 "Force Push" - BOSS. Act III closes on the board acting on its own
  # schedule, turned on the one thing the player owns: every twenty seconds the
  # black builds stop, shudder, and shatter every fence on the board, finished
  # or not. Nothing outlives the next push, so this is not a boss you grind
  # down: it is clean traps, each built from scratch inside a single window.
  # The wind-up is the window's start and the tell (they stand still), and a
  # freeze held over the wipe buys a second look at it.
  # Two builds, one slow and one fast, and two light boxes in opposite corners
  # (bottom left, top right). Each build is one trap into either box; trapped
  # anywhere else it costs a life (mapFailure bossOutside). The slow one is the
  # build you can plan a trap around; the fast one is the reason you cannot
  # leave it for last and still have time. A trapped build stays trapped
  # through the next push: the wipe takes fences, never a locked pocket.
  # The two posts are the anchors a fast trap is built against, one per box:
  # each sits a fence's length from its box's open side, so the window is one
  # fence to cut the box's side off and one to close it. A boss sits below the
  # map before it (section 5): the fight is the objective, not the clear.
