levels:
  # ===========================================================================
  # ACT I - ONBOARDING (1-10): the basics of sealing.
  #
  # This act used to spend TEN concepts in ten maps: chests at 4, a fence budget
  # at 5, reveals at 7, terminals at 8. Everything the game owns was on the
  # board before the player was fluent at sealing anything, and nothing was ever
  # revisited. It now owns SIX ideas and spends four of its maps developing them
  # (see MAP_DESIGN_GUIDELINES.md: Meet / Use / Fight / Break).
  #
  # Given up to act II: chests, reveals, terminals, the WIP limit, 4 balls.
  # ===========================================================================

  # 1 "First Commit" - MEET the seal.
  # One ball, two soft chambers, a neck too wide to fail at. The onboarding map
  # teaches the verb once (onboardingMap.ts, first run only), so this one only
  # has to teach that a SHAPE can be sealed. The corner shelf is the first
  # superior-sized pocket in the game and nothing draws attention to it: some
  # players will seal there by accident and get paid, which is a better first
  # lesson about pocket size than any explanation.
  - id: level-1
    level: 1
    sizeThreshold: 40
    expectedCuts: 3
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 1
    entities:
      - id: stub-top
        kind: wall
        shape: rect
        x: 425
        'y': 25
        width: 25
        height: 200
      - id: stub-bottom
        kind: wall
        shape: rect
        x: 450
        'y': 675
        width: 26
        height: 200
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 700
        'y': 475
        width: 175
        height: 25
      - id: wall-1788189135085
        kind: wall
        shape: rect
        x: 25
        'y': 475
        width: 175
        height: 25
    balls: []

  # 2 "Pair Programming" - MEET the second ball.
  # The same wide neck, now crossed by two balls on their own schedules. Nothing
  # else changes, which is the point: the difficulty is entirely the second ball.
  - id: level-2
    level: 2
    sizeThreshold: 34
    expectedCuts: 4
    points: 20
    variety: 8
    randomShapes: 6
    maxBalls: 2
    entities:
      - id: divider-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 280
      - id: divider-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 620
        width: 26
        height: 235
      - id: pillar
        kind: wall
        shape: circle
        cx: 700
        cy: 475
        radius: 70
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 150
        'y': 450
        width: 150
        height: 125
        bend: -0.427
    balls: []

  # 3 "Standup" - USE the topology: the necks ARE the hook.
  # An alcove in the top-left whose only way in is a corner gap one short fence
  # closes. Sized at roughly 150x150 on purpose, comfortably under 4% of the
  # board, so a seal there grades SUPERIOR and pays double. The right-hand half
  # is an ordinary two-chamber map and clears the threshold on its own, which is
  # the safe skip that makes the alcove a decision rather than a requirement.
  - id: level-3
    level: 3
    sizeThreshold: 30
    expectedCuts: 4
    points: 20
    variety: 8
    randomShapes: 6
    maxBalls: 2
    entities:
      - id: alcove-lip-v
        kind: wall
        shape: rect
        x: 250
        'y': 25
        width: 22
        height: 90
      - id: alcove-lip-h
        kind: wall
        shape: rect
        x: 25
        'y': 250
        width: 90
        height: 22
      - id: spine-top
        kind: wall
        shape: rect
        x: 550
        'y': 45
        width: 24
        height: 300
      - id: spine-bottom
        kind: wall
        shape: rect
        x: 550
        'y': 620
        width: 24
        height: 235
    balls: []
    coloredAreas:
      - kind: var
        x: 25
        'y': 25
        width: 225
        height: 225
        required: false

  # 4 "Blocker" - MEET the mover.
  # A patrol crossing the one neck, so the question stops being "can I draw this
  # fence" and becomes "can I draw it NOW". First map that rotates (level >= 4),
  # which is why the pocket sits in a corner rather than against one edge.
  - id: level-4
    level: 4
    sizeThreshold: 28
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    entities:
      - id: divider-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: divider-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 650
        width: 26
        height: 205
      - id: guard
        kind: mover
        shape: rect
        x: 300
        'y': 475
        width: 300
        height: 26
        axis: horizontal
        range: 280
        speed: 130
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 700
        'y': 200
        width: 155
        height: 22
    balls: []

  # 5 "Nice To Have" - USE the marked zone: the game's first Colored Area.
  # A BONUS var pocket (required: false), so ignoring it costs nothing and the
  # first map that shows the pink box cannot punish you for misreading it. By
  # L10 the same box is the boss's win gate and the symbol is already familiar.
  #
  # Drawn at 225x225, well ABOVE 4% of the board, deliberately: it marks WHERE
  # you locked, not how tightly, and a box small enough to look "hardest" would
  # grade superior by itself and collapse the two multipliers into one.
  - id: level-5
    level: 5
    sizeThreshold: 26
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    coloredAreas:
      - kind: var
        x: 600
        'y': 625
        width: 275
        height: 250
      - kind: let
        x: 0
        'y': 625
        width: 300
        height: 250
    entities:
      - id: pocket-shelf
        kind: wall
        shape: rect
        x: 575
        'y': 600
        width: 350
        height: 24
      - id: pocket-lip
        kind: wall
        shape: rect
        x: -25
        'y': 600
        width: 350
        height: 25
      - id: guard
        kind: mover
        shape: rect
        x: 400
        'y': 575
        width: 110
        height: 26
        axis: horizontal
        range: 260
        speed: 150
    balls:
      - id: ball-1788421889336
        initialSpeed: 300
        topSpeed: 600
        color: 00d4ff
        startX: 725
        startY: 150
    win:
      require:
        - kind: area
          count: 1
      alsoWinIf: []

  # 6 "Legacy Wall" - MEET the breakable.
  # A thin wall across the board with the good space behind it. Smashing costs
  # time you could have spent sealing, which is the whole lesson: a breakable is
  # a price, not a door. Geometry kept from the map that already taught this.
  - id: level-6
    level: 6
    sizeThreshold: 24
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    entities:
      # The RAIL: two nested arcs, both bowed back towards the plunger, making
      # a channel the shot runs rather than a face it meets.
      #
      # A ball in this engine REFLECTS; it never slides. It only follows a curve
      # by striking it again and again, which happens on a CONCAVE face and only
      # while it arrives shallow - so a wall bowed the other way is a hump, and
      # every shot leaves it on the first touch. That is the bounce.
      #
      # Two arcs and not one because the launcher FANS its roster across half
      # its cone (fanDirections, +/-17.5 degrees): the balls never take the same
      # line, so a single face carries one and throws the other away, and even
      # for the one it carries it is a knife edge - measured, the old shape went
      # from riding the curve to bouncing off it inside five degrees of aim. A
      # channel does not care which line a ball entered on.
      #
      # Both arcs ARE breakable, with a deep bank of hits, and that is doing two
      # jobs at once. Riding a wall damages it - about 2.5 of 3 hits within
      # thirty seconds - so at the usual 3 the rail would vanish partway through
      # the map; at 14 it survives a shot and still yields to a player who
      # decides the space behind it is worth the time. Which is exactly this
      # level's lesson, and it is also what lets the rail sit in front of the
      # muzzle at all: launcherRunway skips breakables on purpose, because
      # firing into one is a legitimate opening rather than a blocked barrel.
      - id: guide
        kind: wall
        shape: rect
        x: 380
        'y': 110
        width: 26
        height: 620
        bend: -0.7
        breakable: true
        hitsToBreak: 14
      - id: lane
        kind: wall
        shape: rect
        x: 280
        'y': 220
        width: 22
        height: 460
        bend: -0.8
        breakable: true
        hitsToBreak: 14
      # The breakable this level teaches, kept clear of the rail. It used to be
      # the rail as well, and was failing at both jobs.
      - id: soft-wall
        kind: wall
        shape: rect
        x: 640
        'y': 250
        width: 26
        height: 400
        breakable: true
        hitsToBreak: 3
      - id: nub
        kind: wall
        shape: circle
        cx: 225
        cy: 525
        radius: 45
        bend: 0.95
      - id: wall-1788191964368
        kind: wall
        shape: circle
        cx: 225
        cy: 375
        radius: 45
        bend: -0.95
      # Moved to the bottom-left corner, firing up and across the board.
      # Its old spot (500,650 at -120) cannot work: the muzzle needs 225 units
      # of clear board in front of it (launcherMaps.test.ts), and by 225 units
      # the fan has already thrown the two balls far enough apart that no
      # channel narrow enough to steer one of them can catch both.
      - id: launcher-1788422810361
        kind: launcher
        shape: rect
        x: 160
        'y': 700
        width: 190
        height: 96
        facing: right
        angle: -45
    balls: []

  # 7 "Refactor" - FIGHT: the breakable crossed with the mover, and the act's
  # first TURN.
  # Nothing new on the board; both halves are already known, and the map is the
  # question of which order to spend them in. The speed spike is telegraphed a
  # beat early so the Turn is fair (MAP_DESIGN_GUIDELINES.md convention 3).
  - id: level-7
    level: 7
    sizeThreshold: 22
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 10
    maxBalls: 2
    entities:
      - id: gate
        kind: wall
        shape: rect
        x: 225
        'y': 150
        width: 25
        height: 625
        breakable: true
        hitsToBreak: 4
      - id: patrol
        kind: mover
        shape: circle
        cx: 450
        cy: 475
        radius: 45
        axis: vertical
        range: 525
        speed: 150
        bend: -0.41
      - id: wall-1788192072207
        kind: wall
        shape: rect
        x: 650
        'y': 150
        width: 25
        height: 625
        breakable: true
        hitsToBreak: 4
    beats:
      - id: crunch
        atSpaceRemaining: 50
        speedSpike: 0.15
        announce: game.beatCrunchTime
    balls: []

  # 8 "Scope" - FIGHT: the marked zone behind a guarded chokepoint, with three
  # balls. Also where POWER-UP TOKENS begin (game-config.yml pickups.start_level
  # is 8), and the first map in the game to curate where they land: a token that
  # spawns in a corner you already sealed is a token nobody can reach.
  - id: level-8
    level: 8
    sizeThreshold: 20
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 10
    maxBalls: 3
    coloredAreas:
      - kind: var
        x: 45
        'y': 620
        width: 220
        height: 225
        required: false
    pickupSpots:
      - { x: 650, y: 200 }
      - { x: 250, y: 250 }
      - { x: 680, y: 700 }
    entities:
      - id: pocket-shelf
        kind: wall
        shape: rect
        x: 45
        'y': 596
        width: 240
        height: 24
      - id: pocket-lip
        kind: wall
        shape: rect
        x: 265
        'y': 700
        width: 24
        height: 155
      - id: choke-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 330
      - id: choke-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 675
        width: 26
        height: 180
      - id: guard
        kind: mover
        shape: rect
        x: 400
        'y': 480
        width: 100
        height: 26
        axis: horizontal
        range: 260
        speed: 165

  # 9 "Code Review" - the act's SKILL CHECK. Nothing new.
  # Every idea act I owns, arranged so the greedy line COSTS the safe one: the
  # pay pocket sits behind the breakable, and the fence that reaches it is the
  # fence that would otherwise have sealed the easy left chamber. The boss is
  # never the first test of an act's content; this is.
  - id: level-9
    level: 9
    sizeThreshold: 16
    expectedCuts: 6
    points: 20
    variety: 14
    randomShapes: 10
    maxBalls: 3
    coloredAreas:
      - kind: var
        x: 630
        'y': 45
        width: 205
        height: 205
        required: false
    pickupSpots:
      - { x: 200, y: 450 }
      - { x: 700, y: 620 }
    entities:
      - id: soft-wall
        kind: wall
        shape: rect
        x: 560
        'y': 120
        width: 24
        height: 660
        breakable: true
        hitsToBreak: 3
      - id: nub
        kind: wall
        shape: circle
        cx: 250
        cy: 300
        radius: 50
      - id: pay-shelf
        kind: wall
        shape: rect
        x: 584
        'y': 250
        width: 271
        height: 22
      - id: patrol
        kind: mover
        shape: rect
        x: 250
        'y': 600
        width: 110
        height: 26
        axis: horizontal
        range: 300
        speed: 170
    beats:
      - id: crunch
        atSpaceRemaining: 40
        speedSpike: 0.12
        announce: game.beatCrunchTime

  - id: level-10
    level: 10
    sizeThreshold: 15
    expectedCuts: 8
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 1
    timeLimit: 65
    # Colored Area (required win-gate): trap the boss INSIDE this pink var area to
    # ship it; trapping it outside fails the map (lose a life, restart). var is the
    # easiest kind (1.5x). ~20% of the board, top-right in the standard orientation.
    coloredAreas:
      - kind: var
        x: 500
        'y': 45
        width: 355
        height: 335
    # Boss (issue #56): the first boss, gating the Promotion. The Release Candidate
    # is a big/fast antagonist you must DEFEAT by fencing it into the var area above;
    # clearing space alone will not complete the map (the area is the win gate), and
    # the deadline is the fail state. Scope Creep runs hot from second 0. Beating it
    # routes into the once-per-run Promotion draft.
    boss:
      name: Release Deadline
      intro: >-
        Your first boss. The Release Candidate is loose: a big, fast ball, with
        Scope Creep hot from the first second. Clearing the board is not enough:
        fence it into the pink var area (top right) to ship it. Trap it anywhere
        else and you lose a life. Beat the deadline.
      creepFromStart: true
      objective:
        id: defeat-rc
        name: Defeat the Release Candidate
        description: Fence the boss into the var area to ship it.
        clarify: >-
          Trap the Release Candidate inside the pink var area to defeat it. Trapping
          it outside the area fails the map (you lose a life and the map restarts).
          Running out of time also fails.
        kind: defeatBoss
        reward: 12
      bossBall:
        # No HP: the boss is won by fencing it into the var area (the Colored Area
        # gate decides it). hp 1 => no HP pips in the HUD. It KEEPS spawning adds
        # (maxMinions = the concurrent cap, refilled as you lock them away), so
        # managing the minions is the second layer while you corner the boss.
        hp: 1
        radiusScale: 2.5
        speedScale: 1.15
        color: "#ff2d55"
        spitIntervalSeconds: 6
        # Two at a time, deliberately (issue: keep the L10 boss to 2 adds). The cap
        # is on ACTIVE minions, so locking one frees the slot and the boss buds
        # another: the fight is about KEEPING them sealed, not out-clearing a
        # crowd. Four made the board a scramble where the boss was the easy part.
        maxMinions: 2
    entities:
      - id: pillar
        kind: wall
        shape: circle
        cx: 450
        cy: 450
        radius: 80
      - id: floor-sweep
        kind: mover
        shape: circle
        cx: 430
        cy: 720
        radius: 40
        axis: horizontal
        range: 500
        speed: 120
        phase: 0
  # ===========================================================================
  # ACT II - THE SPRINT (11-20): pressure and space.
  #
  # Receives what act I gave up (chests, reveals, terminals, the WIP limit) and
  # hands its own gravity, seam and charge work down to act III. Before the
  # schedule this band opened with four balls and a mirror and then spent one
  # map each on the seam and the charge, neither of which was ever seen again.
  #
  # The procedural band opens here (PROCEDURAL_MIN_LEVEL = 11), along with the
  # big-ball gift and map mutators, so several maps carry `slots`.
  # ===========================================================================

  # 11 "Tech Debt" - MEET the chest: the first destruct-up.
  # A reward you have to BREAK to collect, which is the opposite of everything
  # act I taught about breakables costing you time for nothing but space. The
  # cover in front of it means smashing is a two-step commitment, not a reflex.
  # Rainbow balls unlock here (balls.yml), so the map stays otherwise plain.
  #
  # It is also the launcher's debut, and the two share a theme rather than
  # competing: both are a bet you place before you know how the map goes. The
  # barrel sits out in the middle of the left half, well clear of every edge,
  # and is CANTED UP through the gap in the spine (a full-power shot crosses it
  # around y=505, mid-gap),
  # so a full-power shot is a clean run into the right half and an over-aimed
  # one buries the whole roster in the cramped left side with the chest. Base
  # pay is multiplied by the power fired at, so the wager is priced in before
  # the first fence.
  #
  # The barrel holds every ball on the map, so maxBalls is the real roster
  # again: nothing moves until the band is released, and then all of it does.
  # The angle is deliberately not a multiple of 90 - an axis-aligned barrel
  # reads as another wall, and the whole point of the thing is that it is
  # pointing somewhere.
  #
  # The 110 height is not cosmetic. Reachability is ball-size aware and works on
  # the rasterised grid, so a turned barrel with a narrow bore rasterises to a
  # staircase that erodes into disconnected cells: at 84 the balls inside were
  # sealed off from the board and captureUnreachableCells wrote off everything
  # outside the barrel. Anything from about 110 up stays connected on every
  # rotation. See launcherBarrel.test.ts, which pins it.
  - id: level-11
    level: 11
    sizeThreshold: 16
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 10
    maxBalls: 3
    entities:
      - id: plunger-11
        kind: launcher
        shape: rect
        x: 290
        'y': 520
        width: 240
        height: 110
        facing: right
        angle: -22
      # Pop bumpers. The launcher fires the roster up through the gap in the
      # spine into the right half, and this is what it arrives at: three
      # bumpers, spread so a ball crossing the half meets one but is never
      # trapped between two. They KICK - the ball leaves faster than it hit -
      # which is what a pinball table does and no other solid in this game
      # does. Speed is capped per ball (see physics/bouncer.ts), so a long
      # rally cannot compound a ball into something that crosses a fence
      # between two physics steps.
      - id: bumper-a
        kind: wall
        shape: circle
        cx: 700
        cy: 490
        radius: 42
        bouncer: true
      - id: bumper-b
        kind: wall
        shape: circle
        cx: 720
        cy: 720
        radius: 42
        bouncer: true
      - id: bumper-c
        kind: wall
        shape: circle
        cx: 720
        cy: 290
        radius: 42
        bouncer: true
      # The GOVERNOR: two more bumpers, and the map's answer to its own wager.
      #
      # A launched ball keeps its speed for the whole map - nothing in the
      # engine damps one - and a fast ball is a ball you cannot fence. A CHARGED
      # bumper takes 5% off and pays an hour for it, so the right-hand chamber
      # is where a player who pulled too hard goes to buy the speed back, and it
      # costs the bumpers' banks to do it. Run them dry and the same bumpers
      # start kicking instead, which is the trap.
      #
      # Two rather than one because the braking is bank-limited, not
      # position-limited. Measured over a map, three bumpers put about 15 hours
      # of brake on the board and five put 19-25; the first crossing of the shot
      # is unchanged either way, because a ball only meets what it happens to
      # meet. What these buy is a chamber that keeps braking after the first
      # pass, rather than one that is spent by the time it matters.
      #
      # `kick-in` is a KICKER rather than a bouncer: it fires along a fixed
      # bearing whatever the approach, so it aims into the chain instead of
      # scattering off it. A radial bumper is a pinball; a kicker is a plan.
      # Placed at the bottom of the chain rather than at the mouth: anything
      # that drifts down the right-hand side is fired back up through it, so
      # the gauntlet feeds itself. It is deliberately NOT in front of the
      # muzzle - a bumper there narrows the spine's gap and seals the board.
      - id: kick-in
        kind: wall
        shape: circle
        cx: 810
        cy: 600
        radius: 40
        bouncer: true
        bearing: up
      - id: bumper-d
        kind: wall
        shape: circle
        cx: 800
        cy: 420
        radius: 42
        bouncer: true
      - id: chest-cover
        kind: wall
        shape: rect
        x: 150
        'y': 560
        width: 110
        height: 22
        breakable: true
        hitsToBreak: 2
      - id: chest-11
        kind: wall
        shape: rect
        x: 160
        'y': 590
        width: 88
        height: 70
        chest: true
        breakable: true
        hitsToBreak: 2
      # The spine takes the pinball cluster's punishment, so it is the wall
      # that gives. Everything east of it has been sped up by the plunger and
      # then by five bumpers; this is the only thing on the map that takes
      # speed back, and after a long rally its face reads as exactly that.
      - id: spine-top
        kind: wall
        shape: rect
        x: 560
        'y': 45
        width: 24
        height: 300
        deformable: true
      - id: spine-bottom
        kind: wall
        shape: rect
        x: 560
        'y': 620
        width: 24
        height: 235
        deformable: true
    slots:
      - id: pillar-mid
        candidates:
          - shape: circle
            cx: [300, 400]
            cy: [280, 380]
            radius: [58, 84]

  # 12 "Hidden Requirement" - MEET `reveals`: a gate that OPENS space.
  # Until now every breakable has been a wall in the way. This one is holding
  # back a sealed half of the board that does not exist until you break it, so
  # the map you are looking at is not the map you have to clear. White balls
  # unlock here.
  - id: level-12
    level: 12
    sizeThreshold: 14
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 8
    maxBalls: 3
    entities:
      - id: gate-1
        kind: wall
        shape: rect
        x: 40
        'y': 430
        width: 820
        height: 24
        breakable: true
        fence: true
        hitsToBreak: 3
        reveals:
          x: 50
          'y': 55
          width: 800
          height: 368
      - id: anchor
        kind: wall
        shape: circle
        cx: 450
        cy: 650
        radius: 60

  # 13 "Bonus Pool" - USE the chest: it IS the greed hook.
  # Parked in the open middle with a patrol orbiting it, so cracking it means
  # committing balls and fence time in the one place you cannot seal from. The
  # whole outer ring clears the threshold without ever going near it. Green
  # money balls unlock here, which is the build this map is quietly advertising.
  - id: level-13
    level: 13
    sizeThreshold: 13
    expectedCuts: 7
    points: 20
    variety: 14
    randomShapes: 10
    maxBalls: 4
    entities:
      - id: chest-cover
        kind: wall
        shape: rect
        x: 398
        'y': 380
        width: 110
        height: 22
        breakable: true
        hitsToBreak: 2
      - id: chest-13
        kind: wall
        shape: rect
        x: 406
        'y': 410
        width: 94
        height: 76
        chest: true
        breakable: true
        hitsToBreak: 2
      - id: guard
        kind: mover
        shape: circle
        cx: 450
        cy: 620
        radius: 48
        axis: horizontal
        range: 320
        speed: 170
      - id: rib-left
