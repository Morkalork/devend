  # 7 "Bonus Pool" - MEET the chest, USE the breakable.
  #
  # The chest is the first thing on the board that pays for being DESTROYED
  # rather than for being sealed around, which is why it gets its own map: every
  # lesson so far has been "make a small room and put a ball in it", and this one
  # is "drive a ball at that until it comes apart".
  #
  # It sits in an open alcove, not a sealed one. A vault with no way in is a
  # region captureUnreachableCells writes off at load, and the map would hand it
  # over for free before the player touched anything - the trap map 5's first
  # draft fell into. The mouth is 84 units, a legal neck, and a patrol crosses
  # the approach to it.
  #
  # So the alcove is worth two different things and they compete for the same
  # ball. Keep one in there and it smashes the chest for loot; seal the mouth
  # with a ball inside and you have a lock instead. Doing both means holding a
  # ball in the alcove while you draw the cut across a patrol's line, which is
  # the map's one greedy read.
  #
  # The partition is map 6's lesson quoted back: breaking it opens the lower
  # half into one room, easier to reach and harder to seal.
  #
  # THE WIN NAMES BOTH. It used to ask for six shards and nothing else, so the
  # map whose whole subject is the chest never asked for one, and a player
  # reasonably asked why they would ever go for it. Reported from play. Now it
  # asks for one monolith as well as four shards, with two chests on the board
  # so no single cut can bury the ask: one in the alcove behind the patrol, and
  # one out in the open bottom right, easy to reach. Which one you break is the
  # map's decision. The shard count came down from six to four to pay for the
  # new line.
  # Heights (3D board, objectRise.ts): the vault lip sits low; the chests are squat and the partition is a low run of shards, so nothing on this board reads as permanent but the frame.
  - id: level-7
    name: Easter Egg
    level: 7
    premise: "The one where the chest is worth breaking, and the better of the two sits behind the patrol."
    # Bugs (public/bugs.yml). Act I's first map with a real brick wall AND a
    # slab, so the ball is already a tool here and a buff has something to act
    # on. Just under a third of its shards carry one, capped at the config's
    # max_per_map: a bug is a thing this map has, not a thing it is about.
    bugChance: 0.3
    sizeThreshold: 22
    expectedCuts: 6
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 22
        - kind: smashed
          count: 4
          of: shards
        - kind: smashed
          count: 1
          of: monoliths
    entities:
      # The alcove is ONE wall now. It used to be two - a 141-long jamb hanging
      # off the top edge at x 585 and this 270-long lip - which left the only
      # way in as an 84-unit slot between the jamb's foot and the lip's top,
      # against a 36-wide ball. Legal by the gap rule and miserable in the
      # hand: the chest counted toward the smashes this map REQUIRED back when
