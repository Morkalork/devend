        x: 534
        'y': 45
        width: 26
        height: 210
      - id: nook-lip
        kind: wall
        shape: rect
        x: 45
        'y': 700
        width: 160
        height: 24
      - id: baffle
        kind: wall
        shape: rect
        x: 620
        'y': 520
        width: 26
        height: 240
    charges:
      - fuse: { x: 450, y: 330 }
        radius: 32
