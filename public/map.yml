    # fence. Introduces black balls (which fracture your fences in 3 hits) already
    # foreshadowed from ~L25. Its stop-and-vibrate wind-up is the fence window.
    boss:
      name: Force Push
      intro: >-
        A heavy black build that wrecks your work: every 30 seconds it stops,
        vibrates, and shatters EVERY fence you have drawn. It is fast, so pin it
        down. The moment it freezes to wind up a wipe is your window to fence it
        into the pink var area. A freeze holds it right there.
      creepFromStart: false
      objective:
        id: defeat-force-push
        name: Contain the Force Push
        description: Fence the black boss into the var area.
        clarify: >-
          Trap the black boss inside the pink var area to win. Every 30 seconds it
          stops and vibrates, then destroys all of your fences; that stationary
          wind-up is your chance to fence it. Running out of time fails the map.
        kind: defeatBoss
