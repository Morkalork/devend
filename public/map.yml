  # behind it. Bricks are not walls (BRICKS_PLAN.md rule 7): a fence passes
  # through them, but a ball does not, so the ball has to break in before it
  # can break the slabs. Win: two of the three slabs (one spare).
  #
  # The rehearsal for the boss on map 5: something to break through, and
  # something to break behind it. The gaps at the wall's ends are under 12, so
  # no ball slips round it.
  #
  # Tests a build: fences (box the ball against the wall, then behind it) and
  # weight (the slabs).
  #
  # Measured (practice, par +60, 20 runs): Casual wins 73% of attempts, the
  # Fence Engineer 91%; the clock takes 63% of losses; pays about 38h.
  - id: level-4
