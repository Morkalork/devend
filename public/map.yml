  # 13 "Code Review" - MEET the mirror.
  #
  # Someone else decides where your work goes. A fence that meets the mirror
  # reflects and keeps going, so one drag becomes a bent line, and the syntax
  # box sits where no straight fence closes it. The box is the win: clear the
  # board, and lock a ball in the box the mirror is for.
  #
  # Reported from play as "too similar to the previous one", and it was: 12
  # and 13 carried the same bumpers, the same monolith strut and sump, the
  # same square of shards and the same win (one monolith, two shards), with a
  # mirror added to 13. All of that came off. It was 12's furniture and 12's
  # win, the box was a bonus nothing asked for, and the mirror - the thing
  # this map introduces - was never needed to finish. Now the map is the
  # mirror and the box, and nothing else competes for the read.
  #
  # THE TURN: a small speed spike at 35% remaining, announced. The map runs at
  # 0.75 speed so a bent cut can be planned; the spike charges for taking too
  # long to plan it.
  # Heights (3D board, objectRise.ts): the mirror stands tall and thin, a pane on its edge rather than another slab.
  - id: level-13
    name: Code Review
    level: 13
    premise: "The one where the box sits where no straight fence can close it, and the mirror bends your cut around it."
    sizeThreshold: 14
    expectedCuts: 8
    points: 5
    maxBalls: 3
    variety: 0
    randomShapes: 0
    ballTypeIds:
      - red
      - blue
      - yellow
    ballSpeedScale: 0.75
    win:
      require:
        - kind: space
          threshold: 14
        - kind: area
          count: 1
    coloredAreas:
      - kind: light
        x: 660
        'y': 150
        width: 170
        height: 160
    entities:
      - id: mirror-a
        rise: 1.4
        kind: wall
        shape: rect
        x: 470
        'y': 200
        width: 20
        height: 300
        mirror: true
    beats:
      - id: crunch
        atSpaceRemaining: 35
        speedSpike: 0.12
        announce: game.beatCrunchTime
    balls: []

  # 14 "Downtime" - MEET gravity. The floor is alive and the walls throw you back.
  # Heights (3D board, objectRise.ts): nothing stands on this board but the frame; the turning room is the mechanic.
  - id: level-14
    name: Downtime
    level: 14
    premise: "The one where the room turns a quarter every ten seconds and down goes with it."
    # The board where you MEET real gravity, so the board shows you nothing but
    # gravity. It was a five-obstacle map, and on a board full of shelves a ball
    # never gets a fall long enough to look like one: it clips something within
    # half a second and the arc you were meant to read never finishes. Reported
    # as "still not normal gravity" with the physics already in and working.
    #
    # Bare on purpose, so the only thing to read is the fall and the turn.
    # (15 used to be this board again with wells on it; it is a well feeding a
    # cup now, and the bouncy sides stayed here, where a falling board needs
    # them.)
    sizeThreshold: 14
    # Between 13 (this map with obstacles to hide behind) and 15's bare board.
    # Losing the shelves cuts both ways: nothing blocks a fence, and nothing
    # subdivides the board for you either.
    expectedCuts: 8
    points: 5
    maxBalls: 3
    variety: 0
    randomShapes: 0
    ballTypeIds: [red, blue, red]
    # The room turns a quarter every ten seconds and down goes with it. This is
    # the map as it was described: no obstacles, four bouncy sides, real gravity
    # and a recurring tilt. It shipped briefly as `steady_gravity`, which is the
    # same board with the turn taken out, because I split one design into two
    # maps that nobody asked to be split.
    #
    # The turn is what makes a fence a decision rather than a shape. You draw
    # one to catch a ball against the floor, and ten seconds later the floor is
    # a wall and the ball is falling somewhere else.
    mutator: tipping
    # Gravity is screen-relative: it starts pulling screen-down whatever
    # orientation the map was dealt in. The board here is bare and symmetric so
    # a deal rotation changes nothing you can see, but the flag is already right
    # for whoever puts the first entity on it.
    neverRotates: true
    # All four, and all the same. A bouncer per side is what keeps a falling
    # board alive: gravity trades height for speed and back, and the walls are
    # what put back the little that each bounce loses. It also has to READ as
    # symmetrical, since a player who can see chevrons on three sides and a bare
    # floor on the fourth has been told the floor is different when it is not.
    #
    # 1.05, not the 1.15 the floor used to carry. Under a pull that only steered
    # the floor had to supply the speed; under one that accelerates, the fall
    # supplies it and a heavy kick just pumps every ball to terminal, where it
    # is moving at a constant speed again.
    boardEdges:
      top:
        kick: 1.05
      bottom:
        kick: 1.05
      left:
        kick: 1.05
      right:
        kick: 1.05
    # No breakables left to smash, so the clause that named them had to go. A
    # bare board can ask for a lock and nothing else: "catch one in flight",
    # which is the whole skill this map teaches.
    win:
      require:
        - kind: space
          threshold: 14
        - kind: locks
          count: 1
    entities: []
    balls: []

  # Heights (3D board, objectRise.ts): the cup's walls stand tall, so the cup reads as a vessel the well pours into.
  - id: level-15
    name: Standup
    level: 15
    premise: "The one where a gravity well drops balls into the cup the win needs, if you close the lid in time."
    # MEET the gravity well, and nothing else.
    #
    # A cup sits on the floor in the middle of the board, open at the top, and
    # a well hangs over its mouth pulling down into it. The win is a ball
    # locked in the cup. So the well is not terrain to route around: it is the
    # thing doing the aiming, and the read is when to trust it - let it drop a
    # ball in, then close the lid across the cup's mouth before the ball
    # bounces back out through the well.
    #
    # Reported from play as a weird map: "bouncers on all sides, but no general
    # gravity", and the wells not introduced by the design. It was a bare board
    # with two wells a player could ignore, four bouncy sides carried over from
    # 14 (where they exist to keep a falling board alive; with no global pull
    # here they were only noise), and a win of `locks: 2` that never mentioned
    # a well. The sides are plain again, and the win is the cup the well feeds.
    #
    # Measured, eight seeds, twenty seconds with no cuts: balls spend 13.2% of
    # their time in the cup with the well and 6.2% without it. On the bot sweep
    # the win rate is the same either way (15 of 16) and the well saves about a
    # third of the cuts, median 14 against 20: it is the helper it is meant to
    # be, not a gate.
    #
    # One well rather than two. A second well pulling elsewhere would be a
    # second relationship on a MEET map; one well over one cup says one thing.
    # 3.0 turn rate, the value the mechanic was designed around, since nothing
    # else on the board competes with it.
    #
    # No `neverRotates`: with no global pull there is nothing to keep upright,
    # and rotateGravityWell turns the well's position and bearing together, so
    # the cup and the well stay a pair on every deal.
    sizeThreshold: 13
    expectedCuts: 7
    points: 5
    maxBalls: 3
    variety: 0
    randomShapes: 0
    ballTypeIds: [red, blue, red]
    gravityWells:
      - x: 355
        y: 400
        width: 190
        height: 230
        turnRate: 3.0
        pull: down
    win:
      require:
        - kind: space
          threshold: 13
        - kind: area
          count: 1
    coloredAreas:
      - kind: light
        x: 355
        'y': 650
        width: 190
        height: 205
    # The cup: two walls standing on the floor, 190 apart inside, 205 tall.
    # Its mouth is the line y 650 between their tops, one fence wide.
    entities:
      - id: cup-west
        rise: 1.3
        kind: wall
        shape: rect
        x: 329
        'y': 650
        width: 26
        height: 205
      - id: cup-east
        rise: 1.3
        kind: wall
        shape: rect
        x: 545
        'y': 650
        width: 26
        height: 205
    balls: []

  # Heights (3D board, objectRise.ts): the phasing pillars stand tall, so they visibly sink and rise; the deformable stands proud between them and the backlog slabs sit low.
  - id: level-16
    name: Tech Debt
    level: 16
    premise: "The one where the pillars in the divider vanish on a cycle, and the win wants a ball sealed on each side."
    # THREE OBJECTS THAT DISAGREE ABOUT HOW FAST THE BALLS ARE.
    #
    # 14 and 15 were terrain maps: bare boards where the whole read was a pull.
    # This one puts furniture back, and picks the furniture so that every piece
    # of it is about the same quantity. The bumpers hand out speed and pay for
    # it. The slab takes speed away and keeps a permanent mark of how much. The
    # pillars vanish, and shove everything near them 35% faster on the way out.
    # So the map's difficulty is not a threshold, it is a number that will not
    # sit still, and the player's job is to seal a board while it moves.
    #
    # The MEET is phasing, and the COMPRESSED sibling is the deformable: both
    # are family A ("this wall will not be the same wall in a minute") read from
    # opposite ends. The pillars are never the same wall twice and forget
    # everything; the slab is the same wall forever and forgets nothing. Meeting
    # one against the other is cheaper than meeting either alone, which is the
    # whole argument for compressing a sibling (see the ledger).
    sizeThreshold: 13
    # 9. Above 15's 7 because the furniture is back and a fence has things to
    # anchor on again, and above 14's 8 because the divider means most cuts only
    # ever claim half a board. Re-measured against the bot sweep below.
    expectedCuts: 9
    points: 5
    maxBalls: 3
    variety: 0
    randomShapes: 0
    ballTypeIds: [red, blue, red]
    # 0.8, low for this rung on purpose. Everything on this board ADDS speed:
    # two bumpers at 1.25 a kick and two shockwaves at 1.35. A normal opening
    # pace plus all of that is a map that is fast from the first bump and stays
    # there, and a ball at terminal speed is moving at a constant speed again -
    # which is the one thing this map must not be. Starting slow is what makes
    # the additions legible, and it is the same lesson 14 learned about kicks.
    ballSpeedScale: 0.8
    # FIGHT split locks: the divider is the thing that will not hold still.
    #
    # The map's own note above says a bumper, a slab and a pillar have no state
    # that records whether you engaged with them, so none of them can carry a
    # clause and `space + locks` is the honest ask. That is right about content
    # and wrong about this clause: `splitLocks` names no content at all, only a
    # division - and this board has one. `flake-top`, `the-slab` and
    # `flake-bottom` are a column at x 425-475, straight down the middle of a
    # board whose centre is 450.
    #
    # Which makes it the column's map, not a second lock tally. Map 2's jamb is
    # masonry and map 4's doorway is merely guarded; two thirds of THIS divider
    # goes intangible on a cycle, so the two halves are only two halves some of
    # the time, and a ball that was safely on the far side is not. Seal one each
    # side while the pillars are solid, or spend a ball chasing a wall that was
    # there when you started the cut.
    #
    # Three balls, so the ask is one lock per side and a spare - the first time
    # the clause is not simply "seal everything you have". The spare is what
    # pays for the bonus pocket in the corner, and choosing between them is the
    # map's one real decision.
    #
    # Same requirement count as the `locks: 1` it replaces.
    win:
      require:
        - kind: space
          threshold: 13
        - kind: splitLocks
          count: 1
    # The one thing on the board that is worth more than the board.
    #
    # Everything else here is TERRAIN in the sense ladderWins means it: a
    # bumper, a slab and a pillar have no state that says whether you engaged
    # with them, so none of them can carry a win clause and `space + locks` is
    # the honest ask (see 14 and 15 for the same reasoning). A bonus pocket is
    # not a clause either - it is an ECONOMY, the axis this map otherwise has
    # none of, and it turns "seal a ball somewhere" into "seal it HERE if you
    # can afford to".
    #
    # Placed in the top-left with `escalation-a` immediately under it, on
    # purpose: the pocket that pays is the one with a machine in it whose whole
    # job is throwing balls back out. Cheap to seal, hard to seal with a ball
    # still inside.
    # No colored area. A bonus syntax box sat in the top-left room, and the win
    # never mentioned it: the same promise-with-nothing-behind-it the act I
    # review found on levels 3 and 5. This map's subject is the divider.
    entities:
      # ── The divider: one wall you can rely on, two you cannot ─────────────
      #
      # The middle of the board is a wall in three pieces. The centre piece is
      # permanent; the two that reach for the frame come and go together. So
      # the board is TWO ROOMS for about five seconds and ONE ROOM for about
      # four, over and over, and that sentence is the whole map.
      #
      # Both pillars run the same cycle, in phase, deliberately. Two different
      # cycles gives four states and a board nobody can read; a MEET gets one
      # relationship, stated as loudly as possible. 9 seconds is long enough to
      # commit to a cut inside one phase and short enough that waiting for the
      # other one is a real choice rather than a rest.
      #
      # NOTE, because it will look like a bug and is not: a fence always
      # terminates on a pillar, whatever phase it is in. Phasing governs BALLS,
      # not cuts. That asymmetry is the tactical content - the divider is a
      # reliable thing to cut against and an unreliable thing to trap against -
      # so the pillars are placed where a pocket would never want them as a
      # side, out in the open with the frame a clear gap away.
      #
      # The three pieces are separated by 10-unit SEAMS, not by gaps. A ball is
      # 36 across, and the first draft left 40 between each pillar and the slab
      # - wide enough to look like a way through, narrow enough that nothing
      # reliably takes it, and a different width again the moment the big-ball
      # gift rolls. That is the exact trap featureSchedule's seam/neck rule
      # names, and it caught this before it was ever played. Every real way
      # across this board is now a 75-unit neck at the frame.
      - id: flake-top
        rise: 1.6
        kind: wall
        shape: rect
        x: 430
        'y': 120
        width: 40
        height: 200
        isPhasing: true
        phaseCycleSeconds: 9
      - id: flake-bottom
        rise: 1.6
        kind: wall
        shape: rect
        x: 430
        'y': 580
        width: 40
        height: 200
        isPhasing: true
        phaseCycleSeconds: 9
      # The permanent centre, and the only brake on the board. Every crossing
      # that does not go through a doorway goes through this, at 3% a time, and
      # the dents stay: by the end of a long map its face is a record of how
      # much pace it has already drunk. Sized to leave a real doorway above and
      # below it even while the pillars are solid (y 45-120 and y 780-855, both
      # a clear 75-unit neck), so the board is never actually sealed in half - a
      # divider with no gap at all would make each half a separate map.
      - id: the-slab
        rise: 1.2
        kind: wall
        shape: rect
        x: 425
        'y': 330
        width: 50
        height: 240
        deformable: true
      # ── The two that hand speed out ───────────────────────────────────────
      #
      # One per room, so neither half is the calm half, and off the centre line
      # from each other so a ball crossing the board does not meet them in a
      # straight run. This is the bumper's USE beat: met at 12 as a thing that
      # pays, developed at 13, and here it is finally an ANTAGONIST as well as
      # an income - the hours it pays are the same hits that make the map fast.
      - id: escalation-a
        kind: wall
        shape: circle
        cx: 220
        cy: 290
        radius: 46
        bouncer: true
        bounceHours: 1
      - id: escalation-b
        kind: wall
        shape: circle
        cx: 680
        cy: 610
        radius: 46
        bouncer: true
        bounceHours: 1
      # ── Two quiet corners ─────────────────────────────────────────────────
      #
      # Slack, in the sense the difficulty contract means it: somewhere in each
      # room that a cut can reach without crossing anything, so the map always
      # has a cheap first move and a lock is never gated on threading the
      # middle. Plain solids, no flags: the map already has three ideas.
      - id: backlog-a
        rise: 0.8
        kind: wall
        shape: rect
        x: 110
        'y': 660
        width: 150
        height: 40
      - id: backlog-b
        rise: 0.8
        kind: wall
        shape: rect
        x: 640
        'y': 200
        width: 150
        height: 40
    balls: []

  # 17 "Deprecation" - COMPRESSED brittle, FIGHT the launcher, USE the chest.
  # The first Demolition map (MAP_DESIGN_GUIDELINES.md section 11, plan and
  # build record in DEMOLITION_PLAN.md): a wall of glass along the top edge,
  # a vault set into its back row, and a serve fired up into it from the
  # bottom. Every strip you seal from the bottom shortens the bounce.
  # Heights (3D board, objectRise.ts): the wall of bricks is low shards under the vault's squat chest; the corner shelf sits low.
  - id: level-17
    name: Deprecation
    level: 17
    premise: "The one where the balls are your hammer, and the wall of shards opens wherever they hit it."
    # Bugs, at the archetype's set piece. The highest share on the ladder:
    # "Deprecation" is the map Demolition exists for, its wall is sixteen
    # smashes deep, and Force Push is the answer it is built to want. The cap
    # is what stops a quarter of that wall being power-ups.
    bugChance: 0.35
    sizeThreshold: 12
    # Authored, not the rung's default 50 s. The wall used to come down faster
    # than it should: the stack graph read the brick rows as stacked, so a ball
    # clipping a bottom brick toppled the ones above it on two deals of four.
    # That was a bug and is gone, and without it the same map measured 8 of 16
    # against 11 before; ten more seconds is what the free cascade was worth.
    timeLimit: 60
    expectedCuts: 9
    points: 5
    maxBalls: 3
    variety: 0
    randomShapes: 0
    ballTypeIds: [red, grey, blue]
    pickupChance: 0
    win:
      require:
        - kind: space
          threshold: 12
        - kind: smashed
          count: 16
          of: shards
    beats:
      - id: crunch
        atSpaceRemaining: 30
        speedSpike: 0.15
        announce: game.beatCrunchTime
    entities:
      - id: barrel
        kind: launcher
        shape: rect
        x: 361
        'y': 600
        width: 110
        height: 240
        facing: up
        angle: 0
      - id: vault
        kind: wall
        shape: rect
        x: 386
        'y': 53
        width: 128
        height: 22
        chest: true
        breakable: true
        hitsToBreak: 3
      # The wiper: the first ROTOR authored on any map, and the reason
      # Demolition needed one. A shuttle would cross the serve lane on a fixed
      # line and you would learn it once; this sweeps the airspace directly
      # above the muzzle, so the angle it meets a rising ball at keeps changing
      # and its tip (which travels far faster than its hub) bats returns back
      # up into the glass. Pivot is well below the bar, so the same 200-long
      # bar is an arm rather than a windmill.
      #
      # Deliberately NOT load-bearing: the win is space + smashed, and the
      # wiper only ever makes both harder. Control Freak can hold it, crank it
      # or break it, and the bot sweep cannot drive it, so nothing may depend
      # on it being moved.
      - id: wiper
        kind: mover
        shape: rect
        x: 440
        'y': 210
        width: 20
        height: 200
        motion: rotate
        pivotX: 450
        pivotY: 420
        sweepDegrees: 120
        startDegrees: -35
        speed: 30
        axis: horizontal
        range: 0
      - id: brick-a1
        kind: wall
