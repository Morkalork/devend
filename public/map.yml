  # 5 "The Monolith" - BOSS: the first Legacy System (BOSS_PLAN.md).
  #
  # The boss is the board. In the middle stands the Core, a slab of
  # twenty-eight hits; around it, a Shell of thirteen bricks with one gap, on the right as
  # authored and on another side on each of the four deals. Break the Core and
  # the map is won; the Shell counts for nothing (it is in the way, not in the
  # win). The nameplate's health is the Core's hits left.
  #
  # The system defends itself with two incidents, both telegraphed:
  #   PATCH     every 15 seconds the Shell's broken bricks are rebuilt, except
  #             where a ball stands or the ground is claimed. Break fast, or
  #             keep the ball inside.
  #   ROLLBACK  once, at half the Core's hits: a blast from the Core through
  #             fences and claimed ground within 160. Whatever boxing-in you
  #             did close to the Core is undone, once, and has to be redone.
  #
  # Two answers: through the Shell (break a gap, keep the ball in with the
  # Core) or through the gap (fence the ball in on that side). One ball can win
  # it inside the clock; weight, a second ball (affordable after map 4) and
  # fence speed each make it faster. Breaking the Core inside 45 seconds pays
  # an extra 10h.
  #
  # Channels round the Core are 68 wide, and the Shell's gap 68: section 6's
  # gap rule. No boss ball, so no "boss outside": the losses are the clock and
  # the Core walled off from every ball.
  #
  # No ball starts inside the fortress (initGame): balls spawn near the middle
  # of the board, and on many deals one began beside the Core with half the
  # fight already won.
  #
  # Measured (BOT_PLAYERS.md, the six players in practice through maps 1-5,
  # par +60, 30 runs each): Casual wins 50% of attempts (the boss band is
  # 30-60%), Super Ball 71% (weight); it pays about 56h. Tried first at 16
  # hits and 75 seconds: Casual won 76% and no build stood out. A Patch every
  # 12 seconds instead of 15 made the careful players harder to tell apart,
  # so it stays at 15. Fleet, arriving with the second ball it saved for, wins
  # less than Super Ball: two balls are more fences hit, not more hits.
  #
  # The checklist flags one knob: the clock takes 71% of losses. The same
  # blind spot as map 3: the bot never walls the Core off, and a person will.
  - id: level-5
    name: The Monolith
    level: 5
    premise: "The one where the boss is a slab of twenty-eight hits behind a shell that patches itself."
    sizeThreshold: 15
    timeLimit: 70
    expectedCuts: 6
    points: 40
    variety: 0
    randomShapes: 0
    maxBalls: 2
    pickupChance: 0
    win:
      require:
        - kind: smashed
          count: 1
          of: monoliths
    boss:
      name: The Monolith
      intro: "The oldest code in the company, and nobody dares touch it. Break its Core before release. Its Shell patches itself every 15 seconds, and when the Core is half broken it rolls back your fences around it. One ball can do it; a heavier one, or two, does it faster."
      core: core
      objective:
        id: monolith-early
        name: Hotfix Friday
        description: Break the Core within 45 seconds of play.
        clarify: "Break the Monolith's Core inside 45 active seconds for extra overtime. Pauses do not count."
        kind: speedClear
        params:
          seconds: 45
        reward: 10
    beats:
      - id: patch
        everySeconds: 15
        announce: game.beatPatch
        leadMs: 2000
        restore: [shell-top-1, shell-top-2, shell-top-3, shell-top-4, shell-bottom-1, shell-bottom-2, shell-bottom-3, shell-bottom-4, shell-left-1, shell-left-2, shell-left-3, shell-right-1, shell-right-3]
      - id: rollback
        atHitsOn:
          id: core
          hits: 14
        announce: game.beatRollback
        leadMs: 1600
        rollback:
          at: core
          radius: 160
    entities:
