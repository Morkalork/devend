        width: 26
        height: 34
        brittle: true
      - id: partition-8
        kind: wall
        shape: rect
        x: 300
        'y': 694
        width: 26
        height: 34
        brittle: true
      - id: partition-9
        kind: wall
        shape: rect
        x: 300
        'y': 736
        width: 26
        height: 34
        brittle: true
      - id: partition-10
        kind: wall
        shape: rect
        x: 300
        'y': 778
        width: 26
        height: 34
        brittle: true
      - id: partition-11
        kind: wall
        shape: rect
        x: 300
        'y': 820
        width: 26
        height: 34
        brittle: true
      - id: patrol
        kind: mover
        shape: rect
        x: 450
        'y': 330
        width: 200
        height: 26
        axis: horizontal
        range: 240
        speed: 150
    beats:
      # The rescue act I gives every required break: at 25% remaining the
      # open chest goes, announced, so a player who cleared the board without
      # ever cracking a monolith is not left with a map that cannot finish.
      # Low enough that anyone playing the map breaks one first.
      - id: deadline
        atSpaceRemaining: 25
        breakId: chest-7b
        announce: game.beatDeadline
      - id: crunch
        atSeconds: 55
        speedSpike: 0.15
        announce: game.beatCrunchTime
        leadMs: 2000
    balls: []

  # 8 "Refactor" - MEET reveals, BREAK the marked zone.
  #
  # `reveals` is the one mechanic that makes the board BIGGER. The corner behind
  # the curtain is 276x255 of board that does not exist yet: its cells start
  # locked and uncuttable, and three hits on the curtain hand them over.
  #
  # THE BOX STOPS BEING OPTIONAL HERE. On map 3 it was a bonus pocket, drawn
  # dotted, free to ignore. This map is where it becomes a WIN CONDITION: clear
  # to 81% AND lock at least one ball inside it, and it is drawn solid and
  # bright to say so. That is the last new thing a colored area can do, and it
  # is the second half of map 3's lesson rather than a different mechanic.
  #
  # Both clauses, not one. Flipping `required: true` alone would make the area
  # the SOLE win (see resolveWinSpec) and the clear would stop mattering, which
  # is the "a gate never replaces the clear" rule in the guidelines. An authored
  # `win:` block asks for both, so the box is a second thing to do while doing
  # the first.
  #
  # It is also this map's inversion, twice over. The box is not even THERE until
  # the curtain is paid for - so the mechanic the map teaches is now MANDATORY,
  # not a greed hook - and the moment it arrives it is 10.7% of the board, over
  # the 10% lock threshold, so sealing the whole corner does not lock at all.
  # The player has to cut it down before it counts. The pocket they learned to
  # measure on map 3 will not hold still.
  #
  # The Turn is the safety net: it force-breaks the curtain at 45% remaining, so
  # a player who never worked out that the wall was the way in still gets the
  # corner in time to seal something in it.
  #
  # The corner is sealed by two board edges, the curtain and a jamb, with a
  # 12-unit seam between them: no ball can be inside it. That is not cosmetic.
  # The first draft revealed an open strip instead, and the bot audit came back
  # with nineteen "[OWNERSHIP] ball has no valid region" against a baseline of
  # one or two - balls wandering into cells that are REMOVED by design and
  # belong to no region. A revealed area has to be genuinely shut.
  #
  # Power-up tokens arrive on this map by gate (pickups.start_level is 8), so
