  # PILOT: "Wire the Integration" (#73). An ALL-DORMANT map: no live ball at start,
  # just two sleeping balls that each HOLD their region uncapturable. Fence off the
  # empty space, then route a fence past a terminal to BOOT its ball; it springs
  # loose and you trap it. A calm routing puzzle where you invite the danger.
  - id: level-8
    level: 8
    sizeThreshold: 10
    expectedCuts: 7
    points: 20
    variety: 5
    randomShapes: 0   # keep the sleepers' spots clear of stray mini-obstacles
    maxBalls: 0
    circuit:
      radius: 28
      announce: game.circuitComplete
      # Terminals are off-set in BOTH axes so no single straight fence can thread
      # both: you boot the sleepers one at a time, at your own pace.
      terminals:
        - x: 235
          y: 250
          ball: { x: 235, y: 480 }
        - x: 665
          y: 620
          ball: { x: 665, y: 390 }
    entities:
      - id: hub
        kind: wall
        shape: circle
        cx: 450
        cy: 450
        radius: 60
  - id: level-9
    level: 9
    sizeThreshold: 18
    expectedCuts: 7
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 3
    entities:
