  # ===========================================================================
  # ACT II - THE SPRINT (11-20): pressure and space.
  #
  # Receives what act I gave up (chests, reveals, terminals, the WIP limit) and
  # hands its own gravity, seam and charge work down to act III. Before the
  # schedule this band opened with four balls and a mirror and then spent one
  # map each on the seam and the charge, neither of which was ever seen again.
  #
  # The procedural band opens here (PROCEDURAL_MIN_LEVEL = 11), along with the
  # big-ball gift and map mutators, so several maps carry `slots`.
  # ===========================================================================

  # 11 "Tech Debt" - MEET the chest: the first destruct-up.
  # A reward you have to BREAK to collect, which is the opposite of everything
  # act I taught about breakables costing you time for nothing but space. The
  # cover in front of it means smashing is a two-step commitment, not a reflex.
  # Rainbow balls unlock here (balls.yml), so the map stays otherwise plain.
  #
  # It is also the launcher's debut, and the two share a theme rather than
  # competing: both are a bet you place before you know how the map goes. The
  # barrel sits out in the middle of the left half, well clear of every edge,
  # and is CANTED UP through the gap in the spine (a full-power shot crosses it
  # around y=505, mid-gap),
  # so a full-power shot is a clean run into the right half and an over-aimed
  # one buries the whole roster in the cramped left side with the chest. Base
  # pay is multiplied by the power fired at, so the wager is priced in before
  # the first fence.
  #
  # The barrel holds every ball on the map, so maxBalls is the real roster
  # again: nothing moves until the band is released, and then all of it does.
  # The angle is deliberately not a multiple of 90 - an axis-aligned barrel
  # reads as another wall, and the whole point of the thing is that it is
  # pointing somewhere.
  #
  # The 110 height is not cosmetic. Reachability is ball-size aware and works on
  # the rasterised grid, so a turned barrel with a narrow bore rasterises to a
  # staircase that erodes into disconnected cells: at 84 the balls inside were
  # sealed off from the board and captureUnreachableCells wrote off everything
  # outside the barrel. Anything from about 110 up stays connected on every
  # rotation. See launcherBarrel.test.ts, which pins it.
  - id: level-11
    level: 11
    sizeThreshold: 16
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 10
    maxBalls: 3
    entities:
      - id: plunger-11
        kind: launcher
        shape: rect
        x: 290
        'y': 520
        width: 240
        height: 110
        facing: right
        angle: -22
      # Pop bumpers. The launcher fires the roster up through the gap in the
      # spine into the right half, and this is what it arrives at: three
      # bumpers, spread so a ball crossing the half meets one but is never
      # trapped between two. They KICK - the ball leaves faster than it hit -
      # which is what a pinball table does and no other solid in this game
      # does. Speed is capped per ball (see physics/bouncer.ts), so a long
      # rally cannot compound a ball into something that crosses a fence
      # between two physics steps.
      - id: bumper-a
        kind: wall
        shape: circle
        cx: 700
        cy: 490
        radius: 42
        bouncer: true
      - id: bumper-b
        kind: wall
        shape: circle
        cx: 720
        cy: 720
        radius: 42
        bouncer: true
      - id: bumper-c
        kind: wall
        shape: circle
        cx: 720
        cy: 290
        radius: 42
        bouncer: true
      # The GOVERNOR: two more bumpers, and the map's answer to its own wager.
      #
      # A launched ball keeps its speed for the whole map - nothing in the
      # engine damps one - and a fast ball is a ball you cannot fence. A CHARGED
      # bumper takes 5% off and pays an hour for it, so the right-hand chamber
      # is where a player who pulled too hard goes to buy the speed back, and it
      # costs the bumpers' banks to do it. Run them dry and the same bumpers
      # start kicking instead, which is the trap.
      #
      # Two rather than one because the braking is bank-limited, not
      # position-limited. Measured over a map, three bumpers put about 15 hours
      # of brake on the board and five put 19-25; the first crossing of the shot
      # is unchanged either way, because a ball only meets what it happens to
      # meet. What these buy is a chamber that keeps braking after the first
      # pass, rather than one that is spent by the time it matters.
      #
      # `kick-in` is a KICKER rather than a bouncer: it fires along a fixed
      # bearing whatever the approach, so it aims into the chain instead of
      # scattering off it. A radial bumper is a pinball; a kicker is a plan.
      # Placed at the bottom of the chain rather than at the mouth: anything
      # that drifts down the right-hand side is fired back up through it, so
      # the gauntlet feeds itself. It is deliberately NOT in front of the
      # muzzle - a bumper there narrows the spine's gap and seals the board.
      - id: kick-in
        kind: wall
        shape: circle
        cx: 810
        cy: 600
        radius: 40
        bouncer: true
        bearing: up
      - id: bumper-d
        kind: wall
        shape: circle
        cx: 800
        cy: 420
        radius: 42
        bouncer: true
      - id: chest-cover
        kind: wall
        shape: rect
        x: 150
        'y': 560
        width: 110
        height: 22
        breakable: true
        hitsToBreak: 2
      - id: chest-11
        kind: wall
        shape: rect
        x: 160
        'y': 590
        width: 88
        height: 70
        chest: true
        breakable: true
        hitsToBreak: 2
      # The spine takes the pinball cluster's punishment, so it is the wall
      # that gives. Everything east of it has been sped up by the plunger and
      # then by five bumpers; this is the only thing on the map that takes
      # speed back, and after a long rally its face reads as exactly that.
      - id: spine-top
        kind: wall
        shape: rect
        x: 560
        'y': 45
        width: 24
        height: 300
        deformable: true
      - id: spine-bottom
        kind: wall
        shape: rect
        x: 560
        'y': 620
        width: 24
        height: 235
        deformable: true
    slots:
      - id: pillar-mid
        candidates:
          - shape: circle
            cx: [300, 400]
            cy: [280, 380]
            radius: [58, 84]

