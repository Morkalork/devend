  # ORDER: bank the pocket first and wake it into a half you have finished with,
  # or wake it early for the space and spend the rest of the map working around
  # it downstairs. Act IV opens on rules the player already knows, on purpose.
  # The gates on 32-34 only land if the first map plays straight.
