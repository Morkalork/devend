  # The last map before the last boss asks for three things the ladder has
  # taught, on one budget: a ball delivered into the box in the bottom-left
  # corner (23, 38), one of two slabs smashed (25, 32), and the board cleared,
  # all inside twenty-eight fences (32, 34). The plug on the right has a fuse
  # under it: one of the twenty-eight blows it, and the blast fractures your
  # own fences near it, so it wants arming before that corner is built. The
  # slab on the left has no fuse and three hits in it, the slow answer, and the
  # black ball breaks either at double strength. Two slabs for a clause that
  # wants one is the slack: no single cut can bury the smash; and the plug goes
  # by itself at 20% remaining if neither has, as 25's did. The box reserves
  # its interior, so a delivery never calms the board. Every ask is priced;
  # nothing is new; the order is yours. The superior nook is under the
  # top-left lip.
  # Heights (3D board, objectRise.ts): the box stands as a bin, the plug and the slab proud as the monoliths they are; the lip low.
  - id: level-44
    name: Go Live
    level: 44
    premise: "The one where one delivery, one smashed slab and the whole board have to fit inside twenty-eight fences, in any order you like."
    sizeThreshold: 4
    expectedCuts: 10
    points: 5
    maxBalls: 3
    variety: 0
    randomShapes: 0
    ballTypeIds: [red, blue, black]
    timeLimit: 50
    fenceBudget: 28
    win:
      require:
        - kind: space
          threshold: 4
        - kind: delivered
          count: 1
          bonusPercent: 20
        - kind: smashed
          count: 1
          of: monoliths
          bonusPercent: 15
    charges:
      - fuse:
          x: 630
          'y': 390
        radius: 32
        targetId: plug
        delaySeconds: 1.4
        blastRadius: 190
        announce: game.chargeBlown
    beats:
      - id: crunch
        atSpaceRemaining: 35
        speedSpike: 0.12
        announce: game.beatCrunchTime
      - id: deadline
        atSpaceRemaining: 20
        breakId: plug
        announce: game.beatDeadline
    entities:
      - id: release-box
        rise: 1.2
        kind: box
        shape: rect
        x: 45
        'y': 655
        width: 200
        height: 200
        mouth: up
        capacity: 2
        reserves: true
      - id: plug
        kind: wall
        shape: rect
        x: 560
        'y': 290
        width: 140
        height: 40
        breakable: true
        hitsToBreak: 40
      - id: slab
        kind: wall
        shape: rect
        x: 200
        'y': 430
        width: 120
        height: 36
        breakable: true
        hitsToBreak: 3
      - id: nook-lip
        rise: 0.75
        kind: wall
        shape: rect
        x: 45
        'y': 195
        width: 155
        height: 24
    balls: []

  # 45 "Production Outage" - BOSS. The end of the ladder, and the one fight that
  # carries every idea a boss has had: the chained pair from 20 (each half
  # takes two traps, the chain shreds what it sweeps), the push from 30 (every
  # twenty-five seconds every fence is gone) and the leaks from 10 and 40 (an
  # oversized minion every twelve seconds or so, two at most). The box is back
  # in the top-right corner, where the first boss was fenced in at level 10,
  # so the ladder ends where its first fight began. Two phasing pillars snag
  # the chain while they stand and shove the pair loose when they fade.
  # Heights (3D board, objectRise.ts): the pillars stand tall, the snags the whole fight turns on.
  - id: level-45
    name: Production Outage
    level: 45
    premise: "The one where everything breaks at once: a chained pair, a wipe every twenty-five seconds, and leaks the whole time."
    sizeThreshold: 14
    expectedCuts: 9
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 1
    timeLimit: 130
    coloredAreas:
      - kind: light
        x: 500
        'y': 45
        width: 355
        height: 335
    boss:
      name: Production Outage
      intro: "Everything at once, and everything you have learned. A chained pair that takes two traps each, like the Merge Conflict; a wipe of every fence on the board every twenty-five seconds, like the Force Push; and oversized minions leaking the whole time, like the Memory Leak. Wear both halves down, then fence them into the light box, top right, where your first boss was shipped. Snag them on a pillar, save a freeze for the wipe, and ship it."
      creepFromStart: true
      objective:
        id: defeat-outage
        name: Resolve the Outage
        description: Wear both chained halves down, then fence them into the light box.
        clarify: "Each half takes two traps. The first can be anywhere and costs no life: the half breaks out faster and smaller, and one of your fences is reverted. The second must be inside the light box (top right), and both halves must end up there. Their chain breaks any fence it sweeps and snags on the phasing pillars. Every twenty-five seconds the pair stops and shudders, then wipes every fence on the board, and it spits an oversized minion every twelve seconds or so, two at most. Running out of time fails the map."
        kind: defeatBoss
        reward: 24
      bossBall:
        hp: 2
        count: 2
        chained: true
        radiusScale: 1.7
        speedScale: 1.1
        color: '#ff3b30'
        fenceWipeSeconds: 25
        spitIntervalSeconds: 12
        maxMinions: 2
        spawnEnlargedMinions: true
    entities:
      - id: pillar-w
        rise: 1.8
        kind: wall
        shape: circle
        cx: 300
        cy: 430
        radius: 52
        isPhasing: true
        phaseCycleSeconds: 10
      - id: pillar-s
        rise: 1.8
        kind: wall
        shape: circle
        cx: 600
        cy: 620
        radius: 52
        isPhasing: true
        phaseCycleSeconds: 13
    balls: []
