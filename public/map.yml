  # 19 "Hotfix" - act II's SKILL CHECK. Nothing new: the pull from 14, the mover
  # from 4, the chest from 17, all at once.
  # Built for the tilt. The room turns a quarter every ten seconds, so the board
  # has the same symmetry: four patrol bars in a pinwheel, one in front of each
  # wall, all sweeping the same way round. Whichever side is down, the floor
  # looks the same - a bar sweeping above it and a chest sitting on it - so a
  # turn never deals you a different MAP, only a different floor, and the plan
  # you read before the turn is still the right shape after it.
  # The eye of the pinwheel is the quiet chamber: no bar ever enters the middle,
  # so cuts there are safe, but the balls are never there either. They fall to
  # the ring, where the bars patrol and a fence growing into one costs a life.
  # The chests are on the floor of each side, so the pull brings the balls to
  # a chest every phase and smashing them is the win. Two of four are needed;
  # the other two are the greed hook, and cracking one means fencing near a
  # bar. Four bouncy sides at 1.05, like 14, so nothing pools dead on a floor.
  - id: level-19
    level: 19
    sizeThreshold: 10
    expectedCuts: 8
    points: 5
    maxBalls: 4
    variety: 0
    randomShapes: 0
    ballTypeIds: [red, blue, grey, red]
