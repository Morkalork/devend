  # 3 "Code Review" - MEET the slab.
  #
  # Four slabs, one in each quarter of an open board. A slab is a brick that
  # takes about three solid hits, and the force of a hit is the ball's weight
  # times its speed, so weight is the shorter way through a slab.
  #
  # Two ways to win, on the owner's word (2026-11-25, "way too hard" when it
  # asked for three of four): break ONE slab and lock the ball, or break THREE.
  # The ball cannot be locked before its one slab is down (the last ball stays
  # free while bricks are owed, BRICKS_PLAN.md), so locking early never costs
  # the map. A slab is solid ground (sealed into the grid), so a fence can stop
  # against one: box the ball in beside a slab and every bounce is a hit.
  #
  # Points 10 (were 26): a lock pays well, and at 26 this map paid 57h, more
  # than the harder maps 4 and 5. Now about 41h.
  #
  # Measured (BOT_PLAYERS.md, practice, par +60, 30 runs): Casual wins 91% of
  # attempts in about 16 seconds, and no build stands out (Super Ball 94%).
  # The checklist calls that too easy; it is the owner's call. At three of
  # four it was Casual 53%, Super Ball 91%, Safe Hands 12%.
  - id: level-3
    name: Code Review
    level: 3
    premise: "The one where every slab takes three solid hits, so you break one and lock up, or break three."
    sizeThreshold: 15
    timeLimit: 45
    expectedCuts: 4
    points: 10
    variety: 0
    randomShapes: 0
    maxBalls: 2
    pickupChance: 0
    win:
      require:
        - kind: smashed
          count: 1
          of: monoliths
        - kind: locks
          count: 1
      alsoWinIf:
        - kind: smashed
          count: 3
          of: monoliths
    entities:
      - id: slab-nw
        kind: wall
        shape: rect
        x: 180
        'y': 270
        width: 90
        height: 40
        breakable: true
        hitsToBreak: 3
      - id: slab-ne
        kind: wall
