    level: 16
    sizeThreshold: 7
    expectedCuts: 7
    points: 20
    variety: 28
    maxBalls: 4
    entities:
      - id: bar-left
        kind: wall
        shape: rect
        x: 50
        'y': 415
        width: 320
        height: 35
      - id: bar-right
        kind: wall
        shape: rect
        x: 530
        'y': 415
        width: 320
        height: 35
      # The hardened slab plugging the gap between the bar halves. Its high
      # integrity budget means balls won't casually crack it: the fuse is the
      # way through. Blowing it reopens its footprint as capturable space.
      - id: slab-plug
        kind: wall
        shape: rect
        x: 370
        'y': 405
        width: 160
        height: 55
        breakable: true
        hitsToBreak: 40
      - id: wall-c-tl
        kind: wall
        shape: circle
        cx: 250
        cy: 250
        radius: 50
      - id: wall-c-br
        kind: wall
