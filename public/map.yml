    # Boss (issue #64): all three gimmicks at once. A chained pair (fence-shredding
    # chain + phasing arena) that also wipes every fence on a timer and spits
    # OVERSIZED hotfixes. The capstone boss.
    boss:
      name: Production Outage
      intro: >-
        Everything at once. A chained pair that shreds your fences, wipes the whole
        board every 25 seconds, and spits oversized hotfixes, on an arena of phasing
        pillars. Fence BOTH halves into the pink var area to recover. Snag them on a
        pillar, save a freeze for the wipe, and ship it.
      creepFromStart: true
      objective:
        id: defeat-outage
        name: Resolve the Outage
        description: Fence both chained halves into the var area.
        clarify: >-
          Trap BOTH boss balls inside the pink var area. Their chain breaks fences
          and snags on the phasing pillars; every 25 seconds the boss wipes every
          fence (telegraphed by a stop and a vibrate). Running out of time fails.
        kind: defeatBoss
        reward: 24
      bossBall:
        hp: 1
        count: 2
        chained: true
        radiusScale: 1.7
        speedScale: 1.15
        color: "#ff3b30"
        fenceWipeSeconds: 25
        spitIntervalSeconds: 9
        maxMinions: 3
        spawnEnlargedMinions: true
