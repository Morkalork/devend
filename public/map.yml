levels:
  # ===========================================================================
  # ACT I - ONBOARDING (1-10): the basics of sealing.
  #
  # This act used to spend TEN concepts in ten maps: chests at 4, a fence budget
  # at 5, reveals at 7, terminals at 8. Everything the game owns was on the
  # board before the player was fluent at sealing anything, and nothing was ever
  # revisited. It now owns SIX ideas and spends four of its maps developing them
  # (see MAP_DESIGN_GUIDELINES.md: Meet / Use / Fight / Break).
  #
  # Given up to act II: chests, reveals, terminals, the WIP limit, 4 balls.
  # ===========================================================================

  # -------------------------------------------------------------------------
  # Maps 1-5 are authored at variety 0 and randomShapes 0, deliberately.
  #
  # `variety` jitters every rect's width and height by up to +/-variety% about
  # its centre, so an authored 60-unit neck is not a 60-unit neck at runtime:
  # two 300-tall stubs at variety 10 move their facing edges 15 each, and the
  # gap arrives anywhere in [30, 90]. Half of that range is the band the gap
  # rule forbids. Seven shipping maps already land in it (see
  # runtimeGapRule.test.ts), and the authored-coordinate guard cannot see it.
  #
  # An onboarding map is the worst place to spend that: these five exist to
  # make one idea legible each, and a doorway whose width is a dice roll is the
  # opposite. They go back to jittering when the guard measures what ships.
  # -------------------------------------------------------------------------

  # 1 "First Commit" - MEET the doorway, and the choice to end early.
  #
  # Two rooms, one doorway, one ball. The only decision on the board is the one
  # the whole game is made of: locking every ball WINS the map outright (the
  # standing allLocked alternative in winSpec), and with one ball that means the
  # nook in the top-right corner is a button marked "finish now". Take it and
  # you get a superior lock and the Ship Early bonus on a board you barely
  # touched. Leave it and you clear to 60% for the space money with the ball
  # still loose.
  #
  # No mechanic, no Turn. A Turn needs a plan to disrupt and the player does not
  # have one yet; see MAP_DESIGN_GUIDELINES.md section 6.3.
  #
  # The nook is 155x150 = 3.5% of the board, comfortably under the 4% superior
  # bar at this map's denominator (one ball, so it never drops below the initial
  # cell count). Nothing points at it. Some players will seal there by accident
  # and get paid, which teaches pocket size better than any explanation.
  # Heights (3D board, objectRise.ts): the doorway is the map, so its jambs stand tall; the nook's lip sits low, the invitation to seal.
  - id: level-1
    name: Hello World
    level: 1
    premise: "The one where locking the only ball wins outright, so the corner nook is a button marked finish now."
    sizeThreshold: 40
    expectedCuts: 3
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 1
    win:
      require:
        - kind: space
          threshold: 40
        - kind: locks
          count: 1
    entities:
      - id: jamb-top
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: jamb-bottom
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: nook-lip
        rise: 0.75
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
    balls: []

  # 2 "Pair Programming" - MEET the second ball.
  #
  # The same doorway, narrowed from 210 to 150, and now two balls cross it on
  # their own schedules. Nothing else is new, which is the point.
  #
  # The second ball is what turns a lock into a decision rather than an ending.
  # On map 1 sealing the ball finished the map; here you can spend one ball on a
  # nook and keep playing, and the price is that the survivor has the whole
  # board to wreck your fences in and you have half the herding power left.
  #
  # A nook per chamber, both 155x150 and both superior-sized, so the choice is
  # which one to spend a ball on and not whether a pocket qualifies.
  # Heights (3D board, objectRise.ts): tall jambs for the doorway that keeps the balls apart, low lips on the two nooks.
  - id: level-2
    name: Pull Request
    level: 2
    premise: "The one where the doorway keeps two balls apart, and the win wants one sealed on each side of it."
    sizeThreshold: 37
    expectedCuts: 4
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    # Both balls still have to be sealed, but now one has to go in each half.
    # `locks: 2` is not kept alongside it: on a two-ball map "one on each side"
    # already means both, and a second clause saying so would just be the same
    # requirement twice in the goal list. The jamb column at x=437 sits on the
    # midline this splits at, and the two nook lips are one per side, so the map
    # already had the shape - it was only ever asking for the easier thing.
    win:
      require:
        - kind: space
          threshold: 37
        - kind: splitLocks
          count: 1
    entities:
      - id: jamb-top
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 330
      - id: jamb-bottom
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 525
        width: 26
        height: 330
      - id: nook-lip-right
        rise: 0.75
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
      - id: nook-lip-left
        rise: 0.75
        kind: wall
        shape: rect
        x: 45
        'y': 681
        width: 155
        height: 24
    balls: []

  # 3 "Standup" - MEET the marked zone.
  #
  # The game's first syntax highlighting area, and it is the WIN: clear the board and lock
  # a ball inside the light syntax box. It used to be the bonus form (required: false),
  # on the theory that the first map to show a symbol must not punish misreading
  # it. Played, it read the other way round: a bright box on an otherwise bare
  # board that the win never mentions is a signal with nothing behind it, and
  # the map felt like map 2 with a decoration. A thing the map puts in front of
  # you is a promise, so the box is now the second line of the win. The lock
  # still pays 1.5x, so getting it right is paid as well as required. It
  # replaces `locks: 2`: two locks anywhere is the ask map 1 already made, and
  # one in the box is the thing this map is for.
  #
  # Drawn at 225x225 = 7.7% of the board, well ABOVE the 4% superior bar and on
  # purpose: this map teaches WHERE you locked, not how tightly. A box small
  # enough to look like the hardest kind would grade superior by itself and
  # collapse the two multipliers into one, which is the sizing trap in
  # MAP_DESIGN_GUIDELINES.md section 6.2. Superior stays maps 1 and 2's lesson.
  #
  # THE TURN, and the first one on the ladder: at 50% remaining the balls speed
  # up 20% for the rest of the map, telegraphed. Every fence timing the player
  # has just learned is now wrong, which is the cheapest legible complication
  # available this early - no mechanic on the board yet can open or close a
  # passage, and adding a ball is the axis of last resort.
  # Heights (3D board, objectRise.ts): tall jambs, a low lip; the syntax box is an inlaid plate, ground rather than a room.
  - id: level-3
    name: Definition of Done
    level: 3
    premise: "The one where the light syntax box is the win: clear the board and lock a ball inside it."
    sizeThreshold: 34
    expectedCuts: 4
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 34
        - kind: area
          count: 1
    entities:
      - id: jamb-top
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 330
      - id: jamb-bottom
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 525
        width: 26
        height: 330
      - id: nook-lip
        rise: 0.75
        kind: wall
        shape: rect
        x: 630
        'y': 270
        width: 225
        height: 24
    coloredAreas:
      - kind: light
        x: 630
        'y': 45
        width: 225
        height: 225
    beats:
      - id: crunch
        atSpaceRemaining: 50
        speedSpike: 0.2
        announce: game.beatCrunchTime
    balls: []

  # 4 "Blocker" - MEET the mover, USE the marked zone.
  #
  # The guard walks across the box's open side, so closing the box is a
  # question of WHEN: a fence grown into the guard costs a life, and the only
  # fence that closes the box runs straight down the guard's beat. The lesson is
  # still "not can I draw this fence, but can I draw it NOW", and it is now
  # asked about the thing the win needs rather than about a doorway the win
  # never mentions.
  #
  # Reported from play: the first version put the guard on the doorway between
  # the halves and asked for one ball on each side, and the mover read as
  # scenery - nothing the map asked for involved it. A mover the win routes
  # around is an obstacle; a mover standing on the win is a decision.
  #
  # The box is map 3's box, in the same corner, on purpose: this is its USE
  # beat. Map 3 taught what the box wants; this map puts someone in front of it.
  # The guard is short (60) and slow (70/s) because this is a Meet: it stands
  # on the door's line under a third of the time, so a player who watches it
  # pass once can always find the window. An 80-wide guard at 80/s measured
  # 3 of 8 on the bot sweep; this one 10 of 16.
  #
  # First map that ROTATES (level >= 4). The guard, the box and its door turn
  # together, so every deal asks the same question. The Turn is a spawn rather
  # than a topple for the same reason - gravity does not rotate with the board.
  #
  # THE TURN, and it is map 3's turned inside out. Map 3's fires on SPACE, so it
  # answers what the player did; this one fires on the CLOCK at 50 seconds and
  # arrives whether or not they got anywhere. Same effect, opposite lesson: the
  # board reacts to you, and then it does not. A duplication beat would have
  # been the obvious choice and is a no-op below level 11 (DUPLICATION_MIN_LEVEL)
  # - it was in the first draft of this map and mapBeats.test.ts caught it.
  # Heights (3D board, objectRise.ts): tall jambs, a low lip; the guard stands at a mover's height, prouder than the lip it walks past.
  - id: level-4
    name: Code Owner
    level: 4
    premise: "The one where a guard walks across the box's door, so closing the box is a question of when."
    sizeThreshold: 31
    expectedCuts: 5
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    # The box, in place of `splitLocks`. One ball in it is the whole ask
    # beyond the clear, and it is the ask the guard stands on.
    win:
      require:
        - kind: space
          threshold: 31
        - kind: area
          count: 1
    coloredAreas:
      - kind: light
        x: 630
        'y': 45
        width: 225
        height: 225
    entities:
      - id: jamb-top
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: jamb-bottom
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: nook-lip
        rise: 0.75
        kind: wall
        shape: rect
        x: 630
        'y': 270
        width: 225
        height: 24
      # Home centre x 640, sweeping 540-740: across the box's door at x 630
      # and back out into the right-hand room, never reaching the jamb.
      - id: guard
        kind: mover
        shape: rect
        x: 610
        'y': 144
        width: 60
        height: 26
        axis: horizontal
        range: 200
        speed: 70
    beats:
      - id: crunch
        atSeconds: 50
        speedSpike: 0.15
        announce: game.beatCrunchTime
        leadMs: 2000
    balls: []

  # 5 "Technical Debt" - MEET the shard.
  #
  # One touch opens a slot in a short column of shards in the divider, and the
  # doorway below it is already open. The verb, with nothing else attached:
  # the win asks for two of the four, and a ball that touches one breaks it.
  #
  # It used to quote two prices for one trip - walk the doorway on a patrol's
  # schedule, or spend six hits on a slab and go where the patrol could not
  # follow. Both halves went: the slab became one-touch shards when act I was
  # rebuilt on them (so there is no price in hits any more), and the patrol
  # came off when level 8 took a mover for its sliding door and act I would
  # otherwise have had one on six maps of ten. A patrol here after 4's was the
  # same gimmick two maps running, on the map whose job is to show one new
  # thing.
  #
  # The column does NOT enclose anything, and that is deliberate rather than
  # incidental. The first draft bricked up a pocket instead, and the audit
  # killed it: a fully sealed region is written off by captureUnreachableCells
  # as unreachable-hence-captured, so the vault started the map already
  # claimed. A breakable that seals a pocket is a free lock with extra steps.
  #
  # THE TURN: at 45% remaining the second shard goes whether you were ready or
  # not, with a banner. Until it breaks, that stretch of divider is WALL, and
  # wall is what a fence anchors on: a player part-way through sealing the
  # top-right chamber has been leaning on it.
  #
  # The seams between shards are 8 units, passages to nothing. The doorway
  # below the column is 210. Those numbers only survive because this map is at
  # variety 0; see the note at the top of act I.
  # Heights (3D board, objectRise.ts): tall jambs; the shards take the shard default (low), so the column visibly drops where one touch opens it.
  - id: level-5
    name: Flaky Test
    level: 5
    premise: "The one where a single touch opens a slot in a short column of shards, and nothing else is new."
    sizeThreshold: 28
    expectedCuts: 5
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 28
        - kind: smashed
          count: 2
          of: shards
    entities:
      - id: jamb-top
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 150
      - id: slab-1
        kind: wall
        shape: rect
        x: 437
        'y': 207
        width: 26
        height: 28
        brittle: true
      - id: slab-2
        kind: wall
        shape: rect
        x: 437
        'y': 243
        width: 26
        height: 28
        brittle: true
      - id: slab-3
        kind: wall
        shape: rect
        x: 437
        'y': 279
        width: 26
        height: 28
        brittle: true
      - id: slab-4
        kind: wall
        shape: rect
        x: 437
        'y': 315
        width: 26
        height: 28
        brittle: true
      - id: jamb-bottom
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
    # No colored areas. There were two bonus boxes here, one in each far
    # corner, and neither was in the win: two bright promises on the map that
    # introduces the shard, with nothing behind them. Reported from play as a
    # weird signal, and it contradicted this map's own premise - the verb,
    # with nothing else attached.
    beats:
      - id: deadline
        atSpaceRemaining: 45
        breakId: slab-2
        announce: game.beatDeadline
    balls: []

  # 6 "Merge Conflict" - FIGHT the breakable.
  #
  # Each room's best pockets are walled with the shards you have to break. A
  # solid spine divides the board, with a neck at each end, and three teeth of
  # shards stick out of it into EACH room. Between the teeth are alcoves, and
  # each one closes with a single fence into a pocket that grades superior.
  # The win asks for twelve of the eighteen shards - and every shard broken is
  # a hole in an alcove wall. So the map asks the question the old one never
  # did: which alcoves do you keep, and which do you spend? Lock a ball in one
  # while its teeth stand, or let the balls chew through them for the win and
  # lose the pocket.
  #
  # Reported from play as "ok, but lacks imagination. Good win condition,
  # boring design", and then: "no twists or turns, just grunt fencing off
  # without tactics". The old map was one straight column of shards between
  # two rooms. It eroded where the balls hit it, but nothing depended on WHERE,
  # so there was nothing to decide. The win keeps its shape (clear to 75%,
  # break shards: a third of them then, two thirds since it was raised to 12); the shards moved from the divider into the
  # teeth, and the divider became solid so the two rooms stay two rooms.
  #
  # Teeth on BOTH sides, not only the far one: with the shards all in one room
  # the balls often never reached them, and the sweep fell to 9 of 16 with the
  # board cleared and the shard line short. Mirrored, it reads 14 of 16.
  #
  # Raised from six shards to twelve on request. The same sweep (16 seeds, 60s)
  # fell from 14 of 16 to 1 of 16: four losses bury the win (with twelve of
  # eighteen needed, sealing a seventh shard away ends the map) and most of the
  # rest clear the board with the shard line short. The bot never aims at a
  # shard, so a player will do far better, but this is now a hard map.
  #
  # Measured with the pocket probe: an alcove is about 182 by 122, 3.4% of the
  # board, superior at the start of the map. The nook in the far corner is the
  # smallest one-fence pocket at 1.85%, and costs no teeth.
  #
  # Shards: 30x28, 8 apart along a tooth and 8 off the spine, so a tooth is a
  # wall to a ball until one goes (a gap of 46 lets a ball through).
  #
  # No patrol, deliberately: act I already has movers on 4, 5, 7 and 9, and the
  # pressure here is the teeth, not a timer on top of them.
  #
  # THE TURN: at 55 seconds the middle shard of the middle right-hand tooth
  # goes whether the balls got there or not, announced. It is the rescue for
  # the shard line, and it opens the two right-hand alcoves into one: whoever
  # was saving that pair loses it.
  # Heights (3D board, objectRise.ts): the spine and its anchors stand tall as the building; the teeth are low shards, plainly the part that goes.
  - id: level-6
    name: Refactor
    level: 6
    premise: "The one where each room's best pockets are walled with the shards you have to break."
    sizeThreshold: 25
    expectedCuts: 5
    points: 5
    variety: 0
