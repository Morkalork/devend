levels:
  # ===========================================================================
  # ACT I - ONBOARDING (1-10): the basics of sealing.
  #
  # This act used to spend TEN concepts in ten maps: chests at 4, a fence budget
  # at 5, reveals at 7, terminals at 8. Everything the game owns was on the
  # board before the player was fluent at sealing anything, and nothing was ever
  # revisited. It now owns SIX ideas and spends four of its maps developing them
  # (see LEVELDESIGN.md: Meet / Use / Fight / Break).
  #
  # Given up to act II: chests, reveals, terminals, the WIP limit, 4 balls.
  # ===========================================================================

  # 1 "First Commit" - MEET the seal.
  # One ball, two soft chambers, a neck too wide to fail at. The onboarding map
  # teaches the verb once (onboardingMap.ts, first run only), so this one only
  # has to teach that a SHAPE can be sealed. The corner shelf is the first
  # superior-sized pocket in the game and nothing draws attention to it: some
  # players will seal there by accident and get paid, which is a better first
  # lesson about pocket size than any explanation.
  - id: level-1
    level: 1
    sizeThreshold: 40
    expectedCuts: 3
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 1
    entities:
      - id: stub-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 200
      - id: stub-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 655
        width: 26
        height: 200
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 700
        'y': 690
        width: 155
        height: 22

  # 2 "Pair Programming" - MEET the second ball.
  # The same wide neck, now crossed by two balls on their own schedules. Nothing
  # else changes, which is the point: the difficulty is entirely the second ball.
  - id: level-2
    level: 2
    sizeThreshold: 34
    expectedCuts: 4
    points: 20
    variety: 8
    randomShapes: 6
    maxBalls: 2
    entities:
      - id: divider-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 280
      - id: divider-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 620
        width: 26
        height: 235
      - id: pillar
        kind: wall
        shape: circle
        cx: 225
        cy: 450
        radius: 70
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 45
        'y': 190
        width: 160
        height: 22

  # 2b - the same job turned ninety degrees: a horizontal split instead of a
  # vertical one. A variant only earns its place by teaching the SAME beat a
  # different way, or it is just another map at the same number.
  - id: level-2b
    level: 2
    sizeThreshold: 34
    expectedCuts: 4
    points: 20
    variety: 8
    randomShapes: 6
    maxBalls: 2
    entities:
      - id: divider-left
        kind: wall
        shape: rect
        x: 45
        'y': 437
        width: 300
        height: 26
      - id: divider-right
        kind: wall
        shape: rect
        x: 555
        'y': 437
        width: 300
        height: 26
      - id: pillar
        kind: wall
        shape: circle
        cx: 450
        cy: 190
        radius: 65
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 695
        'y': 700
        width: 160
        height: 22

  # 3 "Standup" - USE the topology: the necks ARE the hook.
  # An alcove in the top-left whose only way in is a corner gap one short fence
  # closes. Sized at roughly 150x150 on purpose, comfortably under 4% of the
  # board, so a seal there grades SUPERIOR and pays double. The right-hand half
  # is an ordinary two-chamber map and clears the threshold on its own, which is
  # the safe skip that makes the alcove a decision rather than a requirement.
  - id: level-3
    level: 3
    sizeThreshold: 30
    expectedCuts: 4
    points: 20
    variety: 8
    randomShapes: 6
    maxBalls: 2
    entities:
      - id: alcove-lip-v
        kind: wall
        shape: rect
        x: 195
        'y': 45
        width: 22
        height: 90
      - id: alcove-lip-h
        kind: wall
        shape: rect
        x: 45
        'y': 195
        width: 90
        height: 22
      - id: spine-top
        kind: wall
        shape: rect
        x: 550
        'y': 45
        width: 24
        height: 300
      - id: spine-bottom
        kind: wall
        shape: rect
        x: 550
        'y': 620
        width: 24
        height: 235

  # 3b - the same alcove in the opposite corner, so the habit does not become
  # "the money is top-left".
  - id: level-3b
    level: 3
    sizeThreshold: 30
    expectedCuts: 4
    points: 20
    variety: 8
    randomShapes: 6
    maxBalls: 2
    entities:
      - id: alcove-lip-v
        kind: wall
        shape: rect
        x: 683
        'y': 765
        width: 22
        height: 90
      - id: alcove-lip-h
        kind: wall
        shape: rect
        x: 765
        'y': 683
        width: 90
        height: 22
      - id: spine-top
        kind: wall
        shape: rect
        x: 326
        'y': 45
        width: 24
        height: 300
      - id: spine-bottom
        kind: wall
        shape: rect
        x: 326
        'y': 620
        width: 24
        height: 235

  # 4 "Blocker" - MEET the mover.
  # A patrol crossing the one neck, so the question stops being "can I draw this
  # fence" and becomes "can I draw it NOW". First map that rotates (level >= 4),
  # which is why the pocket sits in a corner rather than against one edge.
  - id: level-4
    level: 4
    sizeThreshold: 28
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    entities:
      - id: divider-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: divider-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 650
        width: 26
        height: 205
      - id: guard
        kind: mover
        shape: rect
        x: 400
        'y': 470
        width: 100
        height: 26
        axis: horizontal
        range: 280
        speed: 130
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 700
        'y': 200
        width: 155
        height: 22

  # 4b - the patrol runs along the neck instead of across it, so timing it is a
  # different read: you wait for a gap rather than for a pass.
  - id: level-4b
    level: 4
    sizeThreshold: 28
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    entities:
      - id: divider-left
        kind: wall
        shape: rect
        x: 45
        'y': 437
        width: 310
        height: 26
      - id: divider-right
        kind: wall
        shape: rect
        x: 545
        'y': 437
        width: 310
        height: 26
      - id: guard
        kind: mover
        shape: rect
        x: 437
        'y': 400
        width: 26
        height: 100
        axis: vertical
        range: 280
        speed: 130
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 45
        'y': 700
        width: 150
        height: 22

  # 5 "Nice To Have" - USE the marked zone: the game's first Colored Area.
  # A BONUS var pocket (required: false), so ignoring it costs nothing and the
  # first map that shows the pink box cannot punish you for misreading it. By
  # L10 the same box is the boss's win gate and the symbol is already familiar.
  #
  # Drawn at 225x225, well ABOVE 4% of the board, deliberately: it marks WHERE
  # you locked, not how tightly, and a box small enough to look "hardest" would
  # grade superior by itself and collapse the two multipliers into one.
  - id: level-5
    level: 5
    sizeThreshold: 26
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    coloredAreas:
      - kind: var
        x: 630
        'y': 620
        width: 225
        height: 225
        required: false
    entities:
      - id: pocket-shelf
        kind: wall
        shape: rect
        x: 610
        'y': 596
        width: 245
        height: 24
      - id: pocket-lip
        kind: wall
        shape: rect
        x: 586
        'y': 700
        width: 24
        height: 155
      - id: guard
        kind: mover
        shape: rect
        x: 380
        'y': 640
        width: 110
        height: 26
        axis: horizontal
        range: 260
        speed: 150

  # 5b - the pay pocket in the opposite corner, guarded by a circular patrol.
  - id: level-5b
    level: 5
    sizeThreshold: 26
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    coloredAreas:
      - kind: var
        x: 45
        'y': 45
        width: 225
        height: 225
        required: false
    entities:
      - id: pocket-shelf
        kind: wall
        shape: rect
        x: 45
        'y': 270
        width: 245
        height: 24
      - id: pocket-lip
        kind: wall
        shape: rect
        x: 290
        'y': 45
        width: 24
        height: 155
      - id: guard
        kind: mover
        shape: circle
        cx: 450
        cy: 250
        radius: 45
        axis: horizontal
        range: 260
        speed: 150

  # 6 "Legacy Wall" - MEET the breakable.
  # A thin wall across the board with the good space behind it. Smashing costs
  # time you could have spent sealing, which is the whole lesson: a breakable is
  # a price, not a door. Geometry kept from the map that already taught this.
  - id: level-6
    level: 6
    sizeThreshold: 24
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    entities:
      - id: soft-wall
        kind: wall
        shape: rect
        x: 530
        'y': 100
        width: 26
        height: 700
        breakable: true
        hitsToBreak: 3
      - id: nub
        kind: wall
        shape: circle
        cx: 230
        cy: 450
        radius: 45
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 700
        'y': 690
        width: 155
        height: 22

  # 6b - the same wall laid the other way, so the cut that opens it is a
  # different shape.
  - id: level-6b
    level: 6
    sizeThreshold: 24
    expectedCuts: 5
    points: 20
    variety: 10
    randomShapes: 8
    maxBalls: 2
    entities:
      - id: soft-wall
        kind: wall
        shape: rect
        x: 100
        'y': 530
        width: 700
        height: 26
        breakable: true
        hitsToBreak: 3
      - id: nub
        kind: wall
        shape: circle
        cx: 450
        cy: 230
        radius: 45
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 45
        'y': 690
        width: 155
        height: 22

  # 7 "Refactor" - FIGHT: the breakable crossed with the mover, and the act's
  # first TURN.
  # Nothing new on the board; both halves are already known, and the map is the
  # question of which order to spend them in. The speed spike is telegraphed a
  # beat early so the Turn is fair (LEVELDESIGN.md convention 3).
  - id: level-7
    level: 7
    sizeThreshold: 22
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 10
    maxBalls: 2
    entities:
      - id: gate
        kind: wall
        shape: rect
        x: 430
        'y': 230
        width: 26
        height: 440
        breakable: true
        hitsToBreak: 4
      - id: patrol
        kind: mover
        shape: circle
        cx: 660
        cy: 450
        radius: 45
        axis: vertical
        range: 300
        speed: 150
      - id: corner-shelf
        kind: wall
        shape: rect
        x: 700
        'y': 690
        width: 155
        height: 22
    beats:
      - id: crunch
        atSpaceRemaining: 50
        speedSpike: 0.15
        announce: game.beatCrunchTime

  # 8 "Scope" - FIGHT: the marked zone behind a guarded chokepoint, with three
  # balls. Also where POWER-UP TOKENS begin (game-config.yml pickups.start_level
  # is 8), and the first map in the game to curate where they land: a token that
  # spawns in a corner you already sealed is a token nobody can reach.
  - id: level-8
    level: 8
    sizeThreshold: 20
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 10
    maxBalls: 3
    coloredAreas:
      - kind: var
        x: 45
        'y': 620
        width: 220
        height: 225
        required: false
    pickupSpots:
      - { x: 650, y: 200 }
      - { x: 250, y: 250 }
      - { x: 680, y: 700 }
    entities:
      - id: pocket-shelf
        kind: wall
        shape: rect
        x: 45
        'y': 596
        width: 240
        height: 24
      - id: pocket-lip
        kind: wall
        shape: rect
        x: 265
        'y': 700
        width: 24
        height: 155
      - id: choke-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 330
      - id: choke-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 675
        width: 26
        height: 180
      - id: guard
        kind: mover
        shape: rect
        x: 400
        'y': 480
        width: 100
        height: 26
        axis: horizontal
        range: 260
        speed: 165

  # 9 "Code Review" - the act's SKILL CHECK. Nothing new.
  # Every idea act I owns, arranged so the greedy line COSTS the safe one: the
  # pay pocket sits behind the breakable, and the fence that reaches it is the
  # fence that would otherwise have sealed the easy left chamber. The boss is
  # never the first test of an act's content; this is.
  - id: level-9
    level: 9
    sizeThreshold: 16
    expectedCuts: 6
    points: 20
    variety: 14
    randomShapes: 10
    maxBalls: 3
    coloredAreas:
      - kind: var
        x: 630
        'y': 45
        width: 205
        height: 205
        required: false
    pickupSpots:
      - { x: 200, y: 450 }
      - { x: 700, y: 620 }
    entities:
      - id: soft-wall
        kind: wall
        shape: rect
        x: 560
        'y': 120
        width: 24
        height: 660
        breakable: true
        hitsToBreak: 3
      - id: nub
        kind: wall
        shape: circle
        cx: 250
        cy: 300
        radius: 50
      - id: pay-shelf
        kind: wall
        shape: rect
        x: 584
        'y': 250
        width: 271
        height: 22
      - id: patrol
        kind: mover
        shape: rect
        x: 250
        'y': 600
        width: 110
        height: 26
        axis: horizontal
        range: 300
        speed: 170
    beats:
      - id: crunch
        atSpaceRemaining: 40
        speedSpike: 0.12
        announce: game.beatCrunchTime

  - id: level-10
    level: 10
    sizeThreshold: 15
    expectedCuts: 8
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 1
    timeLimit: 65
    # Colored Area (required win-gate): trap the boss INSIDE this pink var area to
    # ship it; trapping it outside fails the map (lose a life, restart). var is the
    # easiest kind (1.5x). ~20% of the board, top-right in the standard orientation.
    coloredAreas:
      - kind: var
        x: 500
        'y': 45
        width: 355
        height: 335
    # Boss (issue #56): the first boss, gating the Promotion. The Release Candidate
    # is a big/fast antagonist you must DEFEAT by fencing it into the var area above;
    # clearing space alone will not complete the map (the area is the win gate), and
    # the deadline is the fail state. Scope Creep runs hot from second 0. Beating it
    # routes into the once-per-run Promotion draft.
    boss:
      name: Release Deadline
      intro: >-
        Your first boss. The Release Candidate is loose: a big, fast ball, with
        Scope Creep hot from the first second. Clearing the board is not enough:
        fence it into the pink var area (top right) to ship it. Trap it anywhere
        else and you lose a life. Beat the deadline.
      creepFromStart: true
      objective:
        id: defeat-rc
        name: Defeat the Release Candidate
        description: Fence the boss into the var area to ship it.
        clarify: >-
          Trap the Release Candidate inside the pink var area to defeat it. Trapping
          it outside the area fails the map (you lose a life and the map restarts).
          Running out of time also fails.
        kind: defeatBoss
        reward: 12
      bossBall:
        # No HP: the boss is won by fencing it into the var area (the Colored Area
        # gate decides it). hp 1 => no HP pips in the HUD. It KEEPS spawning adds
        # (maxMinions = the concurrent cap, refilled as you lock them away), so
        # managing the minions is the second layer while you corner the boss.
        hp: 1
        radiusScale: 2.5
        speedScale: 1.15
        color: "#ff2d55"
        spitIntervalSeconds: 6
        # Two at a time, deliberately (issue: keep the L10 boss to 2 adds). The cap
        # is on ACTIVE minions, so locking one frees the slot and the boss buds
        # another: the fight is about KEEPING them sealed, not out-clearing a
        # crowd. Four made the board a scramble where the boss was the easy part.
        maxMinions: 2
    entities:
      - id: pillar
        kind: wall
        shape: circle
        cx: 450
        cy: 450
        radius: 80
      - id: floor-sweep
        kind: mover
        shape: circle
        cx: 430
        cy: 720
        radius: 40
        axis: horizontal
        range: 500
        speed: 120
        phase: 0
  # ===========================================================================
  # ACT II - THE SPRINT (11-20): pressure and space.
  #
  # Receives what act I gave up (chests, reveals, terminals, the WIP limit) and
  # hands its own gravity, seam and charge work down to act III. Before the
  # schedule this band opened with four balls and a mirror and then spent one
  # map each on the seam and the charge, neither of which was ever seen again.
  #
  # The procedural band opens here (PROCEDURAL_MIN_LEVEL = 11), along with the
  # big-ball gift and map mutators, so several maps carry `slots`.
  # ===========================================================================

  # 11 "Tech Debt" - MEET the chest: the first destruct-up.
  # A reward you have to BREAK to collect, which is the opposite of everything
  # act I taught about breakables costing you time for nothing but space. The
  # cover in front of it means smashing is a two-step commitment, not a reflex.
  # Rainbow balls unlock here (balls.yml), so the map stays otherwise plain.
  - id: level-11
    level: 11
    sizeThreshold: 16
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 10
    maxBalls: 3
    entities:
      - id: chest-cover
        kind: wall
        shape: rect
        x: 150
        'y': 560
        width: 110
        height: 22
        breakable: true
        hitsToBreak: 2
      - id: chest-11
        kind: wall
        shape: rect
        x: 160
        'y': 590
        width: 88
        height: 70
        chest: true
        breakable: true
        hitsToBreak: 2
      - id: spine-top
        kind: wall
        shape: rect
        x: 560
        'y': 45
        width: 24
        height: 300
      - id: spine-bottom
        kind: wall
        shape: rect
        x: 560
        'y': 620
        width: 24
        height: 235
    slots:
      - id: pillar-mid
        candidates:
          - shape: circle
            cx: [300, 400]
            cy: [280, 380]
            radius: [58, 84]

  # 12 "Hidden Requirement" - MEET `reveals`: a gate that OPENS space.
  # Until now every breakable has been a wall in the way. This one is holding
  # back a sealed half of the board that does not exist until you break it, so
  # the map you are looking at is not the map you have to clear. White balls
  # unlock here.
  - id: level-12
    level: 12
    sizeThreshold: 14
    expectedCuts: 6
    points: 20
    variety: 12
    randomShapes: 8
    maxBalls: 3
    entities:
      - id: gate-1
        kind: wall
        shape: rect
        x: 40
        'y': 430
        width: 820
        height: 24
        breakable: true
        fence: true
        hitsToBreak: 3
        reveals:
          x: 50
          'y': 55
          width: 800
          height: 368
      - id: anchor
        kind: wall
        shape: circle
        cx: 450
        cy: 650
        radius: 60

  # 13 "Bonus Pool" - USE the chest: it IS the greed hook.
  # Parked in the open middle with a patrol orbiting it, so cracking it means
  # committing balls and fence time in the one place you cannot seal from. The
  # whole outer ring clears the threshold without ever going near it. Green
  # money balls unlock here, which is the build this map is quietly advertising.
  - id: level-13
    level: 13
    sizeThreshold: 13
    expectedCuts: 7
    points: 20
    variety: 14
    randomShapes: 10
    maxBalls: 4
    entities:
      - id: chest-cover
        kind: wall
        shape: rect
        x: 398
        'y': 380
        width: 110
        height: 22
        breakable: true
        hitsToBreak: 2
      - id: chest-13
        kind: wall
        shape: rect
        x: 406
        'y': 410
        width: 94
        height: 76
        chest: true
        breakable: true
        hitsToBreak: 2
      - id: guard
        kind: mover
        shape: circle
        cx: 450
        cy: 620
        radius: 48
        axis: horizontal
        range: 320
        speed: 170
      - id: rib-left
        kind: wall
        shape: rect
        x: 180
        'y': 240
        width: 24
        height: 200
      - id: rib-right
        kind: wall
        shape: rect
        x: 700
        'y': 460
        width: 24
        height: 200

  # 14 "Bent Pipeline" - MEET the mirror.
  # A fence that reflects off a surface instead of stopping at it, so a cut can
  # reach round a corner. The two mirrors face different ways on purpose: the
  # map is about learning to read which way a bounce goes.
  - id: level-14
    level: 14
    sizeThreshold: 12
    expectedCuts: 7
    points: 20
    variety: 14
    randomShapes: 10
    maxBalls: 4
    entities:
      - id: mirror-1
        kind: wall
        mirror: true
        shape: rect
        x: 300
        'y': 250
        width: 20
        height: 250
      - id: mirror-2
        kind: wall
        mirror: true
        shape: rect
        x: 580
        'y': 400
        width: 20
        height: 250
    slots:
      - id: pillar-tl
        candidates:
          - shape: circle
            cx: [160, 240]
            cy: [180, 260]
            radius: [55, 80]
      - id: pillar-br
        candidates:
          - shape: circle
            cx: [660, 740]
            cy: [640, 720]
            radius: [55, 80]

  # 15 "Integration" - MEET the terminals, and the dormant balls they boot.
  # A sleeper reserves an uncapturable pocket, so you cannot clear its space
  # until you wake it and then trap it: the only mechanic in the game that asks
  # you to CREATE the problem you are about to solve. Terminals are off-set in
  # both axes so no single straight fence threads both; you boot them one at a
  # time, at your own pace. Relocated from level 8, where it landed before the
  # player had met a mover.
  - id: level-15
    level: 15
    sizeThreshold: 12
    expectedCuts: 7
    points: 20
    variety: 5
    randomShapes: 0   # keep the sleepers' spots clear of stray mini-obstacles
    maxBalls: 0
    circuit:
      radius: 28
      announce: game.circuitComplete
      terminals:
        - x: 235
          'y': 250
          ball: { x: 235, y: 480 }
        - x: 665
          'y': 620
          ball: { x: 665, y: 390 }
    entities:
      - id: hub
        kind: wall
        shape: circle
        cx: 450
        cy: 450
        radius: 60

  # 16 "Two Environments" - USE the terminals: waking BOTH pays more.
  # Each sleeper you boot is another ball loose in a shrinking board, and the
  # chest sits where you would rather be sealing. Booting one and playing safe
  # is a real line; booting both and cracking the chest is the greedy one.
  - id: level-16
    level: 16
    sizeThreshold: 11
    expectedCuts: 8
    points: 20
    variety: 8
    randomShapes: 0
    maxBalls: 2
    circuit:
      radius: 30
      announce: game.circuitComplete
      terminals:
        - x: 180
          'y': 700
          ball: { x: 300, y: 700 }
