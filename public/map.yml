# The ladder: the maps a run is built from (useLevelManager).
#
# Started over in November 2026 for the brick pivot (BRICKS_PLAN.md): breaking
# bricks moves to the centre of the game, and the ladder is rebuilt around it
# one map at a time. The 45 maps that were here are in maps-archive.yml,
# unchanged: not played in a run, but every one opens in the Playground
# (Admin > Playground > the level picker's "Archive" list) to be tried again.
#
# Read MAP_DESIGN_CARD.md before adding a map.
levels:
  # 1 "First Commit" - MEET the doorway, and the choice to end early.
  #
  # Two rooms, one doorway, one ball. The only decision on the board is the one
  # the whole game is made of: locking every ball WINS the map outright (the
  # standing allLocked alternative in winSpec), and with one ball that means the
  # nook in the top-right corner is a button marked "finish now". Take it and
  # you get a superior lock and the Ship Early bonus on a board you barely
  # touched. Leave it and you clear to 60% for the space money with the ball
  # still loose.
  #
  # No mechanic, no Turn. A Turn needs a plan to disrupt and the player does not
  # have one yet; see MAP_DESIGN_GUIDELINES.md section 6.3.
  #
  # The nook is 155x150 = 3.5% of the board, comfortably under the 4% superior
  # bar at this map's denominator (one ball, so it never drops below the initial
  # cell count). Nothing points at it. Some players will seal there by accident
  # and get paid, which teaches pocket size better than any explanation.
  # Heights (3D board, objectRise.ts): the doorway is the map, so its jambs stand tall; the nook's lip sits low, the invitation to seal.
  - id: level-1
    name: Hello World
    level: 1
    premise: "The one where locking the only ball wins outright, so the corner nook is a button marked finish now."
    sizeThreshold: 40
    expectedCuts: 3
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 1
    win:
      require:
        - kind: space
          threshold: 40
        - kind: locks
          count: 1
    entities:
      - id: jamb-top
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: jamb-bottom
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: nook-lip
        rise: 0.75
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
    balls: []

  # 2 "Unit Tests" - MEET the brick, and the clock.
  #
  # Nine bricks in a block in the middle of an open board, two balls, thirty
  # seconds. Nothing else. A brick breaks on one touch, so the only question is
  # how often a ball gets to the block, and that is the lesson: on the open
  # board two balls wander and the clock runs out, and every fence that takes
  # empty board away sends them back to the block sooner. Locking the board
  # down is how the bricks get broken.
  #
  # The win is the bricks alone. Space is not asked for: here a fence is a tool
  # for breaking, not the goal.
  #
  # Measured: see BRICKS_PLAN.md (the bot's clears with and without fences).
  - id: level-2
    name: Unit Tests
    level: 2
    premise: "The one where nine bricks sit in the middle and thirty seconds is only enough if you fence the balls in around them."
    sizeThreshold: 15
    timeLimit: 30
    expectedCuts: 4
    points: 5
    variety: 0
    randomShapes: 0
    maxBalls: 2
    pickupChance: 0
    win:
      require:
        - kind: smashed
          count: 9
          of: shards
    entities:
      - id: brick-a1
        kind: wall
        shape: rect
        x: 352
        y: 409
        width: 60
        height: 22
        brittle: true
      - id: brick-a2
        kind: wall
        shape: rect
        x: 420
        y: 409
        width: 60
        height: 22
        brittle: true
      - id: brick-a3
        kind: wall
        shape: rect
        x: 488
        y: 409
        width: 60
        height: 22
        brittle: true
      - id: brick-b1
