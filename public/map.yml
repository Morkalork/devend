levels:
  # ===========================================================================
  # ACT I - ONBOARDING (1-10): the basics of sealing.
  #
  # This act used to spend TEN concepts in ten maps: chests at 4, a fence budget
  # at 5, reveals at 7, terminals at 8. Everything the game owns was on the
  # board before the player was fluent at sealing anything, and nothing was ever
  # revisited. It now owns SIX ideas and spends four of its maps developing them
  # (see MAP_DESIGN_GUIDELINES.md: Meet / Use / Fight / Break).
  #
  # Given up to act II: chests, reveals, terminals, the WIP limit, 4 balls.
  # ===========================================================================

  # -------------------------------------------------------------------------
  # Maps 1-5 are authored at variety 0 and randomShapes 0, deliberately.
  #
  # `variety` jitters every rect's width and height by up to +/-variety% about
  # its centre, so an authored 60-unit neck is not a 60-unit neck at runtime:
  # two 300-tall stubs at variety 10 move their facing edges 15 each, and the
  # gap arrives anywhere in [30, 90]. Half of that range is the band the gap
  # rule forbids. Seven shipping maps already land in it (see
  # runtimeGapRule.test.ts), and the authored-coordinate guard cannot see it.
  #
  # An onboarding map is the worst place to spend that: these five exist to
  # make one idea legible each, and a doorway whose width is a dice roll is the
  # opposite. They go back to jittering when the guard measures what ships.
  # -------------------------------------------------------------------------

  # 1 "First Commit" - MEET the doorway, and the choice to end early.
  #
  # Two rooms, one doorway, one ball. The only decision on the board is the one
  # the whole game is made of: locking every ball WINS the map outright (the
  # standing allLocked alternative in winSpec), and with one ball that means the
  # nook in the top-right corner is a button marked "finish now". Take it and
  # you get a superior lock and the Ship Early bonus on a board you barely
  # touched. Leave it and you clear to 60% for the space money with the ball
  # still loose.
  #
  # No mechanic, no Turn. A Turn needs a plan to disrupt and the player does not
  # have one yet; see MAP_DESIGN_GUIDELINES.md section 6.3.
  #
  # The nook is 155x150 = 3.5% of the board, comfortably under the 4% superior
  # bar at this map's denominator (one ball, so it never drops below the initial
  # cell count). Nothing points at it. Some players will seal there by accident
  # and get paid, which teaches pocket size better than any explanation.
  - id: level-1
    level: 1
    sizeThreshold: 40
    expectedCuts: 3
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 1
    win:
      require:
        - kind: space
          threshold: 40
        - kind: locks
          count: 1
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: nook-lip
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
    balls: []

  # 2 "Pair Programming" - MEET the second ball.
  #
  # The same doorway, narrowed from 210 to 150, and now two balls cross it on
  # their own schedules. Nothing else is new, which is the point.
  #
  # The second ball is what turns a lock into a decision rather than an ending.
  # On map 1 sealing the ball finished the map; here you can spend one ball on a
  # nook and keep playing, and the price is that the survivor has the whole
  # board to wreck your fences in and you have half the herding power left.
  #
  # A nook per chamber, both 155x150 and both superior-sized, so the choice is
  # which one to spend a ball on and not whether a pocket qualifies.
  - id: level-2
    level: 2
    sizeThreshold: 37
    expectedCuts: 4
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 2
    # Both balls still have to be sealed, but now one has to go in each half.
    # `locks: 2` is not kept alongside it: on a two-ball map "one on each side"
    # already means both, and a second clause saying so would just be the same
    # requirement twice in the goal list. The jamb column at x=437 sits on the
    # midline this splits at, and the two nook lips are one per side, so the map
    # already had the shape - it was only ever asking for the easier thing.
    win:
      require:
        - kind: space
          threshold: 37
        - kind: splitLocks
          count: 1
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 330
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 525
        width: 26
        height: 330
      - id: nook-lip-right
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
      - id: nook-lip-left
        kind: wall
        shape: rect
        x: 45
        'y': 681
        width: 155
        height: 24
    balls: []

  # 3 "Standup" - MEET the marked zone.
  #
  # The game's first Colored Area, in its BONUS form (required: false): seal a
  # ball inside the pink box and the lock pays 1.5x, ignore it and you lose
  # nothing at all. The first map that shows the symbol must not be able to
  # punish a player for misreading it, because by the act I boss the same box is
  # the only way to ship and the symbol has to be familiar by then.
  #
  # Drawn at 225x225 = 7.7% of the board, well ABOVE the 4% superior bar and on
  # purpose: this map teaches WHERE you locked, not how tightly. A box small
  # enough to look like the hardest kind would grade superior by itself and
  # collapse the two multipliers into one, which is the sizing trap in
  # MAP_DESIGN_GUIDELINES.md section 6.2. Superior stays maps 1 and 2's lesson.
  #
  # THE TURN, and the first one on the ladder: at 50% remaining the balls speed
  # up 20% for the rest of the map, telegraphed. Every fence timing the player
  # has just learned is now wrong, which is the cheapest legible complication
  # available this early - no mechanic on the board yet can open or close a
  # passage, and adding a ball is the axis of last resort.
  - id: level-3
    level: 3
    sizeThreshold: 34
    expectedCuts: 4
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 34
        - kind: locks
          count: 2
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 330
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 525
        width: 26
        height: 330
      - id: nook-lip
        kind: wall
        shape: rect
        x: 630
        'y': 270
        width: 225
        height: 24
    coloredAreas:
      - kind: var
        x: 630
        'y': 45
        width: 225
        height: 225
        required: false
    beats:
      - id: crunch
        atSpaceRemaining: 50
        speedSpike: 0.2
        announce: game.beatCrunchTime
    balls: []

  # 4 "Blocker" - MEET the mover.
  #
  # A patrol sweeps the doorway, so the question stops being "can I draw this
  # fence" and becomes "can I draw it NOW". The mover is the only new thing, and
  # it is the only hook: the corner pocket behind it is unmarked, the way maps 1
  # and 2 left theirs. Map 3's pink box was deliberately NOT carried over here.
  # Two consecutive maps whose eye goes to the same box is one focal point too
  # many, and it would have put a colored area on six of act I's ten maps -
  # which is the exact over-use MAP_DESIGN_GUIDELINES.md section 2 exists to
  # stop. The box comes back on map 5, priced.
  #
  # The doorway widens back to 210 because the difficulty has moved into the
  # timing. A neck that is both narrow and guarded is two problems, and this map
  # is about one of them.
  #
  # First map that ROTATES (level >= 4), so nothing here depends on which way is
  # down: the patrol is horizontal in authored space and becomes vertical in two
  # of the four deals, which changes how the doorway reads without changing what
  # it asks. The Turn is a spawn rather than a topple for the same reason -
  # gravity does not rotate with the board.
  #
  # THE TURN, and it is map 3's turned inside out. Map 3's fires on SPACE, so it
  # answers what the player did; this one fires on the CLOCK at 50 seconds and
  # arrives whether or not they got anywhere. Same effect, opposite lesson: the
  # board reacts to you, and then it does not. A duplication beat would have
  # been the obvious choice and is a no-op below level 11 (DUPLICATION_MIN_LEVEL)
  # - it was in the first draft of this map and mapBeats.test.ts caught it.
  - id: level-4
    level: 4
    sizeThreshold: 31
    expectedCuts: 5
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 31
        - kind: locks
          count: 2
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: nook-lip
        kind: wall
        shape: rect
        x: 630
        'y': 270
        width: 225
        height: 24
      - id: guard
        kind: mover
        shape: rect
        x: 300
        'y': 438
        width: 300
        height: 26
        axis: horizontal
        range: 280
        speed: 130
    beats:
      - id: crunch
        atSeconds: 50
        speedSpike: 0.15
        announce: game.beatCrunchTime
        leadMs: 2000
    balls: []

  # 5 "Technical Debt" - MEET the breakable, USE the mover.
  #
  # The divider has a soft section in it. Smash it and you own a SECOND doorway
  # into the right-hand chamber, at y 207-345, which the patrol never reaches -
  # it sweeps the lower doorway only. So the map quotes you two prices for the
  # same trip: walk the guarded doorway on the guard's schedule, or spend six
  # hits and go where it cannot follow. That is the whole lesson: a breakable is
  # not an obstacle, it is a price quoted in tempo.
  #
  # The slab does NOT enclose anything, and that is deliberate rather than
  # incidental. The first draft bricked up the pink pocket instead, and the
  # audit killed it: a fully sealed region is written off by
  # captureUnreachableCells as unreachable-hence-captured, so the vault started
  # the map already claimed, and a ball driven in after the break would land in
  # ground the player already owned and lock itself for free (the stranded-lock
  # rule). A breakable that seals a pocket is a free lock with extra steps.
  #
  # THE TURN: at 45% remaining the slab goes whether you were ready or not, with
  # a banner. It reads like a gift and is the opposite. Until it breaks, that
  # stretch of divider is WALL, and wall is what a fence anchors on: a player
  # part-way through sealing the top-right chamber has been leaning on it. The
  # deadline puts a hole in their anchor and a new mouth in the pocket they were
  # about to close. It is a real reason not to break it yourself.
  #
  # The two seams either side of the slab are 12 units, passages to nothing. The
  # doorway below it is 210. Those numbers only survive because this map is at
  # variety 0; see the note at the top of act I.
  - id: level-5
    level: 5
    sizeThreshold: 28
    expectedCuts: 5
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 28
        - kind: smashed
          count: 1
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 150
      - id: slab
        kind: wall
        shape: rect
        x: 437
        'y': 207
        width: 26
        height: 138
        breakable: true
        hitsToBreak: 2
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: guard
        kind: mover
        shape: rect
        x: 300
        'y': 438
        width: 300
        height: 26
        axis: horizontal
        range: 280
        speed: 130
    coloredAreas:
      - kind: var
        x: 630
        'y': 45
        width: 225
        height: 225
        required: false
      - kind: var
        x: 50
        'y': 600
        width: 225
        height: 250
        required: false
    beats:
      - id: deadline
        atSpaceRemaining: 45
        breakId: slab
        announce: game.beatDeadline
    balls: []

  # 6 "Merge Conflict" - FIGHT the breakable, USE the mover.
  #
  # No new mechanic. Map 5 taught that a breakable is a price you pay in tempo;
  # this one charges the opposite way round, because the fourth thing breaking a
  # wall does is the one nobody thinks about: it MERGES two regions into one.
  #
  # The divider is soft, and the balls chip it just by living. Nothing the
  # player does protects it - they can steer away from it, and that is the
  # skill - so the two-chamber board they are reading is on a clock they do not
  # control. Seal the far room while it is still a room, or clear the near one
  # safely and find the far one has become the same room.
  #
  # Two 66-unit necks, one at each end of the divider, are the honest way
  # through while it stands. Both are legal passages rather than the seams on
  # map 5: this map is about the wall in the middle, not about getting past it.
  #
  # No patrol, deliberately. Maps 4 and 5 are both about a mover and 7 and 9
  # both use one, and mechanicSpread flagged the act at seven movers in ten maps
  # when this map had one too - which is the "same gimmick every map" line in the
  # guidelines' own anti-pattern list. The pressure here is the wall's decay, and
  # a patrol on top of it would have been decoration charged as difficulty.
  #
  # THE TURN: at 55 seconds the divider goes whether the balls got there or not.
  # A clock rather than a threshold, because the whole map is a race against
  # something the player cannot stop, and a space trigger would have made it
  # something they caused.
  - id: level-6
    level: 6
    sizeThreshold: 25
    expectedCuts: 5
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 25
        - kind: smashed
          count: 1
    entities:
      - id: anchor-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 84
      - id: gate
        kind: wall
        shape: rect
        x: 437
        'y': 195
        width: 26
        height: 510
        breakable: true
        hitsToBreak: 3
      - id: anchor-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 771
        width: 26
        height: 84
      - id: nook-lip
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
    beats:
      - id: deadline
        atSeconds: 55
        breakId: gate
        announce: game.beatDeadline
        leadMs: 2000
    balls: []

  # 7 "Bonus Pool" - MEET the chest, USE the breakable.
  #
  # The chest is the first thing on the board that pays for being DESTROYED
  # rather than for being sealed around, which is why it gets its own map: every
  # lesson so far has been "make a small room and put a ball in it", and this one
  # is "drive a ball at that until it comes apart".
  #
  # It sits in an open alcove, not a sealed one. A vault with no way in is a
  # region captureUnreachableCells writes off at load, and the map would hand it
  # over for free before the player touched anything - the trap map 5's first
  # draft fell into. The mouth is 84 units, a legal neck, and a patrol crosses
  # the approach to it.
  #
  # So the alcove is worth two different things and they compete for the same
  # ball. Keep one in there and it smashes the chest for loot; seal the mouth
  # with a ball inside and you have a lock instead. Doing both means holding a
  # ball in the alcove while you draw the cut across a patrol's line, which is
  # the map's one greedy read.
  #
  # The partition is the safe skip. Breaking it opens the lower half into one
  # room, which is map 6's lesson quoted back: easier to reach, harder to seal.
  - id: level-7
    level: 7
    sizeThreshold: 22
    expectedCuts: 6
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 2
    win:
      require:
        - kind: space
          threshold: 22
        - kind: smashed
          count: 2
    entities:
      # The alcove is ONE wall now. It used to be two - a 141-long jamb hanging
      # off the top edge at x 585 and this 270-long lip - which left the only
      # way in as an 84-unit slot between the jamb's foot and the lip's top,
      # against a 36-wide ball. Legal by the gap rule and miserable in the
      # hand: the chest is one of the two smashes this map REQUIRES, so the
      # hardest steering on the board was guarding a mandatory objective rather
      # than an optional prize.
      #
      # Dropping the jamb (the shorter of the two, so the shelf that defines
      # the alcove survives) opens the top-right to anything coming across from
      # the left. The lip still makes it a pocket you have to mean to enter,
      # and the patrol below still decides when.
      - id: vault-lip
        kind: wall
        shape: rect
        x: 585
        'y': 270
        width: 270
        height: 24
      - id: chest-7
        kind: wall
        shape: rect
        x: 700
        'y': 90
        width: 110
        height: 90
        chest: true
        breakable: true
        hitsToBreak: 3
      - id: partition
        kind: wall
        shape: rect
        x: 300
        'y': 400
        width: 26
        height: 455
        breakable: true
        hitsToBreak: 3
      - id: patrol
        kind: mover
        shape: rect
        x: 450
        'y': 330
        width: 200
        height: 26
        axis: horizontal
        range: 240
        speed: 150
    beats:
      - id: crunch
        atSeconds: 55
        speedSpike: 0.15
        announce: game.beatCrunchTime
        leadMs: 2000
    balls: []

  # 8 "Refactor" - MEET reveals, BREAK the marked zone.
  #
  # `reveals` is the one mechanic that makes the board BIGGER. The corner behind
  # the curtain is 276x255 of board that does not exist yet: its cells start
  # locked and uncuttable, and three hits on the curtain hand them over.
  #
  # THE BOX STOPS BEING OPTIONAL HERE. On map 3 it was a bonus pocket, drawn
  # dotted, free to ignore. This map is where it becomes a WIN CONDITION: clear
  # to 81% AND lock at least one ball inside it, and it is drawn solid and
  # bright to say so. That is the last new thing a colored area can do, and it
  # is the second half of map 3's lesson rather than a different mechanic.
  #
  # Both clauses, not one. Flipping `required: true` alone would make the area
  # the SOLE win (see resolveWinSpec) and the clear would stop mattering, which
  # is the "a gate never replaces the clear" rule in the guidelines. An authored
  # `win:` block asks for both, so the box is a second thing to do while doing
  # the first.
  #
  # It is also this map's inversion, twice over. The box is not even THERE until
  # the curtain is paid for - so the mechanic the map teaches is now MANDATORY,
  # not a greed hook - and the moment it arrives it is 10.7% of the board, over
  # the 10% lock threshold, so sealing the whole corner does not lock at all.
  # The player has to cut it down before it counts. The pocket they learned to
  # measure on map 3 will not hold still.
  #
  # The Turn is the safety net: it force-breaks the curtain at 45% remaining, so
  # a player who never worked out that the wall was the way in still gets the
  # corner in time to seal something in it.
  #
  # The corner is sealed by two board edges, the curtain and a jamb, with a
  # 12-unit seam between them: no ball can be inside it. That is not cosmetic.
  # The first draft revealed an open strip instead, and the bot audit came back
  # with nineteen "[OWNERSHIP] ball has no valid region" against a baseline of
  # one or two - balls wandering into cells that are REMOVED by design and
  # belong to no region. A revealed area has to be genuinely shut.
  #
  # Power-up tokens arrive on this map by gate (pickups.start_level is 8), so
  # the spots are authored rather than left to the roll.
  #
  # THE TURN: at 45% remaining the curtain goes on its own, and the space bar
  # runs BACKWARDS. Ten percent of new board appears at the moment the player
  # was closing out the map, and their remaining% - the one number they have
  # been steering by for eight maps - goes up. Telegraphed, so it is a shock
  # rather than an ambush.
  - id: level-8
    level: 8
    sizeThreshold: 19
    expectedCuts: 6
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 3
    win:
      require:
        - kind: space
          threshold: 19
        - kind: area
          count: 1
    coloredAreas:
      - kind: var
        x: 579
        'y': 45
        width: 276
        height: 255
    pickupSpots:
      - x: 150
        'y': 200
      - x: 250
        'y': 700
      - x: 620
        'y': 640
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 200
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: curtain-jamb
        kind: wall
        shape: rect
        x: 555
        'y': 45
        width: 24
        height: 243
      - id: curtain
        kind: wall
        shape: rect
        x: 555
        'y': 300
        width: 300
        height: 24
        breakable: true
        fence: true
        hitsToBreak: 3
        reveals:
          x: 585
          'y': 51
          width: 264
          height: 243
    beats:
      - id: deadline
        atSpaceRemaining: 45
        breakId: curtain
        announce: game.beatDeadline
    balls: []

  # 9 "Release Candidate" - the skill check. Nothing new.
  #
  # The act ends on a map with no toys in it, because the boss is never the
  # first test of an act's content. Everything here has been met and developed:
  # a doorway, a patrol across it, a breakable that merges what it separates, a
  # chest that pays for being smashed, and a pink box that pays for being sealed
  # around. Three balls, and the tightest threshold of the act at 84%.
  #
  # The one thing it adds is that all five compete for the same attention at
  # once. The chest and the box are on opposite sides of the divider, so the
  # greedy line is to run a ball at the chest while sealing around the box, and
  # the patrol crosses the only doorway between them.
  #
  # THE TURN: map 3's speed spike, back at its smallest and latest. The act
  # opened by teaching that the board reacts to progress; it closes by charging
  # for it when there is the least room left to absorb it.
  - id: level-9
    level: 9
    sizeThreshold: 16
    expectedCuts: 7
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 3
    win:
      require:
        - kind: space
          threshold: 16
        - kind: smashed
          count: 2
    coloredAreas:
      - kind: var
        x: 45
        'y': 610
        width: 200
        height: 245
        required: false
    pickupSpots:
      - x: 620
        'y': 640
      - x: 250
        'y': 200
    entities:
      - id: jamb-top
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 285
      - id: jamb-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 540
        width: 26
        height: 315
      - id: pay-lip
        kind: wall
        shape: rect
        x: 45
        'y': 586
        width: 200
        height: 24
      - id: vault-lip
        kind: wall
        shape: rect
        x: 585
        'y': 270
        width: 270
        height: 24
      - id: chest-9
        kind: wall
        shape: rect
        x: 700
        'y': 90
        width: 110
        height: 90
        chest: true
        breakable: true
        hitsToBreak: 3
      - id: seam
        kind: wall
        shape: rect
        x: 130
        'y': 300
        width: 26
        height: 180
        breakable: true
        hitsToBreak: 3
      - id: strut
        kind: wall
        shape: rect
        x: 660
        'y': 470
        width: 26
        height: 180
        breakable: true
        hitsToBreak: 3
      - id: patrol
        kind: mover
        shape: rect
        x: 437
        'y': 380
        width: 26
        height: 120
        axis: horizontal
        range: 300
        speed: 175
    beats:
      - id: crunch
        atSpaceRemaining: 35
        speedSpike: 0.12
        announce: game.beatCrunchTime
    balls: []


  - id: level-10
    level: 10
    sizeThreshold: 15
    expectedCuts: 8
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 1
    timeLimit: 65
    # Colored Area (required win-gate): trap the boss INSIDE this pink var area to
    # ship it; trapping it outside fails the map (lose a life, restart). var is the
    # easiest kind (1.5x). ~20% of the board, top-right in the standard orientation.
    coloredAreas:
      - kind: var
        x: 500
        'y': 45
        width: 355
        height: 335
    # Boss (issue #56): the first boss, gating the Promotion. The Release Candidate
    # is a big/fast antagonist you must DEFEAT by fencing it into the var area above;
    # clearing space alone will not complete the map (the area is the win gate), and
    # the deadline is the fail state. Scope Creep runs hot from second 0. Beating it
    # routes into the once-per-run Promotion draft.
    boss:
      name: Release Deadline
      intro: >-
        Your first boss. The Release Candidate is loose: a big, fast ball, with
        Scope Creep hot from the first second. Clearing the board is not enough:
        fence it into the pink var area (top right) to ship it. Trap it anywhere
        else and you lose a life. Beat the deadline.
      creepFromStart: true
      objective:
        id: defeat-rc
        name: Defeat the Release Candidate
        description: Fence the boss into the var area to ship it.
        clarify: >-
          Trap the Release Candidate inside the pink var area to defeat it. Trapping
          it outside the area fails the map (you lose a life and the map restarts).
          Running out of time also fails.
        kind: defeatBoss
        reward: 12
      bossBall:
        # No HP: the boss is won by fencing it into the var area (the Colored Area
        # gate decides it). hp 1 => no HP pips in the HUD. It KEEPS spawning adds
        # (maxMinions = the concurrent cap, refilled as you lock them away), so
        # managing the minions is the second layer while you corner the boss.
        hp: 1
        radiusScale: 2.5
        speedScale: 1.15
        color: "#ff2d55"
        spitIntervalSeconds: 6
        # Two at a time, deliberately (issue: keep the L10 boss to 2 adds). The cap
        # is on ACTIVE minions, so locking one frees the slot and the boss buds
        # another: the fight is about KEEPING them sealed, not out-clearing a
        # crowd. Four made the board a scramble where the boss was the easy part.
        maxMinions: 2
    entities:
      - id: pillar
        kind: wall
        shape: circle
        cx: 450
        cy: 450
        radius: 80
      - id: floor-sweep
        kind: mover
        shape: circle
        cx: 430
        cy: 720
        radius: 40
        axis: horizontal
        range: 500
        speed: 120
        phase: 0
