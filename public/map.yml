  # 14 "Downtime" - MEET gravity. The floor is alive and the walls throw you back.
  - id: level-14
    level: 14
    # The board where you MEET real gravity, so the board shows you nothing but
    # gravity. It was a five-obstacle map, and on a board full of shelves a ball
    # never gets a fall long enough to look like one: it clips something within
    # half a second and the arc you were meant to read never finishes. Reported
    # as "still not normal gravity" with the physics already in and working.
    #
    # Bare on purpose, so the only thing to read is the fall and the turn.
    # (15 used to be this board again with wells on it; it is a well feeding a
    # cup now, and the bouncy sides stayed here, where a falling board needs
    # them.)
    sizeThreshold: 14
    # Between 13 (this map with obstacles to hide behind) and 15's bare board.
    # Losing the shelves cuts both ways: nothing blocks a fence, and nothing
    # subdivides the board for you either.
    expectedCuts: 8
    points: 5
    maxBalls: 3
    variety: 0
    randomShapes: 0
    ballTypeIds: [red, blue, red]
    # The room turns a quarter every ten seconds and down goes with it. This is
    # the map as it was described: no obstacles, four bouncy sides, real gravity
    # and a recurring tilt. It shipped briefly as `steady_gravity`, which is the
    # same board with the turn taken out, because I split one design into two
    # maps that nobody asked to be split.
    #
    # The turn is what makes a fence a decision rather than a shape. You draw
    # one to catch a ball against the floor, and ten seconds later the floor is
    # a wall and the ball is falling somewhere else.
    mutator: tipping
    # Gravity is screen-relative: it starts pulling screen-down whatever
    # orientation the map was dealt in. The board here is bare and symmetric so
    # a deal rotation changes nothing you can see, but the flag is already right
    # for whoever puts the first entity on it.
    neverRotates: true
    # All four, and all the same. A bouncer per side is what keeps a falling
    # board alive: gravity trades height for speed and back, and the walls are
    # what put back the little that each bounce loses. It also has to READ as
    # symmetrical, since a player who can see chevrons on three sides and a bare
    # floor on the fourth has been told the floor is different when it is not.
    #
    # 1.05, not the 1.15 the floor used to carry. Under a pull that only steered
    # the floor had to supply the speed; under one that accelerates, the fall
    # supplies it and a heavy kick just pumps every ball to terminal, where it
    # is moving at a constant speed again.
    boardEdges:
      top:
        kick: 1.05
      bottom:
        kick: 1.05
      left:
        kick: 1.05
      right:
        kick: 1.05
    # No breakables left to smash, so the clause that named them had to go. A
    # bare board can ask for a lock and nothing else: "catch one in flight",
    # which is the whole skill this map teaches.
    win:
      require:
        - kind: space
          threshold: 14
        - kind: locks
          count: 1
    entities: []
    balls: []

  - id: level-15
    level: 15
    # MEET the gravity well, and nothing else.
    #
    # A cup sits on the floor in the middle of the board, open at the top, and
    # a well hangs over its mouth pulling down into it. The win is a ball
    # locked in the cup. So the well is not terrain to route around: it is the
    # thing doing the aiming, and the read is when to trust it - let it drop a
    # ball in, then close the lid across the cup's mouth before the ball
    # bounces back out through the well.
    #
    # Reported from play as a weird map: "bouncers on all sides, but no general
    # gravity", and the wells not introduced by the design. It was a bare board
    # with two wells a player could ignore, four bouncy sides carried over from
    # 14 (where they exist to keep a falling board alive; with no global pull
    # here they were only noise), and a win of `locks: 2` that never mentioned
    # a well. The sides are plain again, and the win is the cup the well feeds.
    #
    # Measured, eight seeds, twenty seconds with no cuts: balls spend 13.2% of
    # their time in the cup with the well and 6.2% without it. On the bot sweep
    # the win rate is the same either way (15 of 16) and the well saves about a
    # third of the cuts, median 14 against 20: it is the helper it is meant to
    # be, not a gate.
    #
    # One well rather than two. A second well pulling elsewhere would be a
    # second relationship on a MEET map; one well over one cup says one thing.
    # 3.0 turn rate, the value the mechanic was designed around, since nothing
    # else on the board competes with it.
    #
    # No `neverRotates`: with no global pull there is nothing to keep upright,
    # and rotateGravityWell turns the well's position and bearing together, so
    # the cup and the well stay a pair on every deal.
    sizeThreshold: 13
    expectedCuts: 7
    points: 5
    maxBalls: 3
    variety: 0
    randomShapes: 0
    ballTypeIds: [red, blue, red]
    gravityWells:
      - x: 355
        y: 400
        width: 190
        height: 230
        turnRate: 3.0
        pull: down
    win:
      require:
        - kind: space
          threshold: 13
        - kind: area
          count: 1
    coloredAreas:
      - kind: var
        x: 355
        'y': 650
        width: 190
        height: 205
    # The cup: two walls standing on the floor, 190 apart inside, 205 tall.
    # Its mouth is the line y 650 between their tops, one fence wide.
