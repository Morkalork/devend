# The ladder: the maps a run is built from (useLevelManager).
#
# Started over in November 2026 for the brick pivot (BRICKS_PLAN.md): breaking
# bricks moves to the centre of the game, and the ladder is rebuilt around it
# one map at a time. The 45 maps that were here are in maps-archive.yml,
# unchanged: not played in a run, but every one opens in the Playground
# (Admin > Playground > the level picker's "Archive" list) to be tried again.
#
# Read MAP_DESIGN_CARD.md before adding a map.
levels:
  # 1 "First Commit" - MEET the doorway, and the choice to end early.
  #
  # Two rooms, one doorway, one ball. The only decision on the board is the one
  # the whole game is made of: locking every ball WINS the map outright (the
  # standing allLocked alternative in winSpec), and with one ball that means the
  # nook in the top-right corner is a button marked "finish now". Take it and
  # you get a superior lock and the Ship Early bonus on a board you barely
  # touched. Leave it and you clear to 60% for the space money with the ball
  # still loose.
  #
  # No mechanic, no Turn. A Turn needs a plan to disrupt and the player does not
  # have one yet; see MAP_DESIGN_GUIDELINES.md section 6.3.
  #
  # The nook is 155x150 = 3.5% of the board, comfortably under the 4% superior
  # bar at this map's denominator (one ball, so it never drops below the initial
  # cell count). Nothing points at it. Some players will seal there by accident
  # and get paid, which teaches pocket size better than any explanation.
  # Heights (3D board, objectRise.ts): the doorway is the map, so its jambs stand tall; the nook's lip sits low, the invitation to seal.
  #
  # Par 5 and points 8 (were 3 and 5), so a first run can buy something
  # after it (BOT_PLAYERS.md). Pay holds while a player is within two fences
  # of par and falls off a cliff at three over (the base is cut to a fifth and
  # the space bonus goes): at par 3 a beginner drawing six fences was paid 9h,
  # under the 15h of the cheapest rung or Junior root. Now: 22h at par, 18h one
  # over, 17h two over, measured with the bot's own clears and par set to land
  # it there. Still under map 2, which is harder and pays more.
  - id: level-1
    name: Hello World
    level: 1
    premise: "The one where locking the only ball wins outright, so the corner nook is a button marked finish now."
    sizeThreshold: 40
    expectedCuts: 5
    points: 8
    variety: 0
    randomShapes: 0
    maxBalls: 1
    win:
      require:
        - kind: space
          threshold: 40
        - kind: locks
          count: 1
    entities:
      - id: jamb-top
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 45
        width: 26
        height: 300
      - id: jamb-bottom
        rise: 1.5
        kind: wall
        shape: rect
        x: 437
        'y': 555
        width: 26
        height: 300
      - id: nook-lip
        rise: 0.75
        kind: wall
        shape: rect
        x: 700
        'y': 195
        width: 155
        height: 24
    balls: []

  # 2 "Unit Tests" - MEET the brick, and the clock.
  #
  # Nine bricks in a block in the middle of an open board, thirty seconds.
  # Nothing else. The only question is how often a ball gets to the block, and
  # that is the lesson: on the open board the ball wanders and the clock runs
  # out, and every fence that takes empty board away sends it back to the block
  # sooner. Locking the board down is how the bricks get broken.
  #
  # Built for ONE ball (MAP_DESIGN_CARD.md section 5): under the tree a player
  # arrives here with the one ball they started with, and a second costs 100h,
  # about four maps of pay. maxBalls 2 is the cap a later fleet would be held to.
  #
  # The win is seven of the nine: two spare (section 3), so one fence that
  # walls a brick off is a lesson and not the end of the map. Space is not
  # asked for: here a fence is a tool for breaking, not the goal.
  #
  # Pays more than map 1 (points 22 against 8): it is the harder map. At 5 it
  # paid 12h at par, less than the map before it; 22 keeps it above map 1
  # after map 1's own retune.
  #
  # Measured (BOT_PLAYERS.md, the six players in practice, 30 runs each, par
  # +60 so the bot's pay reads as a tidy player's): the Casual player wins 59%
  # of attempts, the Fence Engineer 77% (Fast Compile, bought after map 1, is
  # time against the clock), the clock is 56% of losses and walled-off bricks
  # most of the rest. Real runs finish the ladder 77-80% of the time. At nine
  # of nine and points 5 Casual won 46%, the clock took two losses in three,
  # and no player could buy anything before it.
  - id: level-2
    name: Unit Tests
    level: 2
    premise: "The one where nine bricks sit in the middle and thirty seconds is only enough if you fence your ball in around them."
    sizeThreshold: 15
    timeLimit: 30
    expectedCuts: 4
    points: 22
    variety: 0
    randomShapes: 0
    maxBalls: 2
    pickupChance: 0
    win:
      require:
        - kind: smashed
          count: 7
          of: shards
    entities:
