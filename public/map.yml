        brittle: true
      - id: gate-10
        kind: wall
        shape: rect
        x: 437
        'y': 582
        width: 26
        height: 35
        brittle: true
      - id: gate-11
        kind: wall
        shape: rect
        x: 437
        'y': 625
        width: 26
        height: 35
        brittle: true
      - id: gate-12
        kind: wall
        shape: rect
        x: 437
        'y': 668
        width: 26
        height: 35
        brittle: true
      - id: anchor-bottom
        kind: wall
        shape: rect
        x: 437
        'y': 771
        width: 26
        height: 84
      - id: nook-lip
        kind: wall
        shape: rect
        x: 700
        'y': 195
