  # ===========================================================================
  # ACT IV - CRUNCH (31-35): everything at once.
  #
  # The act that was never migrated, and it showed. It sat at 70-72% clear with
  # 4-5 cuts while act III asked for 86-93% and 9: level 31 demanded LESS of the
  # player than level 4 did. Its five maps between them put 8 balls on the board
  # against act III's 15, which also gave the assignment block spanning it the
  # thinnest targets on the ladder.
  #
  # It owns no new primitives, by design (MAP_DESIGN_GUIDELINES.md): this is where the
  # vocabulary the other acts taught gets combined and then turned around. What
  # IS new is that these maps state their own win conditions rather than leaning
  # on the implicit clear, and PRICE them: a map that asks for something harder
  # than emptying the board pays for it.
  # ===========================================================================

  # 31 "Oncall" - FIGHT: terminals crossed with the one-way membrane.
  # The post-boss breather that is not one. A sleeper reserves space you cannot
  # capture, so you have to wake it - and the neck it wakes above only works
  # downwards. Page yourself and the problem goes to the lower chamber, where
  # the const pocket is, and it does not come back up. The decision is the
  # ORDER: bank the pocket first and wake it into a half you have finished with,
  # or wake it early for the space and spend the rest of the map working around
  # it downstairs. Act IV opens on rules the player already knows, on purpose.
  # The gates on 32-34 only land if the first map plays straight.
  - id: level-31
    level: 31
    sizeThreshold: 8
    expectedCuts: 8
    points: 20
    variety: 12
    randomShapes: 8
    maxBalls: 3
    coloredAreas:
      # Act IV: a const pocket tucked under the right shelf. Worth 3x, and the
      # shelf is in the way of every comfortable cut to it.
      - kind: const
        x: 685
        'y': 685
        width: 170
        height: 170
        required: false
    circuit:
      radius: 28
      announce: game.circuitComplete
      terminals:
        - x: 180
          'y': 200
          ball: { x: 450, y: 430 }
    entities:
      # Two chambers over a 220-wide neck. Wide enough to be a corridor rather
      # than a seal, so the neck is where you fight, not where you finish.
      - id: shelf-left
        kind: wall
        shape: rect
        x: -20
        'y': 330
        width: 360
        height: 26
      - id: shelf-right
        kind: wall
        shape: rect
        x: 560
        'y': 330
        width: 320
        height: 26
      # The 220-wide neck between the shelves, now one-way. This is what turns
      # waking the sleeper from a chore into a choice.
      - id: escalation
        kind: wall
        shape: rect
        x: 340
        'y': 330
        width: 220
        height: 26
        oneWay: down
      # The greed hook: a tight corner pocket hanging off the top right, whose
      # only approach runs back over the well's mouth.
      # Lifted so the way in is a 70-wide neck rather than the 50 it was: a gap
      # a ball only half-fits through is the one thing MAP_DESIGN_GUIDELINES.md forbids, and
      # 50 against a 36 diameter is precisely that.
      - id: hook-lip
        kind: wall
        shape: rect
        x: 700
        'y': 110
        width: 26
        height: 150
      - id: pillar
        kind: wall
        shape: circle
        cx: 250
        cy: 640
        radius: 54
      # The DRAIN: a pipe under the neck, and the map's second decision.
      #
      # The shelf above already only works downwards, so the lower half fills
      # and never empties. This is the same rule turned into a place rather
      # than a floor: its lid is one-way too, so a ball that drops in cannot
      # climb back out, but the pipe is OPEN AT THE BOTTOM, so it leaves the
      # ordinary way unless you close it.
      #
      # That is the whole of it. One short cut across the bottom turns a pocket
      # that filled itself into a lock, and the cut is cheap - the mouth is 92
      # units, the narrowest seal on the map. What it costs is timing: cut it
      # empty and you have spent a fence on nothing, cut it late and the ball
      # has already wandered out the bottom.
      #
      # Sitting under the escalation neck on purpose. Paging yourself does not
      # only move the problem downstairs now, it feeds this.
      - id: drain-lid
        kind: wall
        shape: rect
        x: 380
        'y': 470
        width: 140
        height: 26
        oneWay: down
      - id: drain-left
        kind: wall
        shape: rect
        x: 380
        'y': 496
        width: 24
        height: 264
      - id: drain-right
        kind: wall
        shape: rect
        x: 496
        'y': 496
        width: 24
        height: 264

  # 32 "Controlled Burn" - FIGHT: the chest crossed with the charge, under a WIP
