levels:
  # L1 "The Vault" - the greed hook, with no way to lose it. The bare loop is
  # taught once by the first-run-only onboarding map (src/lib/onboardingMap.ts),
  # so map 1 can already ask a question: seal the ball anywhere and you clear it,
  # or shepherd it into the pink var pocket and get paid 1.5x for the same work.
  # The pocket is a BONUS area (required: false): ignoring it costs nothing, so
  # the first real map cannot punish you. By L10 the same pink box is the boss's
  # win gate, and the player already knows how to read it.
  - id: level-1
    level: 1
    sizeThreshold: 40
    expectedCuts: 3
    points: 20
    variety: 0
    randomShapes: 0
    maxBalls: 1
    coloredAreas:
      - kind: var
        x: 640
        'y': 640
        width: 215
        height: 215
        required: false
    entities:
      # Two stubs bracket the bottom-right corner, leaving one diagonal doorway
      # (~85 wide, a ball is 36) that a single short fence closes.
      - id: vault-lip-v
        kind: wall
        shape: rect
        x: 610
        'y': 700
        width: 30
        height: 220
      - id: vault-lip-h
        kind: wall
        shape: rect
        x: 700
        'y': 610
        width: 220
        height: 30
  # "Split Shift" (LEVELDESIGN.md): two server racks joined by a single central
  # aisle (neck). Topology (C1): pinch the aisle to trap a ball in a rack. Its
  # one new idea is the second ball: two balls on an open board is a thrill, not
  # a threat, which is exactly the dose the second map you ever play wants.
  #
  # This map used to carry a Turn that dropped a third ball in at 60% remaining.
  # It was pulled: the add lands as a visible cell division (the level-10 boss's
  # move), and on map 2 there is no boss yet to have taught what that means, so
  # it read as a ball splitting for no reason. It now lives on level 12, past
  # the boss - see DUPLICATION_MIN_LEVEL in mapBeats.ts. The mid-map change is
  # taught on level 4 instead, by its speed surge.
  - id: level-2
    level: 2
    sizeThreshold: 30
    expectedCuts: 4
    points: 20
    variety: 3
    maxBalls: 2
    entities:
      - id: divider-top
        kind: wall
        shape: rect
        x: 440
        'y': -20
        width: 20
        height: 410
      - id: divider-bottom
        kind: wall
        shape: rect
        x: 440
        'y': 510
        width: 20
        height: 410
  # Sibling of Split Shift, rotated: the aisle runs horizontally instead.
  - id: level-2b
    level: 2
    sizeThreshold: 30
    expectedCuts: 4
    points: 20
    variety: 3
    maxBalls: 2
    entities:
      - id: divider-left
        kind: wall
        shape: rect
        x: -20
        'y': 440
        width: 410
        height: 20
      - id: divider-right
        kind: wall
        shape: rect
        x: 510
        'y': 440
        width: 410
        height: 20
  # "Corner Office": a central block carves four rooms; one tight top-right
  # pocket is a 2x BONUS let area (C2, the greed hook). Seal a ball there for
  # double (a snug, risky cut) or bank the safe rooms. Bonus, not a gate: the
  # same read as L1's vault, one step harder, and this early a missed pocket
  # must never fail the map.
  - id: level-3
    level: 3
    sizeThreshold: 35
    expectedCuts: 4
    points: 20
    variety: 5
    maxBalls: 2
    # The old 2x lockZone, now the single authorable form of the greed hook: a
    # BONUS let area (let = 2x, the same payout) that gates nothing.
    coloredAreas:
      - kind: let
        x: 670
        'y': 60
        width: 170
        height: 170
        required: false
    entities:
      - id: core
        kind: wall
        shape: rect
        x: 340
        'y': 340
        width: 220
        height: 220
  # Sibling of Corner Office: round core, the 2x pocket in the top-left instead.
  - id: level-3b
    level: 3
    sizeThreshold: 35
    expectedCuts: 4
    points: 20
    variety: 5
    maxBalls: 2
    coloredAreas:
      - kind: let
        x: 60
        'y': 60
        width: 170
        height: 170
        required: false
    entities:
      - id: core
        kind: wall
        shape: circle
        cx: 450
        cy: 450
        radius: 150
