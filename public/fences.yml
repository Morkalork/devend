# Fence types (FENCE_TYPES_PLAN.md): what KIND of fence the next cut draws.
#
# Five slots sit beneath the board. Slot 1 is always `standard` and cannot be
# unequipped; the other four hold whatever the player has acquired. Selecting a
# slot changes every cut from then on until it is changed again - this is a MODE,
# not a consumable, and there is no charge counter anywhere.
#
# ── The rule that keeps the bar honest ─────────────────────────────────────
#
# A special fence is unlimited once owned, and pays for itself by BUILDING
# SLOWER. The whole tension of a fence is the race between it finishing and
# something hitting it, so a slower fence is a real risk taken on purpose on
# every single cut, and it needs no meter on screen to be felt. Anything with
# `buildSpeed` below 1 is buying its effect with that risk.
#
# `tripwire` is the deliberate inverse: it builds FASTER and fractures on the
# first hit. The axis has to run both ways or it is just a tax.
#
# ── Fields ─────────────────────────────────────────────────────────────────
#   id            unique key; also what a slot stores and what the store sells
#   name          display name (slot label, info modal title)
#   color         the fence's colour on the board (hex WITH '#', quoted)
#   buildSpeed    growth multiplier. 1 = the standard fence. Below 1 is slower.
#   ballSpeedStep world-units a ball's speed changes on bouncing off it.
#                 Negative = ice (slows), positive = flare (speeds up), absent
#                 = no effect. Clamped to the ball's own minimumSpeed floor and
#                 to a ceiling; debounced, so one contact counts once.
#   maxHits       ball hits this fence survives before it fractures. Absent =
#                 the game's default (FENCE_FRACTURE_HITS).
#   anchorOnBreakable  true = a cut may START on a breakable. Only the drill.
#   drillDamage   damage per second dealt to a breakable this fence touches.
#   source        where it comes from: always | store | upgrade | certificate.
#                 Documentation for now; the acquisition wiring is step 7.
#   description   info modal: one-line "what it does"
#   howTo         info modal: one-line "how to use it"

fences:
  # The fence the game has always drawn. Always in slot 1, never unequipped,
  # and the thing every other entry is measured against - which is why its
  # buildSpeed is 1 rather than absent: a reader comparing two rows should not
  # have to know that a missing field means "the baseline".
  - id: standard
    name: Standard
    color: "#00ff88"
    buildSpeed: 1
    source: always
    description: "The ordinary fence. Builds fastest and costs nothing."
    howTo: "Always available. Drag to cut."

  - id: ice
    name: Ice
    color: "#7fd4ff"
    buildSpeed: 0.7
    ballSpeedStep: -22
    source: store
    description: "Balls bouncing off it lose speed, down to their floor."
    howTo: "Build it where balls bounce most. It grows slower, so pick your moment."

  - id: flare
    name: Flare
    color: "#ff5b5b"
    buildSpeed: 0.7
    ballSpeedStep: 18
    source: upgrade
    description: "Balls bouncing off it speed up. Faster balls are worth more, and more dangerous."
    howTo: "Line it where you want a ball moving, and stay out of its way."

  - id: rebar
    name: Rebar
    color: "#b9c4cf"
    buildSpeed: 0.6
    maxHits: 6
    source: store
    description: "Takes far more punishment before it shatters."
    howTo: "Spend it on the one cut you cannot afford to lose."

  # The only entry that is faster than standard, and the only one that is more
  # fragile. It exists so the WIP-limit maps have an answer that is not simply
  # "be better", and so the axis reads as a trade rather than a tax.
  - id: tripwire
    name: Tripwire
    color: "#ffe066"
    buildSpeed: 1.4
    maxHits: 1
    source: upgrade
    description: "Builds much faster, and the first ball to touch it breaks it."
    howTo: "For a cut you need finished NOW, in a lane nothing is about to cross."

  - id: drill
    name: Drill
    color: "#2b2f3a"
    buildSpeed: 0.5
    anchorOnBreakable: true
    drillDamage: 0.6
    source: certificate
    description: "The only fence that may be anchored on a breakable. It chews through what it touches."
    howTo: "Start the cut ON a slab. It eats through, then keeps going to the next wall."
