# Sprint Planning offers: the run-start draft (SPRINT_PLANNING_PLAN.md).
#
# Before map 1 the run deals THREE cards, one from each pool, and the player
# takes one or skips:
#   boon            small and safe; most help the first few maps
#   specialisation  one per archetype tag; only this draft hands them out
#   gamble          a price now for a prize that would take ten maps to reach
#
# When the previous run earned Tenure, the boon slot shows the Tenure chain
# instead of a plain boon (src/lib/sprintOffers.ts).
#
# Fields, all optional unless noted:
#   id, name, description (required)  description is the upside, shown on the card
#   priceText     the downside, shown in red; required when `price` is set
#   modifiers     GameModifiers keys (README-modifiers.md), for as long as the
#                 offer is active. extraLives here is applied once, at the pick.
#   forMaps       `modifiers` apply only for the run's first N maps
#   price         GameModifiers keys, adverse, for the whole run (never expires)
#   overtime      hours banked at the pick
#   prize         upgrades granted at the pick:
#                   { kind: chain, steps: 1-3, shoppedThrough: N }
#                     a Junior, Junior+Senior, or Junior+Senior+Principal chain,
#                     from upgrades on sale by level N (resolved by tenure.ts)
#                   add `choose: N` to let the player pick one of N chains
#                   after the draft, and `distinctTags: true` to make the N
#                   chains lead with different archetypes
#                   { kind: architect }  a random Architect with everything
#                     under it, prerequisites waived
#   unlock        { kind: always } (default) | { kind: levelReached, level: N }
#                 (N must be a level the ladder has: sprintOffers.test.ts checks)
#                 | { kind: archetypeMet, tag: T } (own 3 of tag T in one run)
# Specialisation only:
#   tag           the archetype (required)
#   affinity      the shop weights offers as though you owned this many more
#                 upgrades of the tag
#   guaranteedSlot  every shelf holds at least one card of the tag, when the
#                 unlocked pool has one
#   countsTowardSet  counts as this many owned upgrades of the tag toward its
#                 set bonus (tagSets in upgrades.yml)
# Gamble only:
#   weight        relative odds among the unlocked gambles
#   jackpot       marks the top prize (the card is drawn gold; Admin can force it)

boons:
  - id: onboarding_buddy
    name: Onboarding Buddy
    description: Your first 3 maps each start with 2 instant fences.
    forMaps: 3
    modifiers: { instantFencesPerMap: 2 }

  - id: gentle_ramp
    name: Gentle Ramp
    description: Balls move 15% slower on your first 3 maps.
    forMaps: 3
    modifiers: { ballSpeedMultiplier: 0.85 }

  - id: salary_advance
    name: Salary Advance
    description: Start the run with 30 overtime hours banked.
    overtime: 30

  - id: spare_laptop
    name: Spare Laptop
    description: Start the run with one extra life.
    modifiers: { extraLives: 1 }

  - id: pick_a_junior
    name: Pick a Junior
    description: Choose one of four first-shelf Juniors, free.
    prize: { kind: chain, steps: 1, shoppedThrough: 1, choose: 4 }

# A Specialisation is never on the shelf, never a certificate, never a
# capstone. The shared shape (affinity 2, a guaranteed slot, one toward the
# set) is what makes it a SPECIALISATION; the modifier is its signature, a
# rule the tag's upgrades do not sell.
specialisations:
  - id: reliability
    name: Reliability
    tag: safety
    description: Safety upgrades turn up far more often, and balls open every map at 70% speed for 8 seconds.
    affinity: 2
    guaranteedSlot: true
    countsTowardSet: 1
    modifiers: { openingSlowSeconds: 8 }

  - id: platform
    name: Platform
    tag: tempo
    description: Tempo upgrades turn up far more often, and every fence starts 12% drawn.
    affinity: 2
    guaranteedSlot: true
    countsTowardSet: 1
    modifiers: { fenceHeadStart: 0.12 }

  - id: procurement
    name: Procurement
    tag: bank
    description: Bank upgrades turn up far more often, and every store pays 5% interest on your hours (up to 10h).
    affinity: 2
    guaranteedSlot: true
    countsTowardSet: 1
    modifiers: { shopInterestPercent: 5 }

  - id: containment
    name: Containment
    tag: lock
    description: Lock upgrades turn up far more often, and every lock stops the nearest free ball for a second.
    affinity: 2
    guaranteedSlot: true
    countsTowardSet: 1
    modifiers: { lockStunSeconds: 1 }
    unlock: { kind: archetypeMet, tag: lock }

  - id: cold_storage
    name: Cold Storage
    tag: freeze
    description: Freeze upgrades turn up far more often, and the fastest ball starts every map frozen for 12 seconds.
    affinity: 2
    guaranteedSlot: true
    countsTowardSet: 1
    modifiers: { startFrozenBalls: 1 }
    unlock: { kind: archetypeMet, tag: freeze }

  - id: growth
    name: Growth
    tag: risk
    description: Risk upgrades turn up far more often, and every map pays 15% more overtime for each life you start it below 3.
    affinity: 2
    guaranteedSlot: true
    countsTowardSet: 1
    modifiers: { scoreBonusPerMissingLife: 0.15 }
    unlock: { kind: archetypeMet, tag: risk }

# Two of the old loadouts survive here by name: their price half was fine, it
# was the prize half that was a stat bump.
gambles:
  - id: death_march
    name: Death March
    description: A free Junior and Senior chain.
    priceText: Start with one life fewer.
    weight: 50
    price: { extraLives: -1 }
    prize: { kind: chain, steps: 2, shoppedThrough: 12 }

  - id: hiring_freeze
    name: Hiring Freeze
    description: A free Junior, Senior and Principal chain.
    priceText: The store shows one card fewer all run.
    weight: 30
    price: { extraShopItems: -1 }
    prize: { kind: chain, steps: 3, shoppedThrough: 15 }
    unlock: { kind: levelReached, level: 8 }

  - id: headhunted
    name: Headhunted
    description: Pick one of three full Principal chains, each from a different archetype.
    priceText: Balls move 10% faster all run.
    weight: 15
    price: { ballSpeedMultiplier: 1.1 }
    prize: { kind: chain, steps: 3, shoppedThrough: 20, choose: 3, distinctTags: true }
    unlock: { kind: levelReached, level: 15 }

  # The card that changes what WINNING means, not what a number is worth.
  # `winRequiresSplitLocks` is appended to a map's own win by resolveWinSpec, so
  # the goal chips, the "how to win" modal and the failure screen all pick it up
  # from the one spec they share. Maps that cannot carry it (a boss, a gate
  # zone, a one-ball map) keep their own win: the alternative is a card that
  # makes the boss maps impossible.
  - id: definition_of_done
    name: Definition of Done
    description: Earn 60% more overtime hours all run.
    priceText: Every map you can do it on also demands a ball locked on each side of the board.
    weight: 15
    price: { winRequiresSplitLocks: 1 }
    modifiers: { scoreMultiplier: 1.6 }
    unlock: { kind: levelReached, level: 12 }

  # Bent fences (issue #66): the card that changes the VERB. Two corners, not
  # more: three-plus shapes are legible to draw and illegible to read back off
  # the board a second later. The price is about the same hand that draws: a
  # slower fence gives the balls longer to find the bend you are still building.
  - id: architectural_review
    name: Architectural Review
    description: Draw a bent cut. A fence keeps up to two corners of the line you drew, and only its two loose ends are projected to the walls.
    priceText: Fences grow 25% slower all run.
    weight: 10
    price: { fenceGenerationSpeedMultiplier: 0.75 }
    modifiers: { bentFenceBends: 2 }
    unlock: { kind: levelReached, level: 10 }

  # Always in the pool: a jackpot that has to be unlocked first is not one.
  - id: unicorn
    name: Unicorn
    description: An Architect and everything under it, free.
    weight: 5
    jackpot: true
    prize: { kind: architect }
