# Loadouts — curse + blessing bundles. One is drafted at the run start
# ("Sprint Planning") to shape the run from level 1; the same catalogue also
# powers the post-final-level Ascension draft. Each `modifiers` map uses the
# same GameModifiers keys as upgrades.yml (see README-modifiers.md); a curse is
# simply an adverse value.
#
# Drafted loadouts stack across ascensions, so keep individual effects
# moderate — a deep run accumulates many of these.
#
# `uniqueWinsRequired` (optional): how many UNIQUE wins (runs beaten with
# distinct run-start loadouts) the player must have before this loadout unlocks
# for the run-start draft. Omit it for the loadouts available from scratch. It
# has no effect on the Ascension draft, which always offers the full catalogue.

ascension:
  # Baseline ball-speed multiplier applied per ascension depth, on top of any
  # drafted mutators. Keeps blessing-heavy drafts from trivialising the loop.
  speedRampPerDepth: 1.08

  # Fence durability: while ascended, fences crumble after this many ball
  # hits — declining linearly from `fenceDurabilityBase` on level 1 to
  # `fenceDurabilityAtFinal` on the final level. Fences bordering captured
  # space never break (they hold back the void). The Defensive Programming
  # shop upgrade adds to these numbers.
  fenceDurabilityBase: 6
  fenceDurabilityAtFinal: 2

  # ── The ladder ────────────────────────────────────────────────────────────
  # Ten named rungs, applied cumulatively: everything at or below your depth is
  # in force. This replaces "the same game, balls 8% faster per depth", where
  # depth 3 and depth 4 differed by one number and neither was describable.
  #
  # RULES, NOT NERFS. Most rungs change a rule instead of subtracting from a
  # stat, because a rung that docks a stat meets the shop upgrade that adds to
  # it: `fenceDurabilityBonus: -1` versus Defensive Programming cancels exactly,
  # making that upgrade a mandatory tax and useless everywhere else. Nothing in
  # the shop sells a third assignment door, so `doorOffers` cannot be bought
  # back at any price. Two rungs collide on purpose (the overtime cap against
  # the Stock Options capstone, ball speed against Runtime Optimisation)
  # because there the counter is a real decision, not a purchase.
  #
  # Depths past 10 keep the whole ladder and fall back to speedRampPerDepth for
  # further escalation. Displayed text: no em-dashes.
  ladder:
    - depth: 1
      name: Hiring Freeze
      description: The store opens every other level instead of after every one.
      effects:
        shopEveryOtherLevel: true

    - depth: 2
      name: Reduced Headcount
      description: Every assignment offers two contracts to choose from, not three.
      effects:
        doorOffers: 2

    - depth: 3
      name: Promotion Freeze
      description: No Promotion is awarded this run, whatever you achieve.
      effects:
        noCapstone: true

    - depth: 4
      name: Technical Debt
      description: Finished fences wear out under repeated ball hits and finally break.
      effects:
        fencesWearOut: true

    - depth: 5
      name: Hard Deadline
      description: Scope Creep starts the moment a map does, with no grace period.
      effects:
        modifiers:
          scopeCreepImmediate: 1

    - depth: 6
      name: Budget Cuts
      description: Each map pays 3 fewer overtime hours before hitting its ceiling.
      effects:
        modifiers:
          overtimeCapBonus: -3

    # Two rules with one theme: you cannot stockpile. Tokens rot, and the
    # ability bar is one slot narrower, so a chest stops being free and starts
    # being a question about what you are willing to stop carrying.
    - depth: 7
      name: Use It Or Lose It
      description: Power-up tokens expire in half the time, and you can carry one fewer ability.
      effects:
        pickupLifetimeFactor: 0.5
        abilitySlots: 4

    - depth: 8
      name: Velocity Targets
      description: Balls move 8% faster.
      effects:
        modifiers:
          ballSpeedMultiplier: 1.08

    - depth: 9
      name: Constant Change
      description: Every map that can roll a mutator does. No quiet maps left.
      effects:
        everyMapMutated: true

    - depth: 10
      name: Performance Improvement Plan
      description: A permanent curse joins the run and cannot be dropped, and you can carry only three abilities.
      effects:
        forcedCurseLoadoutId: performance_improvement_plan
        abilitySlots: 3

loadouts:

  # Imposed by Ascension rung 10, never drafted: a curse with no blessing, so
  # nobody would ever pick it and it must not appear as one of three "rewards".
  - id: performance_improvement_plan
    name: Performance Improvement Plan
    curse: Balls move 10% faster and every map pays 10% less.
    blessing: None. This one is not a trade.
    neverDrafted: true
    modifiers:
      ballSpeedMultiplier: 1.10
      scoreMultiplier: 0.90

  - id: crunch_time
    name: Crunch Time
    curse: Balls move 25% faster.
    blessing: Earn 25% more overtime hours.
    modifiers:
      ballSpeedMultiplier: 1.25
      scoreMultiplier: 1.25

  - id: scope_creep
    name: Scope Creep
    curse: Balls are 30% bigger.
    blessing: Fences grow 35% faster.
    modifiers:
      ballSizeMultiplier: 1.3
      fenceGenerationSpeedMultiplier: 1.35

  - id: death_march
    name: Death March
    curse: Lose one life immediately.
    blessing: Earn 75% more overtime hours.
    # Too harsh as a fresh-run opener (you only start with 3 lives).
    uniqueWinsRequired: 1
    modifiers:
      extraLives: -1
      scoreMultiplier: 1.75

  - id: hiring_freeze
    name: Hiring Freeze
    curse: The shop offers 2 fewer upgrades.
    blessing: All shop prices drop by 10%.
    # Too harsh as a fresh-run opener (the early shop is already small).
    uniqueWinsRequired: 2
    modifiers:
      extraShopItems: -2
      shopDiscountMultiplier: 0.9

  - id: legacy_codebase
    name: Legacy Codebase
    curse: Fences grow 20% slower.
    blessing: Start every map with 2 instant fences.
    uniqueWinsRequired: 3
    modifiers:
      fenceGenerationSpeedMultiplier: 0.8
      instantFencesPerMap: 2

  - id: parallel_pipelines
    name: Parallel Pipelines
    curse: Balls move 15% faster.
    blessing: Draw one extra fence at the same time.
    uniqueWinsRequired: 4
    modifiers:
      ballSpeedMultiplier: 1.15
      additionalConcurrentFences: 1

  - id: tech_debt_audit
    name: Tech Debt Audit
    curse: Balls move 10% faster and are 10% bigger.
    blessing: Every map is scored against two extra fences of par.
    uniqueWinsRequired: 5
    modifiers:
      ballSpeedMultiplier: 1.1
      ballSizeMultiplier: 1.1
      parBonus: 2

  - id: night_school
    name: Night School
    curse: Balls move 20% faster.
    blessing: Bank 1 extra Certificate Hour when the run ends.
    uniqueWinsRequired: 6
    modifiers:
      ballSpeedMultiplier: 1.2
      extraCertificateHours: 1

  - id: micromanagement
    name: Micromanagement
    curse: Balls are 20% bigger.
    blessing: Every locked ball slows the remaining balls by 1%.
    uniqueWinsRequired: 7
    modifiers:
      ballSizeMultiplier: 1.2
      microManagerPerLock: 0.01

  - id: roadmap_clarity
    name: Roadmap Clarity
    curse: Balls move 15% faster.
    blessing: See the predicted path of the two fastest balls.
    uniqueWinsRequired: 8
    modifiers:
      ballSpeedMultiplier: 1.15
      ballPathPredictionBounces: 2
      ballPathPredictionBalls: 2

  - id: golden_handcuffs
    name: Golden Handcuffs
    curse: Earn 25% less overtime.
    blessing: Gain 2 extra lives immediately.
    uniqueWinsRequired: 9
    modifiers:
      scoreMultiplier: 0.75
      extraLives: 2

  - id: agile_transformation
    name: Agile Transformation
    curse: Fences grow 15% slower.
    blessing: The shop offers 1 extra upgrade and restocks twice per visit.
    uniqueWinsRequired: 10
    modifiers:
      fenceGenerationSpeedMultiplier: 0.85
      extraShopItems: 1
      shopRestockCount: 2

  # ── Playstyle loadouts: each defines a distinct run fantasy, not just a stat
  # tweak (gambler / trapper / speedrunner / snowball / engine-builder).

  # Speedrunner: the map is frantic from second one, but tempo is score. The
  # fence-grace softens the chaos, so it reads as a "safety net" for aggressive
  # play. Beginner-friendliest of the set, so it unlocks first.
  - id: hotfix_in_prod
    name: Hotfix in Prod
    curse: Scope Creep starts immediately, no grace period.
    blessing: Ship Early pays 2.5x with a longer window, and a graze no longer breaks your fence.
    uniqueWinsRequired: 1
    modifiers:
      scopeCreepImmediate: 1
      shipEarlyBonusMultiplier: 2.5
      shipEarlySecondsPerBall: 6
      fenceGraceMs: 400

  # Trapper: stop clearing space, hunt balls. Push is off, so value comes from
  # pockets; the board slows as you lock, snowballing control.
  - id: bus_factor
    name: The Bus Factor
    curse: No Push Your Luck, and balls are 20% bigger.
    blessing: "Locks pay +1 overtime (superior locks double) and slow every other ball by 3%."
    uniqueWinsRequired: 2
    modifiers:
      disablePushYourLuck: 1
      ballSizeMultiplier: 1.2
      overtimePerLock: 1
      overtimePerSuperiorLock: 1
      microManagerPerLock: 0.03

  # Engine-builder: you cannot bank your way to victory, so you build one. The
  # pre-capture makes maps quicker, cycling shops faster.
  - id: series_a
    name: Series A
    curse: Earn 30% less overtime.
    blessing: Start each map 15% captured. The shop offers 2 more items, restocks twice, and the cheapest is free.
    uniqueWinsRequired: 2
    modifiers:
      scoreMultiplier: 0.7
      startingCapturePercent: 15
      extraShopItems: 2
      shopRestockCount: 2
      freeCheapestOffer: 1

  # Snowball: an in-run cold start. Fences open rough and speed up for every map
  # you clear this run (capped), so a deep run becomes a machine.
  - id: warm_cache
    name: Warm Cache
    curse: Fences grow 25% slower.
    blessing: Fences grow faster for every map you clear this run.
    uniqueWinsRequired: 3
    modifiers:
      fenceGenerationSpeedMultiplier: 0.75
      fenceSpeedPerMapCleared: 0.10

  # Gambler: no safety net. Push Your Luck is the whole run, on a board that
  # punishes greed.
  - id: move_fast_break_things
    name: Move Fast, Break Things
    curse: Pay a life, and balls move 20% faster.
    blessing: Push Your Luck payouts pay triple.
    uniqueWinsRequired: 4
    modifiers:
      extraLives: -1
      ballSpeedMultiplier: 1.2
      pushBonusMultiplier: 3.0

  # Time buyer: the first loadout to touch the freeze family at all, which was
  # eight modifier keys and a whole shop archetype that no card could reach.
  # Curse and blessing are the same sentence read twice: the curse is not having
  # time, the blessing is buying it back, twice a map, on your terms.
  #
  # frozenLockBonus is what makes it a build rather than a panic button. Spent
  # on escaping a mistake the freeze is worth three seconds; spent setting up a
  # lock it is worth double the lock, so the card teaches its own best line.
  - id: code_freeze
    name: Code Freeze
    curse: Fences grow 25% slower.
    blessing: Tap a ball to freeze it, twice a map, and a lock taken on a frozen ball pays double.
    uniqueWinsRequired: 3
    modifiers:
      fenceGenerationSpeedMultiplier: 0.75
      ballFreezeDuration: 3
      freezeUsesPerMap: 2
      frozenLockBonus: 1

  # Engine: the only card in the catalogue with a feedback loop. Beat the
  # tightened par and the next map starts two fences up, which makes the next
  # one easier to beat; miss once and the engine stops until you rebuild it.
  #
  # Deep gate because it is the most demanding card here: it makes CUT COUNT
  # the resource, and a player who has not internalised par will read the curse
  # as small and the blessing as free.
  - id: definition_of_ready
    name: Definition of Ready
    curse: Every map is scored against one fence FEWER of par.
    blessing: Beat par and the next map starts with two fences already drawn. Under-par bonuses pay 2.5x.
    uniqueWinsRequired: 5
    modifiers:
      parBonus: -1
      underParInstantFence: 2
      underParBonusMultiplier: 2.5

  # The card that changes what WINNING means, not what a number is worth.
  #
  # Every other loadout tunes the run; this one rewrites the objective of every
  # map you already know. `winRequiresSplitLocks` is appended to a map's own win
  # by resolveWinSpec, so the goal chips, the "how to win" modal and the failure
  # screen all pick it up from the one spec they already share.
  #
  # Maps that cannot carry it keep their own win untouched: a boss map's ending
  # is the boss, a gate map's is the zone, and a map that spawns one ball can
  # never pay two sides. That is the design and not a gap, because the
  # alternative is a card that makes the boss maps impossible.
  - id: definition_of_done
    name: Definition of Done
    curse: Every map you can do it on also demands a ball locked on each side of the board.
    blessing: Earn 60% more overtime hours.
    uniqueWinsRequired: 6
    modifiers:
      winRequiresSplitLocks: 1
      scoreMultiplier: 1.6
