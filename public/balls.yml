# Ball types (issue #37)
#
# The game picks which of these spawn on each map — colour communicates ability.
# A type becomes eligible once the level number reaches its `unlockLevel`.
# Speeds are flat world-units/second (no per-level scaling, no per-cut ramp); the
# `ballSpeedMultiplier` upgrade still scales them at spawn.
#
# Fields:
#   id             unique key (also used for the ball's element id)
#   name           display name (tutorial)
#   color          hex colour WITH a leading '#' (quote it so YAML keeps the '#')
#   baseSpeed      flat base speed in world units/second
#   minimumSpeed   speed floor; slow-down/slow-others/range effects never go below this
#   unlockLevel    minimum level number at which this type may appear
#   lockMultiplier lock-bonus multiplier when this ball is locked away
#   density        relative weight for the breakable force model (default 1). Impact
#                  damage = density x (radius/18)^2 x speed^1.6, so a heavy grey/black
#                  cracks breakables in fewer hits than a light yellow at the same speed
#   ability        one of: none | variableSpeed | slowOthers | moneyBall | slowDown | breakObjects
#   speedReduction (slowOthers only) speed each struck ball loses per hit (down to its minimumSpeed)
#   description    one-line ability summary shown in the tutorial
#   speedRange     (variableSpeed only) [lo, hi] — a new random speed is picked on each
#                  surface contact; the range itself shrinks when the ball is slowed
#   phase2         true = not yet wired up; excluded from selection and the tutorial
#   spawnIntervalSeconds (rainbow only) seconds between spit-outs (default 10)
#   spawnChance    per-map appearance probability 0-1, rolled from the map id
#                  (absent = always eligible). Makes rare types an occasional event.

balls:
  - id: red
    name: Red
    color: "#ff5b5b"
    baseSpeed: 250
    minimumSpeed: 150
    unlockLevel: 1
    lockMultiplier: 1
    density: 1
    ability: none
    description: A standard ball. No special behaviour - just bounces.

  - id: blue
    name: Blue
    color: "#00b4ff"
    baseSpeed: 250
    minimumSpeed: 150
    unlockLevel: 2
    lockMultiplier: 1
    density: 1
    ability: none
    description: A standard ball, a touch faster than the red one.

  - id: yellow
    name: Yellow
    color: "#ffd93d"
    minimumSpeed: 150
    baseSpeed: 280
    unlockLevel: 4
    lockMultiplier: 2
    density: 0.6
    ability: variableSpeed
    description: "Variable speed: every surface it touches shifts it between 200 and 400."
    speedRange: [200, 400]

  - id: purple
    name: Purple
    color: "#b06bff"
    baseSpeed: 340
    minimumSpeed: 150
    unlockLevel: 7
    lockMultiplier: 2
    density: 0.9
    ability: slowOthers
    speedReduction: 20
    description: "Saps momentum: every ball it clashes with loses speed, down to the balls' minimum speed."

  - id: green
    name: Green
    color: "#00c853"
    baseSpeed: 300
    minimumSpeed: 180
    unlockLevel: 13
    lockMultiplier: 2
    density: 1.1
    ability: moneyBall
    description: "Money ball: locking it away triples the gains of every later lock this round."

  - id: grey
    name: Grey
    color: "#9aa3ad"
    baseSpeed: 200
    minimumSpeed: 150
    unlockLevel: 10
    lockMultiplier: 1
    density: 1.6
    ability: slowDown
    description: "Winds down: slows down 10 speedUnits ever 5 seconds. Down to minimum speed."

  # Black: a heavy wrecking ball (issue #64). Besides smashing mirrors and movers,
  # it now fractures the player's own fences: three hits crack a fence apart. It
  # is foreshadowed a few levels before the level-30 boss built around it.
  # The compass. Every other ball ability is about speed, scoring, breaking,
  # spawning or tapping; this is the only one that touches HEADING, which is
  # what the player is actually reading when they decide where to cut.
  #
  # Telegraphed on purpose: the ring around it unwinds toward the turn and
  # shows which way it will go, so it is a thing to plan around rather than a
  # thing that robs you. Slots into the gap between green (13) and black (25).
  - id: compass
    name: Compass
    color: "#c08cff"
    baseSpeed: 235
    minimumSpeed: 150
    unlockLevel: 18
    lockMultiplier: 3
    density: 1
    ability: turnTimer
    turnIntervalSeconds: 9
    description: "Turns a quarter circle every few seconds. The ring around it counts down, and leans the way it will turn."

  # FREIGHT. Every other ball wants the tightest chamber it can get, because the
  # lock gate is "small enough" and a tighter seal grades superior on top. This
  # one inverts that: it needs ROOM, so you cannot corner it, you have to leave
  # it space, and space is the thing the whole game is spending. It can never
  # grade superior as a result, so its lock multiplier carries the pay.
  - id: freight
    name: Freight
    color: "#8fa6b8"
    baseSpeed: 190
    minimumSpeed: 140
    unlockLevel: 16
    lockMultiplier: 4
    density: 2.4
    ability: heavyLock
    minLockFraction: 0.55
    description: "Too big for a tight corner. It only locks in a roomy pocket, so you have to leave space for it while the board shrinks."

  # LODESTONE. Not the Magnet ability: that is a one-shot you aim at a point you
  # chose, this is always on and aimed at a ball that is moving. It changes
  # where everything TENDS to be, and the cluster it gathers is the opportunity
  # and the danger at once. It is also the first way to set up the
  # simultaneous-lock multiplier on purpose rather than by luck.
  - id: lodestone
    name: Lodestone
    color: "#ff9e4d"
    baseSpeed: 210
    minimumSpeed: 150
    unlockLevel: 21
    lockMultiplier: 3
    density: 1
    ability: attract
    attractTurnRate: 1.6
    attractRadius: 320
    description: "Draws the other balls toward it. Gather them for a multi-lock, or watch them pile into the pocket you were keeping clear."

  - id: black
    name: Black
    color: "#2b2f3a"
    baseSpeed: 200
    minimumSpeed: 150
    unlockLevel: 25
    lockMultiplier: 4
    density: 2.6
    ability: breakObjects
    description: "Wrecking ball: heavy enough to smash obstacles, and it cracks your own fences apart in three hits."

  # Rainbow: a fast, hue-shifting ball that shows up occasionally past level 10.
  # Every 10 seconds it spits out one random ball type available for the current
  # level (never another rainbow). Trap it fast: the spawns pile up, and every
  # map now has a hard time limit. `color` is the base tint; the renderers cycle
  # its hue at runtime.
  - id: rainbow
    name: Rainbow
    color: "#ff4db8"
    baseSpeed: 360
    minimumSpeed: 260
    unlockLevel: 11
    lockMultiplier: 3
    density: 0.8
    ability: rainbow
    spawnIntervalSeconds: 10
    spawnChance: 0.4
    description: "Prism ball: fast and unstable, it spits out a new ball every 10 seconds. Lock it away before the board fills up."

  # White: a rare, bright "decision" ball (issue #57). TAP it to discard it for
  # nothing (one fewer ball to deal with), or LOCK it for the biggest single-lock
  # bonus in the game. Appears occasionally past level 12, and ball-generating
  # bosses spit one out about a quarter of the time. Never a map's only ball.
  - id: white
    name: White
    color: "#ffffff"
    baseSpeed: 320
    minimumSpeed: 180
    unlockLevel: 12
    lockMultiplier: 5
    density: 0.8
    ability: tappable
    spawnChance: 0.12
    description: "Bright and yours to judge: tap it to throw it away for nothing, or lock it for the biggest single bonus in the game."
