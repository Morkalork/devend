# Per-map objectives (issue #55): an optional secondary goal rolled 0-or-1 per
# eligible map (level 11+) from the run seed. Different every normal run, shared
# per Daily seed. Optional and non-failing: missing it just skips the bonus.
# English is the source of truth (locale files may override via
# content.mapObjectives.<id>.*). No em-dashes in displayed strings.
#
# noneWeight: relative odds of "no objective this map" (objectives are a spice,
# not every map). With the weights below, roughly half of eligible maps get one.
#
# SCALE. `reward` is overtime hours, paid on clear and folded under the per-map
# backstop with the map mutator's hazard premium (scoring.ts `flatBonus`). This
# file was MISSED by the hours-by-4 deflation (src/lib/economyDeflation.ts):
# the rewards stayed at 3-6h while a good map's pay fell from ~136h to ~34h, so
# a spice bonus quietly grew from 2-4% of a map to 9-18% of one, and a map
# carrying an objective AND a mutator paid 29% of itself in flat bonuses.
#
# Rescaled here to 1h, or 2h for the two that ask for real work (vault's four
# locks, surgical's two superior locks). Not a clean divide: 3/4 of an hour
# cannot be authored, so the six values land on 1 and 2 rather than 0.75 and
# 1.5, which keeps "the big ask pays double" and costs at most half an hour of
# fidelity. Author a NEW objective against a good map's ~34h, never against
# these numbers' history.
noneWeight: 6

objectives:
  - id: lockdown
    name: Lockdown
    description: Lock at least 2 balls this map.
    clarify: Seal 2 balls in pockets before you clear. Pays a bonus on top of the normal lock overtime.
    kind: lockCount
    weight: 3
    params:
      count: 2
    reward: 1

  - id: vault
    name: The Vault
    description: Lock at least 4 balls this map.
    clarify: "A greedy target: trap 4 balls before clearing. Big bonus, but it takes real pocket work."
    kind: lockCount
    minLevel: 15
    weight: 2
    params:
      count: 4
    reward: 2

  - id: precision
    name: Precision
    description: Land a superior lock (a tight pocket).
    clarify: Lock a ball in a snug pocket that grades superior. Reinforces the lock skill.
    kind: superiorLocks
    weight: 3
    params:
      count: 1
    reward: 1

  - id: surgical
    name: Surgical
    description: Land 2 superior locks this map.
    clarify: Two tight-pocket locks in one map. Precision under pressure.
    kind: superiorLocks
    minLevel: 16
    weight: 2
    params:
      count: 2
    reward: 2

  - id: under-budget
    name: Under Budget
    description: Clear at or under the par cut count.
    clarify: Finish the map using no more cuts than par. Efficient play pays.
    kind: underPar
    weight: 2
    params:
      delta: 0
    reward: 1

  - id: speed-run
    name: Speed Run
    description: Clear the map within 35 seconds of play.
    clarify: "Beat the clock: meet the clear condition inside 35 active seconds. Pauses do not count."
    kind: speedClear
    weight: 2
    params:
      seconds: 35
    reward: 1
