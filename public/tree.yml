# The ball tree (BALL_TREE_PLAN.md): the catalogue a run under the tree rule
# set buys from between maps (src/lib/tree.ts). The balls are the player's; a
# map brings none.
#
#   tree:       the roster's prices: a rung's base by rank, the stack factor a
#               ball's next rung is multiplied by per rung it already holds,
#               and the price of the second and third ball. The rungs' words
#               are in src/lib/roster.ts and their rules in
#               src/lib/physics/rungs.ts, since they are code, not cards.
#   upgrades:   the GENERAL nodes, in the upgrades.yml / cards.yml shape so
#               the modifier pipeline, the fence slots and the abilities read
#               them unchanged. `branch` files a node under Fences, Hands or
#               Office; `prerequisites` are the tree's edges; an `upgradeOf`
#               rides its node as a "+" did. Each branch has ONE Junior root
#               (Fast Compile, Feature Freeze, Performance Bonus) that every
#               other node of the branch descends from, families chain
#               Senior to Principal to Architect, and a node may need two
#               parents, so an early, modest buy is what opens the branch and
#               the branches meet further out. No node slows, shrinks or
#               steadies all balls: those were the cards the player could not
#               feel, and under the tree the balls are theirs.
#
# Prices: a node's tier through the pricing block, with no inflation; depth
# is priced by the stack factor on a ball, and by the ladder on a branch.
# No em-dashes in name or description (CLAUDE.md).
pricing:
  minCost: 2
  anchorHours: 23
  blockInflation: 1.0
  # A map's pay, measured through calculateScore: ordinary about 16h, good
  # about 34h, flawless about 47h (upgradePricing.ts). The tiers sit on those
  # rungs so effort reads at the tree: an ordinary map buys a Junior root
  # (15h), a great map buys a Senior (30h), a flawless one or two maps buy a
  # Principal (44h), and an Architect (58h) is a saved-up moment.
  tierFactor:
    Junior: 0.65
    Senior: 1.3
    Principal: 1.9
    Architect: 2.5
    Wizard: 3.2
tree:
  # Hours for a rung at rank one, two and three, before stacking: an ordinary
  # map's rank one, a great map's rank two, a flawless map's rank three.
  rungBase: [15, 30, 45]
  # The next rung on a ball costs this much more per rung the ball already holds.
  stackFactor: 1.25
  # The second ball, then the third: a great map each. Flat, with no traits.
  ballCost: [30, 45]
tagSets:
  threshold: 99
  bonuses: []
upgrades:
- id: fast_compile
  branch: fences
  name: Fast Compile
  tier: Junior
  icon: fast-forward
  tags: [tempo]
  description: Fences build 35% faster.
  modifiers: {fenceGenerationSpeedMultiplier: 1.35}
- id: fast_compile_plus
  branch: fences
  name: Fast Compile+
  tier: Senior
  tags: [tempo]
  upgradeOf: fast_compile
  prerequisites: [fast_compile]
  description: Fences build 60% faster.
  modifiers: {fenceGenerationSpeedMultiplier: 1.185}
- id: hot_start
  branch: fences
  name: Hot Start
  tier: Senior
  icon: flame
  tags: [tempo]
  prerequisites: [fast_compile]
  description: The first two fences of every map finish instantly.
  modifiers: {instantFencesPerMap: 2}
- id: scaffolding
  branch: fences
  name: Scaffolding
  tier: Senior
  icon: land-plot
  tags: [tempo, safety]
  prerequisites: [fast_compile]
  description: Every fence starts 30% drawn.
  modifiers: {fenceHeadStart: 0.3}
- id: multithreading
  branch: fences
  name: Multithreading
  tier: Senior
  icon: split
  tags: [tempo]
  prerequisites: [fast_compile]
  description: Draw one more fence at the same time.
  modifiers: {additionalConcurrentFences: 1}
- id: multithreading_plus
  branch: fences
  name: Multithreading+
  tier: Principal
  tags: [tempo]
  upgradeOf: multithreading
  prerequisites: [multithreading, fast_compile_plus]
  description: Draw two more fences at the same time.
  modifiers: {additionalConcurrentFences: 1}
- id: add_guardrails
  branch: fences
  name: Guardrail Fence
  tier: Senior
  icon: fence
  tags: [safety]
  prerequisites: [fast_compile]
  description: 'Adds the Guardrail fence: once a map, a ball through it costs the fence, not a life. It builds 15% slower.'
  grantsFenceType: guardrail
  modifiers: {}
- id: crash_barrier
  branch: fences
  name: Crash Barrier
  tier: Principal
  icon: shield-check
  tags: [safety]
  prerequisites: [add_guardrails]
  description: The Guardrail fence carries two more shields every map. Needs the Guardrail fence.
  modifiers: {guardrailExtraShields: 2}
- id: hotfix_tripwire
