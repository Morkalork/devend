# Overtime Scoring Configuration
# Values are in overtime hours.

scoring:
  # A ceiling on the BASE, not on the payout.
  # backstop = round(basePoints x overtimeCapHeadroom) + every axis ceiling. It
  # bounds a runaway score multiplier on the flat base and nothing else; the
  # five axes below already bound themselves, and they are absolute hours while
  # the base is per-map, so folding them into a multiple of basePoints would
  # clip axis income on any low-`points:` map.
  #
  # It used to be THE ceiling, and that was the single worst thing in the
  # economy. At 4.0 it meant 80h on all 35 maps (they all have points: 20),
  # while lock income is a multiplicative stack that routinely earned 116h,
  # 212h, even 596h into that pot - and everything over the brim was thrown
  # away. Worse, Ship Early was the only bonus paid ABOVE it, so once a run
  # capped, tempo was the only lever still connected to the score and rushing
  # sloppily out-earned a flawless precise run 96h to 80h.
  overtimeCapHeadroom: 4.0

  # ── The Performance Review: five axes, banked independently ───────────────
  #
  # Income is DELIVERY (did you lock the balls at all) plus four tactical axes,
  # each with its own ceiling. Maxing one never spends another's headroom, so
  # there is no single pot for one route to crowd out.
  #
  #   delivery    the baseline, not a tactic         blind to lock quality
  #   demolition  the other baseline                  take the map's stuff apart
  #   craft       superior / zone / simultaneous      costs time and fences
  #   tempo       ship early                          costs craft
  #   thrift      finishing under par                 costs craft and greed
  #   greed       clearing past the requirement       costs fences and time
  #
  # The four tactical axes form a ring where neighbours physically fight each
  # other, so about two are reachable in a run, and any two land near the same
  # total. Simulated over the whole ladder: perfectionist 96h, speedrunner 97h,
  # balanced 95h, zone play 93h, greed 90h, and the intended failure (slow AND
  # sloppy) 41h. The two poles come out even on every rung from level 3 to 29.
  #
  # Every axis pays ceiling x ratio, where the ratio is measured against what
  # THIS map could give: lock capacity for delivery and craft, par for thrift,
  # leftover slack for greed. That is what lets one set of ceilings cover a
  # 1-ball map worth 12h of locks and a 4-ball act-III map worth 240h.
  axes:
    delivery: 30
    craft: 30
    tempo: 24
    thrift: 20
    greed: 25
    # DEMOLITION: the share of the map's breakables you actually took apart,
    # weighted by their authored hits.
    #
    # 35 is sized against a REALISTIC run, not against the sum of ceilings -
    # that sum is deliberately unreachable (the four tactical axes fight each
    # other, so about two land). A good run banks delivery, demolition and
    # roughly two tacticals: 30 + 35 + ~50 = 115, and 35 of that is 30%. Sizing
    # it against the 164 total instead would have put it at 55h and made every
    # other lane a rounding error.
    #
    # It exists because the map's own content had no lane. Smashing paid a flat
    # 5h per breakable INTO GREED, whose 25h pot it shared with clearing - so on
    # any map where you also cleared, the pot was full and demolition paid
    # nothing. It rendered no row either. The first nine maps could be finished
    # on two quick locks with every object on the board untouched, which is the
    # report this axis answers.
    #
    # Zero on a map with nothing breakable: the axis is not offered and the
    # overlay draws five bars instead of six.
    demolition: 35
    # Under par by 40% of par banks all of Thrift: three cuts on a par-7 map,
    # two on a par-4. Relative because par runs 3..10 across the ladder, so an
    # absolute rung is a strong result on one map and impossible on another.
    thriftFullAtParFraction: 0.40
    # Consuming 60% of the leftover slack banks all of Greed. The old space
    # bonus measured the overshoot against the REQUIREMENT, which made its top
    # rungs unreachable exactly where requirements got interesting: level 29
    # asks for 93%, so the entire slack is 7% and the ladder wanted 30% and 55%.
    greedFullAtSlackFraction: 0.60

  # Lock Value
  # Overtime hours paid per lock-multiplier point when a ball is locked away.
  # Red/blue/grey (x1) pay 12h, yellow/purple/green (x2) 24h, black (x4) 48h,
  # before the quality, simultaneous-trap and money-ball multipliers. Locking
  # IS the income: the flat map base (points: 20) alone cannot fund even a
  # Junior upgrade (40h), so clearing without locking means an empty-handed
  # shop visit unless you had hours saved.
  lockValue: 12

  # Lock Quality (Superior Locks)
  # A lock is SUPERIOR when the sealed pocket is tight: at most
  # superiorThresholdFraction of the BASE lock threshold (game-config.yml
  # lock.win_threshold_percent, so upgrades that widen the lock threshold do
  # not also widen this). Superior locks pay lockValue x superiorMultiplier
  # per lock-multiplier point; a sliver-floor lock (min_region_cells) always
  # grades superior. The sloppy-vs-tight gap is the skill economy: a sloppy red
  # lock pays 20 + 12 = 32h, a superior one 20 + 24 = 44h. The three level-1
  # "first hire" Juniors are discounted to 30h (upgrades.yml) so a sloppy lock
  # already opens the store on map 1; the gap still gates the formula-priced
  # 40h+ hires on later maps.
  lockQuality:
    superiorThresholdFraction: 0.4
    superiorMultiplier: 2.0

  # The Lamp (one ball lights the board; see src/lib/lampBall.ts)
  # Sealing the ball currently holding the light pays its lock points times
  # this, stacking with superiorMultiplier: a superior lock on the lit ball is
  # 2.0 x 1.5 = 3x, which is the combo worth playing for.
  #
  # It cannot break the economy no matter what it is set to, and that is
  # structural rather than a matter of picking a safe number. The multiplier
  # sits outside `rawCapacity`, so it never touches DELIVERY (the "did you ship
  # the roster" axis); all of it lands in CRAFT, which is capped at
  # totalCapacity x (superiorMultiplier - 1). A bigger number here reaches that
  # ceiling with fewer perfect locks; it cannot go past it.
  lampLockMultiplier: 1.5

  # Beat-the-highscore bonus (#45)
  # When you finish a map with a higher score than its previous highscore, the
  # map's score is multiplied by this. Applied after the per-map cap, so beating
  # a record always pays. Only fires if the map has been played before.
  highscoreBonusMultiplier: 1.25

  # Ship Early Bonus
  # Ladder of ACTIVE-play seconds to first meet the win condition (the push
  # prompt opening, or the last ball locking). Windows are PER BALL: a map's
  # actual window = withinSecondsPerBall x its ball count, so busy maps get
  # proportionally more time (e.g. 15s/ball => a 4-ball map has 60s for the
  # +10% rung, a 2-ball map 30s). Pauses, menus and the push prompt itself do
  # not count, so push-your-luck time is never taxed.
  #
  # The reward is a PERCENT of the map's earned overtime, paid ABOVE the per-map
  # cap (so on a 100h map a blazing clear adds ~30h, not a flat 3h the cap eats).
  # Awards the best rung whose window was met, clamped at maxPercent. The tempo
  # counterpart to spaceOptimization: speed and precision are parallel payoffs.
  shipEarly:
    maxPercent: 30
    thresholds:
      - withinSecondsPerBall: 6   # blazing clear
        percent: 30
      - withinSecondsPerBall: 10
        percent: 20
      - withinSecondsPerBall: 15
        percent: 10

  # Performance Multiplier
  # Scales base points based on fences vs par. Now that par is set to a map's
  # real solve count, going over means you were genuinely inefficient, so the
  # penalty bites harder than before (was 0.75 / 0.6 / 0.4).
  performanceMultiplier:
    underPar: 1.0     # At or under par: full base
    atPar: 1.0        # At par: full base
    overPar1: 0.6     # 1 over par
    overPar2: 0.4     # 2 over par
    overPar3Plus: 0.2  # 3+ over par: also disables space bonus
