# The draft catalogue (CARDS_PLAN.md): the cards a run plays with under the
# draft rules (src/lib/cardRules.ts). The classic store reads upgrades.yml
# instead; the two share one schema and one modifier pipeline.
#
# What is different here, on purpose:
#   - One card is one idea. No Junior/Senior/Principal ladder: a card has at
#     most one upgrade, its "+" (`upgradeOf: <card id>`), which rides on the
#     card, requires it, and takes no slot of its own. A "+" lists only what it
#     ADDS (multipliers multiply, flat values sum), and its description says
#     what the card does once it is upgraded.
#   - A build holds CARD_SLOTS cards, so every effect is big enough to feel:
#     the upgrade sweep's rule is that a card must beat twice the noise
#     (UPGRADE_SWEEP_REPORT.md), and a 5% nudge does not.
#   - `tier` is the card's RARITY here: Junior common, Senior uncommon,
#     Principal rare. It prices the card, and EVERY card is bought: the store
#     deals nothing free (a won contract's store deals one). The anchor below
#     is an ORDINARY map's pay rather than the classic store's good map
#     (upgradePricing.ts measured flawless 47h, good 34h, ordinary 16h,
#     scrappy 6h): 23 x 0.7 puts a common at 16h, so a normal run affords one
#     card a map, a good map affords two and a flawless one three. More cards
#     are earned on the board, which is the rule the free card had undone.
#   - `downside:` is the line a strong card charges you, shown in red.
#   - `paysOff:` names the cards this one is the payoff for (the engines in
#     CARDS_PLAN.md). The shelf leans toward a payoff whose enabler the build
#     holds, and the card says it pays off something you hold.
#   - `certCredit:` names the certificate chase a card counts toward, by the
#     classic id the certificate names.
#
# No em-dashes in name, description or downside (CLAUDE.md).
pricing:
  minCost: 2
  anchorHours: 23
  # Softer than the classic store's 1.15. With nothing dealt free, a card is
  # paid for out of map pay alone, and the scoring axes are absolute: an
  # ordinary map pays about the same at 30 as at 3. 1.15 tripled a common card
  # by map 40 against that flat pay (measured: the bot's median map paid for a
  # common on 10 of 10 wins at map 4 and 0 of 14 at map 29). 1.06 takes a
  # common from 16h to about 26h by map 40, under a good map's 34h the whole
  # way, so one card an ordinary map stays the normal rate to the end.
  blockInflation: 1.06
  tierFactor:
    Junior: 0.7
    Senior: 0.95
    Principal: 1.3
    Architect: 1.7
    Wizard: 2.1
tagSets:
  threshold: 3
  bonuses:
  - tag: lock
    name: Chain Reaction
    description: Every lock counts as one ball bigger for the simultaneous-trap multiplier.
    modifiers:
      simultaneousLockBonus: 1
  - tag: freeze
    name: Absolute Zero
    description: Frozen balls can be re-frozen immediately, no cooldown.
    modifiers:
      freezeNoCooldown: 1
  - tag: bank
    name: Framework Agreement
    description: All shop prices drop by 10%.
    modifiers:
      shopDiscountMultiplier: 0.9
  - tag: tempo
    name: Ship It
    description: Draw one additional fence at the same time.
    modifiers:
      additionalConcurrentFences: 1
  - tag: risk
    name: Double Or Nothing
    description: Push-your-luck payouts are doubled.
    modifiers:
      pushBonusMultiplier: 2
  - tag: safety
    name: Insurance Policy
    description: Gain 1 extra Continue.
    modifiers:
      extraContinues: 1
