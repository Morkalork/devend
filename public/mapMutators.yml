# Per-map mutators (issue #54): a rotating environmental modifier rolled once
# per eligible map (level 11+) from the run seed. Different every normal run,
# identical for everyone on a Daily seed. English is the source of truth here
# (locale files may override via content.mapMutators.<id>.*). No em-dashes in
# displayed strings (name / description / clarify), per project rule.
#
# noneWeight: relative odds of "no mutator this map", so some maps stay vanilla.
#
# SCALE. `overtimePremium` is hazard pay in overtime hours, awarded on clear and
# folded under the per-map backstop alongside an objective's reward (scoring.ts
# `flatBonus`). This file was MISSED by the hours-by-4 deflation (see
# src/lib/economyDeflation.ts): the premiums stayed at 2-4h while a good map's
# pay fell from ~136h to ~34h, so hazard pay grew from 1.5-3% of a map to
# 6-12% of one.
#
# All five are 1h now, and the old 2/3/4 gradient did not survive the rescale:
# at this scale it would have to be 0.5/0.75/1, and the nearest integers with a
# floor of 1 are all 1. Paying the harsher mutators 2h would have kept the
# shape at twice the intended magnitude on the commonest case, which is the
# worse trade - the difference being traded away is under an hour on a 34h map,
# and a player cannot feel it. If hazard pay should ever be graded again, grade
# it against what a map pays today rather than restoring these numbers.
#
# ── gravity: two models, per mutator ──────────────────────────────────────────
#
#   turnRate            STEERING (the default). The pull bends a heading and
#                       never touches the magnitude, so a ball falls at exactly
#                       the speed it climbed at. Every speed rule in updateBall
#                       keeps working untouched and a ball can never come to
#                       rest, which is why the model exists.
#   accelerate: true    FALLING. `strength` (world units per second squared) is
#   strength            added along the pull each frame and the speed goes where
#   topSpeedScale       it goes, clamped at `topSpeedScale` x the ball's own base
#                       speed. Reads as real gravity; costs the constant-speed
#                       invariant, which is a per-map decision and not a global
#                       one. Only steady_gravity (level 14) uses it.
#
# An accelerating map's `strength` is not just a feel knob. Heavier gravity packs
# every ball into a thin band along the floor, everything above them captures
# freely, and anything the win needs up there gets buried. Sweep the bot before
# changing it; see the note on steady_gravity below.
noneWeight: 2

mutators:
  - id: crunch
    name: Crunch Time
    description: Everything speeds up with every ball you lock.
    clarify: Each lock speeds up balls and obstacles a little more, up to a cap. Locking pays, but raises the tempo.
    behavior: crunch
    weight: 3
    params:
      perLockPercent: 7
      maxPercent: 56
    overtimePremium: 1

  - id: overclock
    name: Overclock
    description: The whole board runs hot. Balls and movers are faster all map.
    clarify: A flat speed boost for the whole map, from the first second.
    behavior: overclock
    weight: 2
    params:
      factor: 1.18
    overtimePremium: 1

  # Steady down, with no rotating sequence and no quiet stretches, for the map
  # whose FLOOR answers the pull. gravity_well turns the pull through all four
  # directions, which is the right feel for a map about being pushed around and
  # the wrong one for a map with a live floor: three quarters of the cycle the
  # trampoline would be a side wall. Same turnRate, so the arc reads the same.
  - id: steady_gravity
    name: Downtime
    description: Everything falls, and it keeps falling.
    clarify: "A constant pull down, and balls really fall: faster on the way down, slower up. They gather on the floor and keep bouncing. Fence where they are going."
    behavior: gravity
    weight: 0
    minLevel: 14
    gravity:
      # Real falling, not a steered heading. Reported from play as "clearly
      # doesn't have normal gravity, feels super weird", which is what a
      # constant-speed pull looks like to anyone who has seen a ball fall:
      # the arc is right and the pace never changes, so it reads as a ball on a
      # string rather than a ball dropping.
      #
      # `strength` is world units per second squared against an 810-unit board,
      # so a fall down the full height lands well short of terminal, and `topSpeedScale` is the ceiling fenceTouch and the bouncers
      # already use rather than a new number.
      accelerate: true
      strength: 280
      topSpeedScale: 2.2
      period: 9
      sequence: [down]
    overtimePremium: 1

  # The room turned, on a clock, with no quiet stretches.
  #
  # gravity_well is "a pull that moves", with `none` phases between so the map
  # reads as being pushed around occasionally. This one is the OTHER half of
  # that idea: the pull never stops and never eases, it just gets a quarter turn
  # every ten seconds. What the player is reading is not the pull, it is the
  # eight settled seconds between turns, which is exactly as long as it takes to
  # pick a cut and commit to it.
  #
  # Ten rather than nine, so a turn lands on a beat the player can count.
  - id: tipping
    name: Standup
    description: The room turns a quarter every ten seconds, and down goes with it.
    clarify: The pull turns a quarter every ten seconds. Finished fences are safe; your plan is not. Read where the balls go next.
    behavior: gravity
    weight: 0
    minLevel: 15
    gravity:
      # Real falling, same as steady_gravity: the map this pairs with teaches
      # that things accelerate, and a turning room whose balls did NOT would
      # undo the lesson one map later.
      accelerate: true
      strength: 280
      topSpeedScale: 2.2
      period: 10
      sequence: [down, right, up, left]
    overtimePremium: 1

  - id: gravity_well
    name: Technical Gravity
    description: Everything is pulled one way, and the way keeps changing.
    clarify: The pull rotates around the map with quiet stretches between. Balls arc toward it and pile up on that edge without slowing. Fence where they are going.
    behavior: gravity
    weight: 2
    minLevel: 14
    gravity:
      turnRate: 1.1
      period: 9
      sequence: [down, none, left, none, up, none, right, none]
    overtimePremium: 1
