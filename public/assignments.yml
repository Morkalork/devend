# Assignments (issue #60) — the every-5th-level "Next Assignment" draft.
#
# Every 5th completed level (offeredAfterLevel) replaces the shop with a draft:
# pick ONE of three assignments, or SKIP. Skipping is neutral. Accepting takes
# on the assignment's CONSTRAINT (a modifier curse and/or a behavioral rule like
# disabling Push Your Luck) for the whole 5-map block, and sets a MISSION: a task
# tracked across those maps. Clearing a mission tier pays a REWARD at block end.
#
# mission.track.mode:
#   cumulative  a running metric summed over the block (total locks / total
#               superior locks), or the count of maps that met a pass/fail
#               condition (underPar, speedClear, allBallsLocked).
#   everyMap    the count of maps whose per-map condition was met; tier
#               thresholds are maps-passed (out of 5).
# mission.track.kind: lockCount | superiorLocks | underPar | speedClear | allBallsLocked
# tiers: ascending thresholds; the highest reached pays. reward.type:
#   lives     { count }           overtime  { hours }
#   modifiers { blessing, modifiers, scope: run|block }   (good/bad bundle; can
#             deepen a key to "enhance" a top-tier upgrade's effect)
#   tierDraft { tier }            a free 1-of-3 upgrade pick (Junior..Architect)
#
# Balance (reassessed): rewards sit on ONE value scale so every assignment is
# worth the effort. Anchor: 1 life ~= 50 overtime (a Fault Tolerance life costs
# ~50h in the shop). The roster leans on LIVES and free UPGRADE PICKS, which read
# as clearly valuable; small flat-overtime payouts (~30h) were dropped because
# they never compared to a couple of lives. Per tier slot:
#   first tier  ~= +2 lives (a solid, comparable floor for taking the mission).
#   top tier    ~= a tierDraft or +3 lives, scaling UP with the constraint +
#                  mission difficulty (Senior -> Principal -> Architect pick).
# tierDraft is the mastery payoff and only sits on constrained assignments. Keep
# constraints survivable across five maps. No em-dashes in displayed strings.
offeredAfterLevel: 5

assignments:

  - id: lock_quota
    name: Lock Quota
    constraint:
      text: Balls move 10% faster.
      modifiers:
        ballSpeedMultiplier: 1.1
    mission:
      text: Lock balls across the next 5 maps.
      track: { mode: cumulative, kind: lockCount }
      tiers:
        - { threshold: 12, label: "+25 overtime", reward: { type: overtime, hours: 25 } }
        - { threshold: 20, label: "+40 overtime", reward: { type: overtime, hours: 40 } }
    clarify: A gentle, always-on speed tax for a payout that scales with how many balls you seal over the block. Locking two or three a map clears the first tier comfortably; a heavier block banks a bigger overtime bonus.

  - id: daily_standup
    name: Daily Standup
    constraint:
      text: Balls are 10% bigger.
      modifiers:
        ballSizeMultiplier: 1.1
    mission:
      text: Lock at least 2 balls in each of the next 5 maps.
      track: { mode: everyMap, kind: lockCount, params: { count: 2 } }
      tiers:
        - { threshold: 3, label: "+25 overtime", reward: { type: overtime, hours: 25 } }
        - { threshold: 5, label: "Pick a Senior upgrade", reward: { type: tierDraft, tier: Senior } }
    clarify: Consistency over volume. A map counts once you lock two balls in it; hit that in three of five maps for an overtime bonus, all five for a free Senior upgrade.

  - id: precision_review
    name: Precision Review
    constraint:
      text: Fences grow 10% slower.
      modifiers:
        fenceGenerationSpeedMultiplier: 0.9
    mission:
      text: Land superior locks across the next 5 maps.
      track: { mode: cumulative, kind: superiorLocks }
      tiers:
        - { threshold: 4, label: "+25 overtime", reward: { type: overtime, hours: 25 } }
        - { threshold: 8, label: "Pick a Senior upgrade", reward: { type: tierDraft, tier: Senior } }
    clarify: Rewards tight-pocket locks. Slower fences make snug pockets harder to seal, which is the point. Land eight superior locks over the block for a free Senior upgrade.

  - id: under_budget
    name: Under Budget
    constraint:
      text: Earn 10% less overtime.
      modifiers:
        scoreMultiplier: 0.9
    mission:
      text: Clear at or under par cuts in each of the next 5 maps.
      track: { mode: everyMap, kind: underPar, params: { delta: 0 } }
      tiers:
        - { threshold: 3, label: "+25 overtime", reward: { type: overtime, hours: 25 } }
        - { threshold: 5, label: "+45 overtime", reward: { type: overtime, hours: 45 } }
    clarify: Efficient cutting only. A map counts when you finish at or under its par. The overtime cut stings now; clean play across the block pays it back and then some.

  - id: sprint_review
    name: Sprint Review
    constraint:
      text: Scope Creep starts immediately, no grace period.
      modifiers:
        scopeCreepImmediate: 1
    mission:
      text: Clear each of the next 5 maps within 40 seconds.
      track: { mode: everyMap, kind: speedClear, params: { seconds: 40 } }
      tiers:
        - { threshold: 3, label: "+30 overtime", reward: { type: overtime, hours: 30 } }
        - { threshold: 5, label: "Pick a Principal upgrade", reward: { type: tierDraft, tier: Principal } }
    clarify: Built for fast, instinctive cutters. Balls surge from the first second, so there is no calm window. Clear inside 40 active seconds; sweep all five maps for a free Principal upgrade.

  - id: cost_cutting
    name: Cost Cutting
    constraint:
      text: Fences grow 12% slower.
      modifiers:
        fenceGenerationSpeedMultiplier: 0.88
    mission:
      text: Land superior locks across the next 5 maps.
      track: { mode: cumulative, kind: superiorLocks }
      tiers:
        - { threshold: 5, label: "+30 overtime", reward: { type: overtime, hours: 30 } }
        - { threshold: 10, label: "Pick a Principal upgrade", reward: { type: tierDraft, tier: Principal } }
    clarify: A deeper superior-lock grind under a heavier fence tax. Five superior locks bank an overtime bonus; ten over the block earns a free Principal upgrade.

  - id: lockdown_protocol
    name: Lockdown Protocol
    constraint:
      text: No Push Your Luck. Balls move 10% faster.
      modifiers:
        ballSpeedMultiplier: 1.1
      disablePushYourLuck: true
    mission:
      text: Lock every ball in each of the next 5 maps.
      track: { mode: everyMap, kind: allBallsLocked }
      tiers:
        - { threshold: 3, label: "+3 lives", reward: { type: lives, count: 3 } }
        - { threshold: 5, label: "Pick an Architect upgrade", reward: { type: tierDraft, tier: Architect } }
    clarify: The marquee mission. Push Your Luck is off, so each map banks the moment it is won, and you must trap every ball to bank that map. Three of five pays three lives; sweep all five for a free Architect upgrade.

  - id: crunch_delivery
    name: Crunch Delivery
    constraint:
      text: No Push Your Luck.
      disablePushYourLuck: true
    mission:
      text: Lock balls across the next 5 maps.
      track: { mode: cumulative, kind: lockCount }
      tiers:
        - { threshold: 20, label: "+30 overtime", reward: { type: overtime, hours: 30 } }
        - { threshold: 30, label: "Pick a Senior upgrade", reward: { type: tierDraft, tier: Senior } }
        - { threshold: 40, label: "Pick a Principal upgrade", reward: { type: tierDraft, tier: Principal } }
    clarify: A pure volume grind with no push safety net. Three tiers, so you rarely walk away empty. An overtime bonus, then a free Senior upgrade, then a Principal for a heavy 40-lock block.
