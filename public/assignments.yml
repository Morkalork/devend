# Assignments (issue #60) — the every-5th-level "Next Assignment" draft.
#
# Every 5th completed level (offeredAfterLevel) replaces the shop with a draft:
# pick ONE of three assignments, or SKIP. Skipping is neutral. Accepting takes
# on the assignment's CONSTRAINT (a modifier curse and/or a behavioral rule like
# disabling Push Your Luck) for the whole 5-map block, and sets a MISSION: a task
# tracked across those maps. Clearing a mission tier pays a REWARD at block end.
#
# mission.track.mode:
#   cumulative  a running metric summed over the block (total locks / total
#               superior locks), or the count of maps that met a pass/fail
#               condition (underPar, speedClear, allBallsLocked).
#   everyMap    the count of maps whose per-map condition was met; tier
#               thresholds are maps-passed (out of 5).
# mission.track.kind: lockCount | superiorLocks | underPar | speedClear |
#                      allBallsLocked | ballType | noLocks | smashCount
#
# `ballType` is a BOUNTY: seal a named type of ball. Author it WITHOUT a type -
# the draft names one from the block's real roster (assignmentScaling.ts), and
# picks the RAREST type that still covers the top tier, because a bounty on a
# ball that turns up everywhere is an ordinary lock mission with extra words.
# Its mission text must carry a {{ballType}} placeholder. If no type in the
# block covers the top tier the assignment is dropped from the draft rather
# than offered unclearable. `ballType: green` pins one explicitly (tests).
#
# `noLocks` and `smashCount` are CONTENT-GATED the same way: their tiers are
# capped to what the block holds (maps winnable without a lock; breakables on
# the board), and the assignment is dropped from the draft when that is under
# two. So a clean-clear mission does not appear in act IV, where nearly every
# win is priced in locks, and a demolition mission does not appear in blocks
# with one breakable in them. See assignmentScaling.resolveForBlock.
# tiers: ascending thresholds; the highest reached pays.
#
# IMPORTANT for cumulative lockCount / superiorLocks missions: the thresholds
# here are a SHAPE, not a promise. They are scaled at draft time to a share of
# how many balls the block's five maps actually put on the board
# (assignmentScaling.ts), keeping the number of tiers and their relative
# spacing. Authored absolutely they were mostly impossible: 20 locks over a
# block that offers 11 balls, 40 over one that offers 14. Author the RATIO you
# want between the tiers and let the scaling place them; a player never sees
# these numbers, only the scaled ones.
#
# reward.type:
#   lives     { count }           overtime  { hours }
#   modifiers { blessing, modifiers, scope: run|block }   (good/bad bundle; can
#             deepen a key to "enhance" a top-tier upgrade's effect)
#   tierDraft { tier }            a free 1-of-3 upgrade pick (Junior..Architect)
#
# Balance (reassessed): rewards sit on ONE value scale so every assignment is
# worth the effort. Anchor: 1 life ~= 50 overtime (a Fault Tolerance life costs
# ~50h in the shop). The roster leans on LIVES and free UPGRADE PICKS, which read
# as clearly valuable; small flat-overtime payouts (~30h) were dropped because
# they never compared to a couple of lives. Per tier slot:
#   first tier  ~= +2 lives (a solid, comparable floor for taking the mission).
#   top tier    ~= a tierDraft or +3 lives, scaling UP with the constraint +
#                  mission difficulty (Senior -> Principal -> Architect pick).
# tierDraft is the mastery payoff and only sits on constrained assignments. Keep
# constraints survivable across five maps. No em-dashes in displayed strings.
offeredAfterLevel: 5

assignments:

  - id: lock_quota
    name: Lock Quota
    constraint:
      text: Balls move 10% faster.
      modifiers:
        ballSpeedMultiplier: 1.1
    mission:
      text: Lock balls across the next 5 maps.
      track: { mode: cumulative, kind: lockCount }
      tiers:
        - { threshold: 12, label: "+25 overtime", reward: { type: overtime, hours: 25 } }
        - { threshold: 20, label: "+40 overtime", reward: { type: overtime, hours: 40 } }
    clarify: A gentle, always-on speed tax for a payout that scales with how many balls you seal over the block. Locking two or three a map clears the first tier comfortably; a heavier block banks a bigger overtime bonus.

  - id: daily_standup
    name: Daily Standup
    constraint:
      text: Balls are 10% bigger.
      modifiers:
        ballSizeMultiplier: 1.1
    mission:
      text: Lock at least 2 balls in each of the next 5 maps.
      track: { mode: everyMap, kind: lockCount, params: { count: 2 } }
      tiers:
        - { threshold: 3, label: "+25 overtime", reward: { type: overtime, hours: 25 } }
        - { threshold: 5, label: "Pick a Senior upgrade", reward: { type: tierDraft, tier: Senior } }
    clarify: Consistency over volume. A map counts once you lock two balls in it; hit that in three of five maps for an overtime bonus, all five for a free Senior upgrade.

  - id: precision_review
    name: Precision Review
    constraint:
      text: Fences grow 10% slower.
      modifiers:
        fenceGenerationSpeedMultiplier: 0.9
    mission:
      text: Land superior locks across the next 5 maps.
      track: { mode: cumulative, kind: superiorLocks }
      tiers:
        - { threshold: 4, label: "+25 overtime", reward: { type: overtime, hours: 25 } }
        - { threshold: 8, label: "Pick a Senior upgrade", reward: { type: tierDraft, tier: Senior } }
    clarify: Rewards tight-pocket locks. Slower fences make snug pockets harder to seal, which is the point. Land eight superior locks over the block for a free Senior upgrade.

  - id: under_budget
    name: Under Budget
    constraint:
      text: Earn 10% less overtime.
      modifiers:
        scoreMultiplier: 0.9
    mission:
      text: Clear at or under par cuts in each of the next 5 maps.
      track: { mode: everyMap, kind: underPar, params: { delta: 0 } }
      tiers:
        - { threshold: 3, label: "+25 overtime", reward: { type: overtime, hours: 25 } }
        - { threshold: 5, label: "+45 overtime", reward: { type: overtime, hours: 45 } }
    clarify: Efficient cutting only. A map counts when you finish at or under its par. The overtime cut stings now; clean play across the block pays it back and then some.

  - id: sprint_review
    name: Sprint Review
    constraint:
      text: Scope Creep starts immediately, no grace period.
      modifiers:
        scopeCreepImmediate: 1
    mission:
      text: Clear each of the next 5 maps within 40 seconds.
      track: { mode: everyMap, kind: speedClear, params: { seconds: 40 } }
      tiers:
        - { threshold: 3, label: "+30 overtime", reward: { type: overtime, hours: 30 } }
        - { threshold: 5, label: "Pick a Principal upgrade", reward: { type: tierDraft, tier: Principal } }
    clarify: Built for fast, instinctive cutters. Balls surge from the first second, so there is no calm window. Clear inside 40 active seconds; sweep all five maps for a free Principal upgrade.

  # ZERO INCIDENTS. The first mission about SURVIVING rather than producing.
  # Every other contract pays for throughput, which pushes toward aggressive
  # cuts; this one pays for backing off, so it argues with the rest of a build
  # instead of stacking with it. The constraint tempts rather than punishes:
  # faster balls make the safe line slower, so caution costs something on every
  # map rather than being free.
  - id: zero_incidents
    name: Zero Incidents
    constraint:
      text: "Balls move 15% faster."
      modifiers:
        ballSpeedMultiplier: 1.15
    mission:
      text: "Finish each of the next 5 maps without losing a life."
      track:
        mode: everyMap
        kind: noLivesLost
      tiers:
        - threshold: 3
          label: "+3 lives"
          reward: { type: lives, count: 3 }
        - threshold: 5
          label: "Pick an Architect upgrade"
          reward: { type: tierDraft, tier: Architect }
    clarify: "A clean map is one you finished without a ball taking a life off you. The speed tax makes the careful line genuinely slower, so this is a contract about restraint, not about locking more."

  # BUDGET FREEZE. The only contract that is not about the board at all: you run
  # five maps on the build you walked in with, watching offers you cannot take.
  # It needs no constraint, because declining upgrades in a game about
  # compounding upgrades IS the constraint.
  #
  # Worth knowing when tuning the tiers: a five-map block offers only FOUR store
  # visits. Its last map is the assignment level, whose store is replaced by the
  # contract phase, so that map passes for free. The Hiring Freeze ascension
  # rung halves the visits again.
  - id: budget_freeze
    name: Budget Freeze
    constraint:
      text: "None. Going without is the job."
    mission:
      text: "Buy nothing from the store across the next 5 maps."
      track:
        mode: everyMap
        kind: noSpend
      tiers:
        - threshold: 3
          label: "+40 overtime"
          reward: { type: overtime, hours: 40 }
        - threshold: 5
          label: "Pick a Principal upgrade"
          reward: { type: tierDraft, tier: Principal }
    clarify: "Every hour you do not spend stays banked. The store still opens and still tempts you; walking out empty handed is the whole task, and the payout at the end is bigger than most of what you passed on."

  # DOUBLE DOWN. Push Your Luck is a decision layer no contract touched: two of
  # them FORBID pushing as a constraint, and none made it the point. This grades
  # the bet itself, and the constraint raises the stakes of that bet rather than
  # taxing the board, so the pressure lands where the mission is looking.
  - id: double_down
    name: Double Down
    # A slower fence is a longer exposure, and a push is the moment exposure
    # costs most: the map is already won, and every extra second of a fence
    # crawling across live space is a second the bet can be lost.
    #
    # NOT "a failed push costs a life", which is the constraint this contract
    # wants: no such modifier exists, and authoring one that nothing reads would
    # ship a constraint that reads as a rule and does nothing.
    constraint:
      text: "Fences grow 15% slower, so every push is a longer exposure."
      modifiers:
        fenceGenerationSpeedMultiplier: 0.85
    mission:
      text: "Win Push Your Luck bets across the next 5 maps."
      track:
        mode: cumulative
        kind: pushesWon
      tiers:
        - threshold: 2
          label: "+30 overtime"
          reward: { type: overtime, hours: 30 }
        - threshold: 4
          label: "Pick a Principal upgrade"
          reward: { type: tierDraft, tier: Principal }
        # A third rung, because a nervy contract should have somewhere further
        # to go. FIVE, not six: a map can bank at most one push, and a block is
        # five maps, so six would be an authored impossibility. This tier means
        # a push taken and won on every single map of the block.
        - threshold: 5
          label: "Pick an Architect upgrade"
          reward: { type: tierDraft, tier: Architect }
    clarify: "A push you bank counts; a push you lose does not, and now costs a life as well. Declining every offer is safe and scores nothing here, which is the point of taking the contract."

  - id: named_delivery
    name: Named Delivery
    constraint:
      text: Balls move 10% faster.
      modifiers:
        ballSpeedMultiplier: 1.1
    mission:
      text: Seal a {{ballType}} ball in each of the next 5 maps.
      track: { mode: everyMap, kind: ballType, params: { count: 1 } }
      tiers:
        - { threshold: 2, label: "+2 lives", reward: { type: lives, count: 2 } }
        - { threshold: 3, label: "Pick a Senior upgrade", reward: { type: tierDraft, tier: Senior } }
    clarify: Client asked for one by name. The ball is picked from the types this block actually spawns, and it is the scarcest one that still leaves the top tier reachable, so expect to hunt for it. Two maps pays two lives; four of five earns a free Senior upgrade.

  # The opposite of every other mission here. Locks are the entire economy, so
  # a map cleared clean is a map you deliberately left money on the board for -
  # wide sweeps instead of tight pockets, and every ball you COULD have sealed
  # is a temptation to refuse.
  #
  # The constraint is not a modifier, it is the truth: the store's lock toll
  # already shuts it when you do not lock, so a clean map is a map you cannot
  # shop after. That was going to happen whether or not it was written down.
  # Writing it down is the difference between a cost and an ambush.
  - id: ship_it
    name: Ship It
    constraint:
      text: The store stays shut after any map you ship clean.
    mission:
      text: Clear a map without sealing a single ball.
      track: { mode: everyMap, kind: noLocks }
      tiers:
        - { threshold: 2, label: "+2 lives", reward: { type: lives, count: 2 } }
        - { threshold: 3, label: "Pick a Principal upgrade", reward: { type: tierDraft, tier: Principal } }
    clarify: Lock nothing, clear everything. Sealing a ball fails that map for the mission, and the store's lock toll means a clean map is one you cannot shop after, so the run's income comes entirely from space and speed. Maps whose win demands a lock cannot count, and the target shrinks to fit the block.

  # Every other mission rewards steering balls AWAY from things. This one asks
  # you to aim them into something, which is the same skill pointed backwards,
  # and it gives the black ball and Deploy Charge a reason to exist on maps
  # that did not hand them to you.
  - id: tech_debt_writedown
    name: Tech Debt Writedown
    constraint:
      text: Fences grow 10% slower.
      modifiers:
        fenceGenerationSpeedMultiplier: 0.9
    mission:
      text: Smash breakable blocks across the next 5 maps.
      track: { mode: cumulative, kind: smashCount }
      tiers:
        - { threshold: 2, label: "+2 lives", reward: { type: lives, count: 2 } }
        - { threshold: 4, label: "Pick a Senior upgrade", reward: { type: tierDraft, tier: Senior } }
    clarify: Demolition work. Blocks break when balls hit them hard enough, and anything resting on one falls with it, so a well-aimed cut can bring down a stack. Slower fences make herding a ball into a block harder, which is the whole job. The target is sized to how many blocks the block's maps actually carry.
