# Capstones — the once-per-run exclusive perk ("Promotion").
#
# The first ORDINARY level at/past `offeredAfterLevel` routes through a mandatory
# 1-of-3 draft, before that level's shop. The pick applies for the rest of the
# run (surviving ascension); the two passed-over capstones are gone for good.
# These are rule-breakers, not stat bumps - one per archetype, so the pick can
# crown a build or rescue a weak one. Keys are GameModifiers
# (see README-modifiers.md).
#
# NOT an assignment level (every 5th by default). The draft used to ride the
# assignment phase, so it arrived fourth in a queue of five reward screens after
# the level-10 boss and read as more confetti rather than as the rarest choice
# in the game. capstoneDueAfter() skips assignment levels whatever this says, so
# setting it to a multiple of 5 pushes the draft to the next ordinary level
# rather than rebuilding the pile-up.
#
# 12 rather than 11: two maps of clear air after the boss, and still two thirds
# of the run left for the pick to matter.
offeredAfterLevel: 12

capstones:

  - id: stock_options
    name: Stock Options
    description: The per-map overtime cap rises by 20h for the rest of the run. Big multiplier builds finally pay.
    tag: risk
    clarify: Overtime is capped per map, so multipliers past the cap are wasted. This raises the cap by 20h every map. Useless on a low-multiplier build, run-defining on a stacked one.
    modifiers:
      overtimeCapBonus: 5

  - id: company_card
    name: Company Card
    description: The cheapest offer in every shop is free.
    tag: bank
    clarify: The cheapest upgrade in every shop is free. Over a run that is a lot of saved overtime for the expensive picks. Best if you shop every level.
    modifiers:
      freeCheapestOffer: 1

  - id: second_wind
    name: Second Wind
    description: Once per map, a fence survives a ball hit without costing a life.
    tag: safety
    clarify: "Every map starts with one fence shield: the first ball that would smash a growing fence is absorbed, no life lost. Refreshes each map."
    modifiers:
      wallShieldsPerMap: 1
  - id: cryo_protocol
    name: Cryo Protocol
    description: Power-up tokens freeze over and never expire, waiting on the board until you claim them.
    tag: freeze
    clarify: Pickup tokens ice over and stop expiring, so you can set up the perfect seal instead of racing the clock.
    modifiers:
      freezePickups: 1

  - id: golden_handshake
    name: Golden Handshake
    description: Every locked ball pays +1 overtime and counts as one ball bigger for the trap multiplier.
    tag: lock
    clarify: "Two lock payoffs at once: +1 overtime per lock, and each lock counts one ball bigger for the multi-trap multiplier. Snowballs on multi-lock maps."
    modifiers:
      overtimePerLock: 1
      simultaneousLockBonus: 1
