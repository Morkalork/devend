  # The one track whose provenance was never written down: MUSIC.md skips from
  # 31-35 straight to the end credits. It ships and it plays, so it is listed
  # rather than hidden, with the gap stated instead of guessed at. `artist:` is
  # omitted deliberately - the screen renders "Artist not recorded" for it, and
  # `src/test/musicCatalogue.test.ts` allows exactly this one file to be missing
  # its credit, so a second undocumented track fails the build.
  - file: maps_36-40.mp3
    title: Unknown
    source: Pixabay
    usedFor: band
    bandFrom: 36
    bandTo: 40

  - file: end-credits.mp3
