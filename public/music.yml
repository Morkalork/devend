# Music catalogue: what plays, who made it, and where it came from.
#
# The single source of truth for the Jukebox screen (welcome menu > Music).
# `file` is the served path under public/assets/music, so an entry with no file
# on disk is a broken row and the catalogue test says so.
#
# `usedFor` is a translation KEY, not display text: the screen looks up
# `music.usedFor.<key>` so "Levels 1-5" is a Swedish string in Swedish.
#
# Attribution is optional under the Pixabay license, which is exactly why it
# has to be deliberate: nobody is going to send a takedown to remind us.

license:
  name: Pixabay Content License
  url: https://pixabay.com/service/license-summary/

tracks:
