<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- minimum-scale is here for the direction that kept being reported: without
         it every browser that reads this tag was told it could scale DOWN as far
         as it liked. Kept in step with VIEWPORT_META_CONTENT (src/lib/viewportZoom.ts),
         which re-asserts this exact string to undo a zoom that got through.
         No viewport-fit=cover: the interface does not read safe-area insets, so
         the page must stay inside them (see VIEWPORT_META_CONTENT). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0f0a" />
    <title>Dev/End</title>
    <meta name="description" content="Slice. Trap. Survive." />
    <meta name="author" content="Morkalork" />

    <meta property="og:title" content="Dev/End" />
    <meta property="og:description" content="Slice. Trap. Survive." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Diagnostics, from the page's first moment (src/lib/bootDiagnostics.ts):
         errors are collected before any script of the game loads, so a chunk
         that fails or a crash during startup is on the record. Two fingers
         held still for two seconds, or five quick taps in the top-left
         corner, open the report, which is plain HTML and so shows even when
         the game's canvas shows nothing. Not one finger held: the game uses
         that. -->
    <script>
      (function () {
        var rec = window.__devendBoot = { start: performance.now(), errors: [] };
        function push(s) { rec.errors.push(String(s).slice(0, 400)); if (rec.errors.length > 30) rec.errors.shift(); }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) { push('failed to load: ' + (t.src || t.href)); return; }
          push('error: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          push('rejection: ' + (r && r.message ? (r.name || 'Error') + ': ' + r.message : String(r)));
        });
        function openReport() {
          if (window.__devendDiag) {
            window.__devendDiag();
            return;
          }
          alert('Dev/End did not start.\n\n' + navigator.userAgent + '\n\n' + rec.errors.join('\n'));
        }
        // Two fingers held still for two seconds. Touch events, not pointer
        // events: a phone that takes two fingers for a pinch cancels the
        // pointers (pointercancel) but still reports the touches.
        var timer = 0, startAt = null;
        function cancel() {
          clearTimeout(timer);
          timer = 0;
        }
        window.addEventListener('touchstart', function (e) {
          cancel();
          if (e.touches.length === 2) {
            startAt = [e.touches[0].clientX, e.touches[0].clientY, e.touches[1].clientX, e.touches[1].clientY];
            timer = setTimeout(function () {
              timer = 0;
              openReport();
            }, 2000);
          }
        }, { capture: true, passive: true });
        window.addEventListener('touchmove', function (e) {
          if (!timer || !startAt || e.touches.length < 2) {
            return;
          }
          var moved = Math.abs(e.touches[0].clientX - startAt[0]) + Math.abs(e.touches[0].clientY - startAt[1])
            + Math.abs(e.touches[1].clientX - startAt[2]) + Math.abs(e.touches[1].clientY - startAt[3]);
          if (moved > 60) {
            cancel();
          }
        }, { capture: true, passive: true });
        window.addEventListener('touchend', cancel, true);
        window.addEventListener('touchcancel', cancel, true);
        // Or five quick taps in the top-left corner, which needs no second finger.
        var taps = [];
        window.addEventListener('pointerdown', function (e) {
          if (e.clientX > 90 || e.clientY > 90) {
            taps = [];
            return;
          }
          // Quick: each tap within two seconds of the one before (a phone in
          // trouble may be slow to deliver them).
          var now = Date.now();
          if (taps.length && now - taps[taps.length - 1] > 2000) {
            taps = [];
          }
          taps.push(now);
          if (taps.length >= 5) {
            taps = [];
            openReport();
          }
        }, true);
      })();
    </script>

    <!-- The startup splash, as plain HTML: painted with the page's very first
         frame, before any script, font or background has loaded, so the first
         thing on screen is the splash and never the code background behind it.
         It stays the ONLY visible splash until it is dismissed: the canvas
         splash (TapToStartGate) runs underneath it, decides what it says
         ("Loading...", then "Tap to start") through src/lib/bootSplash.ts, and
         takes the tap, which reaches it because the game listens on the whole
         page. One rendering of the logo from first frame to last, so nothing
         can move when one hands over to another. Colours and sizes are the
         canvas splash's (ROLE.surface, COLOR.primary, ROLE.muted, GameTitle at
         48, the label in Oxanium 600 at 18). -->
    <link rel="preload" href="/assets/fonts/Michroma-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/Oxanium-600.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'BootLogo';
        src: url('/assets/fonts/Michroma-Regular.woff2') format('woff2');
        /* Invisible until loaded rather than a stand-in face that then swaps. */
        font-display: block;
      }
      @font-face {
        font-family: 'BootDisplay';
        src: url('/assets/fonts/Oxanium-600.woff2') format('woff2');
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: 'BootBengali';
        src: url('/assets/fonts/NotoSansBengali-600.woff2') format('woff2');
        font-weight: 600;
        font-display: block;
        /* Fetched only for Bangla text: the Latin labels never need it. */
        unicode-range: U+0964-0965, U+0980-09FE, U+200C-200D, U+25CC;
      }
      html, body { background: #0d1012; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #0d1012;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 200ms ease-out;
        /* Taps go through to the page, where the game hears them. */
        pointer-events: auto;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #boot-splash .title {
        font-family: 'BootLogo', sans-serif;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 2.4px;
        line-height: 1.2;
        background: linear-gradient(135deg, #0fff73, #14b858);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 7px rgba(15, 255, 115, 0.55));
        animation: boot-glow 2s ease-in-out infinite alternate;
      }
      /* The logo's halo breathes, as GameTitle's back layer does. */
      @keyframes boot-glow {
        from { filter: drop-shadow(0 0 7px rgba(15, 255, 115, 0.35)); }
        to { filter: drop-shadow(0 0 12px rgba(15, 255, 115, 0.7)); }
      }
      /* Under the logo, out of the centring, so its text never moves the logo. */
      #boot-splash .label {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + 56px);
        text-align: center;
        /* Bangla has no glyphs in Oxanium: the bundled Noto face, as on the canvas. */
        font-family: 'BootDisplay', 'BootBengali', sans-serif;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 1px;
        color: #8b968f;
        opacity: 0.6;
      }
      #boot-splash .label.tap {
        color: var(--boot-accent, #00ff88);
        opacity: 1;
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-label="Dev/End"><div class="title">Dev/End</div><div class="label"></div></div>
    <script>
      // "Loading..." from the first frame: it is, from the player's side. In
      // the language the game will pick (src/i18n: the saved choice, then the
      // device's, then English), with the strings of each locale's
      // welcome.loading (pinned by startupSplash.test.tsx).
      (function () {
        var loading = { en: 'Loading...', es: 'Cargando...', sv: 'Laddar...', bn: 'লোড হচ্ছে...' };
        var lang = null;
        try { lang = localStorage.getItem('jezzball_language'); } catch (e) { /* private mode */ }
        if (!loading[lang]) lang = (navigator.language || 'en').split('-')[0];
        if (!loading[lang]) lang = 'en';
        var el = document.getElementById('boot-splash');
        el.querySelector('.label').textContent = loading[lang];
        el.setAttribute('aria-label', loading[lang]);
      })();
    </script>
    <script>
      // Backstop only, for a page whose app never starts: once the canvas
      // splash has taken the splash over (bootSplash.ts), this does nothing.
      setTimeout(function () {
        var el = document.getElementById('boot-splash');
        if (el && !el.dataset.owned) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }
      }, 15000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
